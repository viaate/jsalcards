<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!-- Snowlight, one colour. Crystal and hill in currentColor, no tile: the same picture as the icon. Drawn on a 24 grid so the upright arm and the underside of the hill land on whole pixels at 24 and 48 px. Use on dark and on light, from 24 px up; smaller than that, use card/mark-for-card.svg. -->
