    <!-- everything above the mound, less the breath between crystal and snow -->
    <clipPath id="above"><path d="M0 0V19H0.5Q12 13 23.5 19H24V0Z"/></clipPath>
  </defs>
  <g clip-path="url(#above)">
    <g transform="translate(12 14.5)">
      <path d="M-1 0V-7.2L-4 -8.93V-11.33L-1 -9.6V-11.92L0 -12.5L1 -11.92V-9.6L4 -11.33V-8.93L1 -7.2V0Z"/>
