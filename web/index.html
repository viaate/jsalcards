      /* Design tokens, kept in step with src/styles/global.css (e2e/shell.spec.ts checks). */
      :root {
        color-scheme: dark;

        --bg: #000;
        --surface-1: #0a0a0a;
        --surface-2: #111;
        --border-1: #1f1f1f;
        --border-2: #2a2a2a;
        --text-1: #f5f5f5;
        --text-2: #a3a3a3;
        --text-3: #6b6b6b;

        --status-closed: #7fd4ff;
        --status-delayed: #ffc46b;
        --status-remote: #b79cff;
        --status-early-dismissal: #6bffb0;

        --font-sans: 'Geist Variable', system-ui, sans-serif;
        --font-mono: 'Geist Mono Variable', ui-monospace, monospace;

        /* Basemap hairlines. The WebGL style reads these, so the still and the map match. */
        --line-outline: #6b6b6b;
        --line-state: #2a2a2a;
        --hairline: 1px;

        /* Shell geometry. The initial view fits the US inside .frame, and the map reads its box. */
        --inset-top: env(safe-area-inset-top, 0px);
        --inset-right: env(safe-area-inset-right, 0px);
        --inset-bottom: env(safe-area-inset-bottom, 0px);
        --inset-left: env(safe-area-inset-left, 0px);
        --edge: 20px;
        --bar-height: 44px;
        --bar-width: 440px;
        --bar-font: 15px;
        --frame-gap: 24px;
        --frame-side: 48px;
        --frame-bottom: 48px;
      }

      /* On dense screens a hairline stays about one device pixel wide. */
      @media (min-resolution: 1.5dppx) {
        :root {
          --hairline: 0.75px;
        }
      }

      @media (min-resolution: 2.5dppx) {
        :root {
          --hairline: 0.6px;
        }
      }

      @media (max-width: 719px) {
        :root {
          --edge: 12px;
          --bar-font: 16px;
          --frame-gap: 20px;
          --frame-side: 16px;
          --frame-bottom: 24px;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text-1);
      }

      body {
        overflow: hidden;
        font-family: var(--font-sans);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .map {
        position: absolute;
        inset: 0;
      }

      .frame {
        position: absolute;
        top: calc(var(--inset-top) + var(--edge) + var(--bar-height) + var(--frame-gap));
        right: calc(var(--inset-right) + var(--frame-side));
        bottom: calc(var(--inset-bottom) + var(--frame-bottom));
        left: calc(var(--inset-left) + var(--frame-side));
        pointer-events: none;
      }

      .still {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke-width: var(--hairline);
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: opacity 240ms linear;
      }

      .still path {
        vector-effect: non-scaling-stroke;
      }

      .still-state {
        stroke: var(--line-state);
      }

      .still-outline {
        stroke: var(--line-outline);
      }

      .still.is-hidden {
        opacity: 0;
      }

      .bar {
        position: absolute;
        top: calc(var(--inset-top) + var(--edge));
        left: calc(var(--inset-left) + var(--edge));
        z-index: 2;
        display: flex;
        align-items: center;
        width: min(
          var(--bar-width),
          100% - var(--inset-left) - var(--inset-right) - 2 * var(--edge)
        );
        height: var(--bar-height);
        border: 1px solid var(--border-2);
        border-radius: calc(var(--bar-height) / 2);
        background: rgb(17 17 17 / 0.72);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        transition: border-color 120ms linear;
      }

      .bar:focus-within {
        border-color: var(--text-3);
      }

      .wordmark {
        flex: none;
        width: 104px;
        margin: 0;
        padding: 0 0 0 19px;
        overflow: hidden;
        font-size: 15px;
        font-weight: 600;
        line-height: 20px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        border-right: 1px solid var(--border-2);
      }

      .search {
        flex: 1;
        min-width: 0;
        height: 100%;
        margin: 0;
      }

      .search-input {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0 20px 0 14px;
        overflow: hidden;
        font: inherit;
        font-size: var(--bar-font);
        line-height: 20px;
        color: var(--text-1);
        text-overflow: ellipsis;
        background: transparent;
        border: 0;
        border-radius: 0 calc(var(--bar-height) / 2) calc(var(--bar-height) / 2) 0;
        outline: none;
        appearance: none;
      }

      .search-input::placeholder {
        color: var(--text-2);
        opacity: 1;
      }

      .search-input::-webkit-search-decoration,
      .search-input::-webkit-search-cancel-button {
        appearance: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .still,
        .bar {
          transition: none;
        }
      }
