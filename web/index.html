<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>%copy.appName%</title>
    <meta name="description" content="%copy.meta.description%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Critical CSS for the whole shell. It is the only stylesheet the first
      frame needs: App.svelte renders the same markup with these class names
      and carries no styles of its own, so nothing render-blocking is linked.
    -->
    <style>
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/node_modules/@fontsource-variable/geist/files/geist-latin-ext-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }

      /* Design tokens, kept in step with src/styles/global.css (e2e/shell.spec.ts checks). */
      :root {
        color-scheme: dark;

        --bg: #000;
        --surface-1: #0a0a0a;
        --surface-2: #111;
        --border-1: #1f1f1f;
        --border-2: #2a2a2a;
        --text-1: #f5f5f5;
        --text-2: #a3a3a3;
        --text-3: #6b6b6b;

        --status-closed: #7fd4ff;
        --status-delayed: #ffc46b;
        --status-remote: #b79cff;
        --status-early-dismissal: #6bffb0;

        --font-sans: 'Geist Variable', system-ui, sans-serif;
        --font-mono: 'Geist Mono Variable', ui-monospace, monospace;

        /* Basemap ground and hairlines. The WebGL style reads these, so the still and the map match. */
        --land: #000;
        --line-outline: #6b6b6b;
        --line-state: #2a2a2a;
        --hairline: 1px;

        /* Shell geometry. The initial view fits the US inside .frame, and the map reads its box. */
        --inset-top: env(safe-area-inset-top, 0px);
        --inset-right: env(safe-area-inset-right, 0px);
        --inset-bottom: env(safe-area-inset-bottom, 0px);
        --inset-left: env(safe-area-inset-left, 0px);
        --edge: 20px;
        --bar-height: 44px;
        /* The wordmark's column, fixed so a font swap never moves the search field. */
        --brand-width: 98px;
        --field-width: 400px;
        --bar-font: 15px;
        --brand-font: 17px;
        --brand-line: 24px;
        /* What the wordmark adds above the field where it sits on a line of its own (a phone). */
        --brand-stack: 0px;
        --frame-gap: 24px;
        --frame-side: 48px;
        --frame-bottom: 48px;
        /*
          Where a phone's home view sits across the country, 0 (the west coast
          at the frame's left edge) to 1 (the east coast at its right edge).
          The script below sets it from the time zone; the rest of the world
          opens on the middle of the country, where the land fills the frame.
        */
        --home-focus: 0.5;
      }

      /* On dense screens a hairline stays about one device pixel wide. */
      @media (min-resolution: 1.5dppx) {
        :root {
          --hairline: 0.75px;
        }
      }

      @media (min-resolution: 2.5dppx) {
        :root {
          --hairline: 0.6px;
        }
      }

      /* A phone: the wordmark on a line of its own over a full-width field, sized for a thumb. */
      @media (max-width: 719px) {
        :root {
          --edge: 16px;
          --bar-height: 48px;
          --bar-font: 16px;
          --brand-font: 20px;
          --brand-line: 28px;
          --brand-stack: 40px;
          --frame-gap: 24px;
          --frame-side: 16px;
          /* Clear of the legend's line at the foot of the screen, by the same gap as at the top. */
          --frame-bottom: 68px;
        }
      }

      /*
        A phone's small, bright screen, held either way: the lines clearer and
        the states named, so the country reads at a glance. The land stays the
        ground's black (the owner's call).
      */
      @media (max-width: 719px), (max-height: 519px) {
        :root {
          --line-outline: #8f8f8f;
          --line-state: #4d4d4d;
          --map-names: phone;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text-1);
      }

      body {
        overflow: hidden;
        font-family: var(--font-sans);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .map {
        position: absolute;
        inset: 0;
      }

      /* A soft veil under the top strip keeps its words clear of the streets beneath them. */
      .stage::before {
        position: absolute;
        inset: 0 0 auto;
        z-index: 1;
        height: calc(
          var(--inset-top) + var(--edge) + var(--brand-stack) + var(--bar-height) + 40px
        );
        pointer-events: none;
        content: '';
        background: linear-gradient(
          rgb(0 0 0 / 0.64),
          rgb(0 0 0 / 0.5) 25%,
          rgb(0 0 0 / 0.28) 55%,
          rgb(0 0 0 / 0.1) 80%,
          rgb(0 0 0 / 0)
        );
      }

      .frame {
        position: absolute;
        top: calc(
          var(--inset-top) + var(--edge) + var(--brand-stack) + var(--bar-height) + var(--frame-gap)
        );
        right: calc(var(--inset-right) + var(--frame-side));
        bottom: calc(var(--inset-bottom) + var(--frame-bottom));
        left: calc(var(--inset-left) + var(--frame-side));
        pointer-events: none;
      }

      .still {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke-width: var(--hairline);
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: opacity 240ms linear;
      }

      .still path {
        vector-effect: non-scaling-stroke;
      }

      .still-land {
        fill: var(--land);
      }

      .still-state {
        stroke: var(--line-state);
      }

      .still-outline {
        stroke: var(--line-outline);
      }

      .still.is-hidden {
        opacity: 0;
      }

      /*
        A phone held upright: the whole country would be a thin band across the
        middle, so the home view fills the frame's height with it and lets its
        width run off the sides, placed across by --home-focus. The map reads
        --home-fit to open at the same view (src/map/basemap/limits.ts).
      */
      @media (max-width: 719px) and (orientation: portrait) {
        .frame {
          --home-fit: cover;

          container-type: size;
        }

        .still {
          position: absolute;
          top: 50%;
          left: 0;
          width: auto;
          height: max(100cqh, 100cqw * 4385.37 / 8000);
          aspect-ratio: 8000 / 4385.37;
          translate: calc(var(--home-focus) * (100cqw - 100%)) -50%;
        }
      }

      /* The top strip: the wordmark, then the search field. The update time sits at the right. */
      .bar {
        position: absolute;
        top: calc(var(--inset-top) + var(--edge));
        left: calc(var(--inset-left) + var(--edge));
        z-index: 2;
        display: grid;
        grid-template-columns: var(--brand-width) minmax(0, 1fr);
        align-items: center;
        width: min(
          var(--brand-width) + var(--field-width),
          100% - var(--inset-left) - var(--inset-right) - 2 * var(--edge)
        );
        height: var(--bar-height);
        /* Where the results list starts: under the field on a wide screen. */
        --results-left: var(--brand-width);
      }

      /* Its box is the name alone, so a mask over it covers the name and nothing else. */
      .wordmark {
        justify-self: start;
        max-width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-size: var(--brand-font);
        font-weight: 600;
        line-height: var(--brand-line);
        letter-spacing: -0.025em;
        white-space: nowrap;
        text-shadow:
          0 0 2px #000,
          0 0 10px #000;
        /* A layer of its own from the first frame, so its text renders the same once the map is under it. */
        will-change: transform;
      }

      .search {
        position: relative;
        height: 100%;
        min-width: 0;
        margin: 0;
        cursor: text;
        /* Solid, not a blur of the map behind it: a backdrop blur over the WebGL map makes some GPUs flicker while it moves. */
        background: rgb(17 17 17);
        border: 1px solid var(--border-2);
        border-radius: calc(var(--bar-height) / 2);
        /* A faint top edge and a soft shadow lift the field off the streets below it. */
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.04),
          0 6px 20px rgb(0 0 0 / 0.5);
        transition: border-color 120ms linear;
      }

      .search:focus-within {
        border-color: var(--text-3);
      }

      .search-icon,
      .search-key,
      .search-clear {
        position: absolute;
        top: 50%;
      }

      .search-icon {
        left: 16px;
        width: 16px;
        height: 16px;
        margin-top: -8px;
        pointer-events: none;
        fill: none;
        stroke: var(--text-3);
        stroke-width: 1.5;
        stroke-linecap: round;
        transition: stroke 120ms linear;
      }

      .search:hover .search-icon,
      .search:focus-within .search-icon {
        stroke: var(--text-2);
      }

      .search-input {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0 46px 0 42px;
        overflow: hidden;
        font: inherit;
        font-size: var(--bar-font);
        line-height: 20px;
        color: var(--text-1);
        text-overflow: ellipsis;
        cursor: text;
        background: transparent;
        border: 0;
        border-radius: inherit;
        outline: none;
        appearance: none;
      }

      .search-input::placeholder {
        color: var(--text-2);
        opacity: 1;
      }

      .search-input::-webkit-search-decoration,
      .search-input::-webkit-search-cancel-button {
        appearance: none;
      }

      /* "/" goes to the field; shown only where there is a keyboard and nothing typed yet. */
      .search-key {
        right: 13px;
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-top: -10px;
        color: var(--text-3);
        pointer-events: none;
        border: 1px solid var(--border-2);
        border-radius: 5px;
        transition: opacity 120ms linear;
      }

      .search-key svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      .search:focus-within .search-key,
      .search.has-query .search-key {
        opacity: 0;
      }

      .search-clear {
        right: 8px;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin: -14px 0 0;
        padding: 0;
        color: var(--text-2);
        cursor: pointer;
        background: transparent;
        border: 0;
        border-radius: 50%;
      }

      .search-clear:hover,
      .search-clear:focus-visible {
        color: var(--text-1);
        background: var(--border-1);
      }

      .search-clear:focus-visible {
        outline: 1px solid var(--text-3);
        outline-offset: 0;
      }

      .search-clear svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      /* Touch screens have no "/" key to press: the field keeps its space for text. */
      @media (hover: none), (pointer: coarse) {
        .search-key {
          display: none;
        }

        .search-input {
          padding-right: 16px;
        }
      }

      .search.has-query .search-input {
        padding-right: 44px;
      }

      /*
        A phone: the wordmark on its own line, and under it the field from edge to
        edge, where a thumb finds it; the results span the same width.
      */
      @media (max-width: 719px) {
        .bar {
          grid-template-rows: var(--brand-line) var(--bar-height);
          grid-template-columns: minmax(0, 1fr);
          row-gap: calc(var(--brand-stack) - var(--brand-line));
          width: calc(100% - var(--inset-left) - var(--inset-right) - 2 * var(--edge));
          height: calc(var(--brand-stack) + var(--bar-height));
          --results-left: 0px;
        }

        .search-icon {
          left: 16px;
          width: 18px;
          height: 18px;
          margin-top: -9px;
          stroke: var(--text-2);
        }

        .search-input {
          padding-left: 46px;
        }

        .search.has-query .search-input {
          padding-right: 48px;
        }

        /* A thumb's worth of target at the field's end. */
        .search-clear {
          right: 4px;
          width: 40px;
          height: 40px;
          margin-top: -20px;
        }
      }

      /*
        The key to the map's four lights, in the bottom corner across from the
        attribution: each status in its own color and shape, as the map draws it.
      */
      .legend {
        position: absolute;
        bottom: calc(var(--inset-bottom) + var(--edge));
        left: calc(var(--inset-left) + var(--edge));
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        max-width: calc(
          100% - var(--inset-left) - var(--inset-right) - 2 * var(--edge) - var(--legend-clear)
        );
        min-height: 28px;
        margin: 0;
        padding: 0;
        font-size: 12px;
        font-weight: 450;
        line-height: 16px;
        color: var(--text-2);
        white-space: nowrap;
        list-style: none;
        pointer-events: none;
        text-shadow:
          0 0 2px #000,
          0 0 8px #000;
        /* Room for the attribution button at the other end of the line. */
        --legend-clear: 40px;
      }

      /*
        On a phone, a button that takes the map to where the phone is: a
        thumb's reach above the attribution's corner, solid like the search
        field (no backdrop blur over the moving map).
      */
      .locate {
        position: absolute;
        right: calc(var(--inset-right) + var(--edge));
        bottom: calc(var(--inset-bottom) + var(--edge) + 28px + 12px);
        z-index: 2;
        display: none;
        place-items: center;
        width: 48px;
        height: 48px;
        margin: 0;
        padding: 0;
        color: var(--text-2);
        cursor: pointer;
        background: rgb(17 17 17);
        border: 1px solid var(--border-2);
        border-radius: 50%;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.04),
          0 6px 20px rgb(0 0 0 / 0.5);
        transition:
          color 120ms linear,
          border-color 120ms linear;
      }

      .locate:hover,
      .locate:focus-visible {
        color: var(--text-1);
        border-color: var(--text-3);
      }

      .locate:focus-visible {
        outline: none;
      }

      .locate svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linejoin: round;
      }

      /* Asking the phone where it is: the arrow breathes until it answers. */
      .locate.is-locating svg {
        animation: locating 900ms ease-in-out infinite alternate;
      }

      @keyframes locating {
        to {
          opacity: 0.35;
        }
      }

      @media (max-width: 719px) {
        .locate {
          display: grid;
        }
      }

      /* The narrowest phones: two lines of two. */
      @media (max-width: 374px) {
        .legend {
          display: grid;
          grid-template-columns: auto auto;
          justify-content: start;
        }
      }

      .legend li {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .glyph {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .glyph.is-closed {
        background: var(--status-closed);
        box-shadow: 0 0 6px color-mix(in srgb, var(--status-closed) 50%, transparent);
      }

      .glyph.is-delayed {
        box-shadow:
          inset 0 0 0 1.5px var(--status-delayed),
          0 0 6px color-mix(in srgb, var(--status-delayed) 45%, transparent);
      }

      /* The map's diamond reaches a fifth past the dot's radius. */
      .glyph.is-remote {
        width: 7px;
        height: 7px;
        background: var(--status-remote);
        border-radius: 1px;
        box-shadow: 0 0 6px color-mix(in srgb, var(--status-remote) 50%, transparent);
        transform: rotate(45deg);
      }

      .glyph.is-early-dismissal {
        background: linear-gradient(90deg, var(--status-early-dismissal) 50%, transparent 50%);
        box-shadow:
          inset 0 0 0 1.5px var(--status-early-dismissal),
          0 0 6px color-mix(in srgb, var(--status-early-dismissal) 45%, transparent);
      }

      /* Heard by screen readers, never seen. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        white-space: nowrap;
        border: 0;
        clip-path: inset(50%);
      }

      @media (prefers-reduced-motion: reduce) {
        .still,
        .search,
        .search-icon,
        .search-key,
        .locate {
          transition: none;
        }

        .locate.is-locating svg {
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
    <script>
      // A phone opens on its own part of the country, told by its time zone: the
      // West Coast, the Mountain states, the middle or the East. Anywhere else,
      // --home-focus keeps its value above. Before the first paint, so the still is drawn there.
      (function () {
        var zone = '';
        try {
          zone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        } catch (error) {
          return;
        }
        // The first match wins: Indiana's Central time zones before the rest of the state's.
        var parts = [
          [/^(America\/Los_Angeles|US\/Pacific)$/, 0],
          [/^(America\/(Denver|Boise|Phoenix)|US\/(Mountain|Arizona))$/, 0.22],
          [
            /^(America\/(Chicago|Menominee|Indiana\/(Knox|Tell_City)|North_Dakota\/\w+)|US\/Central)$/,
            0.5,
          ],
          [
            /^(America\/(New_York|Detroit|Kentucky\/\w+|Indiana\/\w+)|US\/(Eastern|Michigan))$/,
            0.95,
          ],
        ];
        for (var i = 0; i < parts.length; i++) {
          if (parts[i][0].test(zone)) {
            document.documentElement.style.setProperty('--home-focus', String(parts[i][1]));
            return;
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <!--
        The static shell. It paints before any script runs; main.ts swaps in the
        identical Svelte-rendered shell in one task, so no frame shows the swap.
        The still is the continental outline and state lines, generated by
        scripts/build-geo.mjs, drawn where the WebGL map draws them at the
        initial view until the map takes over.
      -->
      <main class="stage" data-static-shell>
        <div class="frame" aria-hidden="true">
          <!-- geo:still:start --><svg
            class="still"
            viewBox="0 0 8000 4385.37"
            preserveAspectRatio="xMidYMid meet"
            aria-hidden="true"
            focusable="false"
          >
            <defs>
              <path
