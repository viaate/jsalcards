<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- waitlist:off:end -->
    <!--
      Critical CSS for the whole shell, and the map's. It is the only
      stylesheet the page has: App.svelte renders the same markup with these
      class names and carries no styles of its own, so nothing render-blocking
      is linked, and nothing restyles the page later.
    -->
    <style>
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/node_modules/@fontsource-variable/geist/files/geist-latin-ext-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }

      /* Design tokens, kept in step with src/styles/global.css (e2e/shell.spec.ts checks). */
      :root {
        color-scheme: dark;

        --bg: #000;
        --surface-1: #0a0a0a;
        --surface-2: #111;
        --border-1: #1f1f1f;
        --border-2: #2a2a2a;
        --text-1: #f5f5f5;
        --text-2: #a3a3a3;
        --text-3: #6b6b6b;

        --status-closed: #7fd4ff;
        --status-delayed: #ffc46b;
        --status-remote: #b79cff;
        --status-early-dismissal: #6bffb0;

        --font-sans: 'Geist Variable', system-ui, sans-serif;
        --font-mono: 'Geist Mono Variable', ui-monospace, monospace;

        /* Basemap ground and hairlines. The WebGL style reads these, so the still and the map match. */
        --land: #000;
        --line-outline: #6b6b6b;
        --line-state: #2a2a2a;
        --hairline: 1px;

        /* Shell geometry. The initial view fits the US inside .frame, and the map reads its box. */
        --inset-top: env(safe-area-inset-top, 0px);
        --inset-right: env(safe-area-inset-right, 0px);
        --inset-bottom: env(safe-area-inset-bottom, 0px);
        --inset-left: env(safe-area-inset-left, 0px);
        --edge: 20px;
        --bar-height: 44px;
        /*
          The strip's room, all of it fixed, so a font swap never moves the
          field: the wordmark's slot at the left (the name as Geist sets it, and
          a little over), the gap after it, and the room kept at the right for
          the update time.
        */
        --brand-width: 84px;
        --brand-gap: 20px;
        --side-width: 180px;
        --field-width: 400px;
        /*
          The menu's button just after the field: as tall as it, a little closer
          to it than the field is to the wordmark. Its room, with the gap kept
          before the update time, comes out of the field, never the time's own.
        */
        --menu-size: var(--bar-height);
        --menu-gap: 10px;
        --menu-room: calc(var(--menu-gap) + var(--menu-size) + 12px - var(--brand-gap));
        --bar-font: 15px;
        --brand-font: 17px;
        --brand-line: 24px;
        /* What the wordmark adds above the field where it sits on a line of its own (a phone). */
        --brand-stack: 0px;
        --frame-gap: 24px;
        --frame-side: 48px;
        --frame-bottom: 48px;
        /* The controls' one height: the legend and the attribution button in the bottom row. */
        --control-height: 28px;
      }

      /* On dense screens a hairline stays about one device pixel wide. */
      @media (min-resolution: 1.5dppx) {
        :root {
          --hairline: 0.75px;
        }
      }

      @media (min-resolution: 2.5dppx) {
        :root {
          --hairline: 0.6px;
        }
      }

      /* A phone: the wordmark on a line of its own over a full-width field, sized for a thumb. */
      @media (max-width: 719px) {
        :root {
          --edge: 16px;
          --bar-height: 48px;
          --bar-font: 16px;
          --brand-font: 20px;
          --brand-line: 28px;
          --brand-stack: 40px;
          /* The menu's button across from the wordmark, on its line. */
          --menu-size: 36px;
          --frame-gap: 24px;
          /* The country from one side of the page to the other, as wide as the search field. */
          --frame-side: 16px;
          /* Clear of the legend at the foot of the screen, by the same gap as under the search field. */
          --frame-bottom: calc(var(--edge) + var(--control-height) + var(--frame-gap));
        }
      }

      /*
        A phone's small, bright screen, held either way: the lines clearer and
        the states named, so the country reads at a glance. The land stays the
        ground's black (the owner's call). It opens on the whole country, or
        over its viewer's own area once they have let the site know where they
        are (src/app/nearby.ts).
      */
      @media (max-width: 719px), (max-height: 519px) {
        :root {
          --line-outline: #8f8f8f;
          --line-state: #4d4d4d;
          --map-names: phone;
          --home-view: nearby;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text-1);
      }

      body {
        overflow: hidden;
        font-family: var(--font-sans);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Clipped, not a scroller: a control focused below the sheet's fold never scrolls the page up. */
        overflow: clip;
        background: var(--bg);
      }

      .map {
        position: absolute;
        inset: 0;
      }

      /* A soft veil under the top strip keeps its words clear of the streets beneath them. */
      .stage::before {
        position: absolute;
        inset: 0 0 auto;
        z-index: 1;
        height: calc(
          var(--inset-top) + var(--edge) + var(--brand-stack) + var(--bar-height) + 40px
        );
        pointer-events: none;
        content: '';
        background: linear-gradient(
          rgb(0 0 0 / 0.64),
          rgb(0 0 0 / 0.5) 25%,
          rgb(0 0 0 / 0.28) 55%,
          rgb(0 0 0 / 0.1) 80%,
          rgb(0 0 0 / 0)
        );
      }

      .frame {
        position: absolute;
        top: calc(
          var(--inset-top) + var(--edge) + var(--brand-stack) + var(--bar-height) + var(--frame-gap)
        );
        right: calc(var(--inset-right) + var(--frame-side));
        bottom: calc(var(--inset-bottom) + var(--frame-bottom));
        left: calc(var(--inset-left) + var(--frame-side));
        pointer-events: none;
      }

      .still {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke-width: var(--hairline);
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: opacity 240ms linear;
      }

      .still path {
        vector-effect: non-scaling-stroke;
      }

      .still-land {
        fill: var(--land);
      }

      .still-state {
        stroke: var(--line-state);
      }

      .still-outline {
        stroke: var(--line-outline);
      }

      .still.is-hidden {
        opacity: 0;
      }

      /*
        The top strip, edge to edge: the wordmark at the left edge with the
        search field just after it (the owner's call), and the update time at
        the right edge. The field narrows before the update time's room does.
      */
      .bar {
        position: absolute;
        top: calc(var(--inset-top) + var(--edge));
        right: calc(var(--inset-right) + var(--edge));
        left: calc(var(--inset-left) + var(--edge));
        z-index: 2;
        display: grid;
        grid-template-columns:
          var(--brand-width) minmax(0, var(--field-width))
          minmax(calc(var(--menu-room) + var(--side-width)), 1fr);
        column-gap: var(--brand-gap);
        align-items: center;
        height: var(--bar-height);
        /* The strip is the map's where nothing is on it. */
        pointer-events: none;
        /*
          A layer of its own from the first paint, over the still and the map
          alike: its text is drawn the same way before the map takes over and
          after, so nothing in the strip changes at the handover.
        */
        will-change: transform;
        /* Where the results list runs: under the field, as wide as it. */
        --results-left: calc(var(--brand-width) + var(--brand-gap));
        --results-right: calc(
          100% - var(--results-left) -
            max(
              0px,
              min(
                var(--field-width),
                100% - var(--results-left) - var(--brand-gap) - var(--menu-room) - var(--side-width)
              )
            )
        );
      }

      .bar > * {
        pointer-events: auto;
      }

      /* Open, its results list goes over the controls at the foot of the screen. */
      .bar:has(.results) {
        z-index: 3;
      }

      /*
        Its box is the name alone, so a mask over it covers the name and nothing
        else. Beside the field, a fallback face wider than its slot runs a
        little into the gap after it until Geist loads, as the legend's keys do.
      */
      .wordmark {
        grid-column: 1;
        justify-self: start;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-size: var(--brand-font);
        font-weight: 600;
        line-height: var(--brand-line);
        letter-spacing: -0.025em;
        white-space: nowrap;
        text-shadow:
          0 0 2px #000,
          0 0 10px #000;
        /* A layer of its own from the first frame, so its text renders the same once the map is under it. */
        will-change: transform;
      }

      .search {
        grid-column: 2;
        position: relative;
        height: 100%;
        min-width: 0;
        margin: 0;
        cursor: text;
        /*
          Solid, the brightest surface, not a blur of the map behind it: a
          backdrop blur over the WebGL map makes some GPUs flicker while it moves.
        */
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        border-radius: calc(var(--bar-height) / 2);
        /*
          A clear edge on any map: a light top edge inside, a black ring just
          outside that parts the border from the streets, and a shadow that
          lifts the field off them.
        */
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.07),
          0 0 0 1px var(--bg),
          0 8px 24px rgb(0 0 0 / 0.6);
        transition: border-color 120ms linear;
      }

      .search:focus-within {
        border-color: var(--text-3);
      }

      .search-icon,
      .search-key,
      .search-clear {
        position: absolute;
        top: 50%;
      }

      .search-icon {
        left: 16px;
        width: 16px;
        height: 16px;
        margin-top: -8px;
        pointer-events: none;
        fill: none;
        stroke: var(--text-2);
        stroke-width: 1.5;
        stroke-linecap: round;
        transition: stroke 120ms linear;
      }

      .search:hover .search-icon,
      .search:focus-within .search-icon {
        stroke: var(--text-1);
      }

      .search-input {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0 46px 0 42px;
        overflow: hidden;
        font: inherit;
        font-size: var(--bar-font);
        line-height: 20px;
        color: var(--text-1);
        text-overflow: ellipsis;
        cursor: text;
        background: transparent;
        border: 0;
        border-radius: inherit;
        outline: none;
        appearance: none;
      }

      .search-input::placeholder {
        color: var(--text-2);
        opacity: 1;
      }

      .search-input::-webkit-search-decoration,
      .search-input::-webkit-search-cancel-button {
        appearance: none;
      }

      /* "/" goes to the field; shown only where there is a keyboard and nothing typed yet. */
      .search-key {
        right: 13px;
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-top: -10px;
        color: var(--text-3);
        pointer-events: none;
        border: 1px solid var(--border-2);
        border-radius: 5px;
        transition: opacity 120ms linear;
      }

      .search-key svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      .search:focus-within .search-key,
      .search.has-query .search-key {
        opacity: 0;
      }

      .search-clear {
        right: 8px;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin: -14px 0 0;
        padding: 0;
        color: var(--text-2);
        cursor: pointer;
        background: transparent;
        border: 0;
        border-radius: 50%;
      }

      .search-clear:hover,
      .search-clear:focus-visible {
        color: var(--text-1);
        background: var(--border-1);
      }

      .search-clear:focus-visible {
        outline: 1px solid var(--text-3);
        outline-offset: 0;
      }

      .search-clear svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      /* Touch screens have no "/" key to press: the field keeps its space for text. */
      @media (hover: none), (pointer: coarse) {
        .search-key {
          display: none;
        }

        .search-input {
          padding-right: 16px;
        }
      }

      .search.has-query .search-input {
        padding-right: 44px;
      }

      /*
        The menu's button, just after the field: round, as tall as the field and
        as solid, its two lines crossing while the menu is open.
      */
      .menu-button {
        position: relative;
        grid-column: 3;
        justify-self: start;
        display: grid;
        place-items: center;
        width: var(--menu-size);
        height: var(--menu-size);
        margin: 0 0 0 calc(var(--menu-gap) - var(--brand-gap));
        padding: 0;
        color: var(--text-2);
        cursor: pointer;
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        border-radius: 50%;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.07),
          0 0 0 1px var(--bg),
          0 8px 24px rgb(0 0 0 / 0.6);
        transition:
          color 120ms linear,
          border-color 120ms linear;
      }

      .menu-button:hover,
      .menu-button[aria-expanded='true'] {
        color: var(--text-1);
        border-color: var(--text-3);
      }

      .menu-button:focus-visible {
        color: var(--text-1);
        outline: 1px solid var(--text-2);
        outline-offset: 2px;
      }

      /* The menu has the map show less than everything (ui/MenuHost.svelte): a dot on its button says so. */
      .stage[data-filtered] .menu-button::before {
        position: absolute;
        top: 20%;
        right: 20%;
        width: 6px;
        height: 6px;
        content: '';
        background: var(--text-1);
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--surface-2);
      }

      /* Its two lines, drawn as the other icons are: 1.5px, round ends, in a 16px square. */
      .menu-lines {
        position: relative;
        width: 16px;
        height: 16px;
      }

      .menu-lines::before,
      .menu-lines::after {
        position: absolute;
        right: 2.25px;
        left: 2.25px;
        height: 1.5px;
        content: '';
        background: currentColor;
        border-radius: 1px;
        transition: transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .menu-lines::before {
        top: 4.75px;
      }

      .menu-lines::after {
        top: 9.75px;
      }

      .menu-button[aria-expanded='true'] .menu-lines::before {
        transform: translateY(2.5px) rotate(45deg);
      }

      .menu-button[aria-expanded='true'] .menu-lines::after {
        transform: translateY(-2.5px) rotate(-45deg);
      }

      /* Open, the menu takes the school panel's place; closed, the school comes back as it was. */
      .stage:has(.menu) .detail {
        visibility: hidden;
      }

      /*
        A phone: the wordmark on its own line, and under it the field from edge to
        edge, where a thumb finds it; the results span the same width. The menu's
        button sits across from the wordmark, on its line.
      */
      @media (max-width: 719px) {
        .bar {
          grid-template-rows: var(--brand-line) var(--bar-height);
          grid-template-columns: minmax(0, 1fr);
          row-gap: calc(var(--brand-stack) - var(--brand-line));
          height: calc(var(--brand-stack) + var(--bar-height));
          --results-left: 0px;
          --results-right: 0px;
        }

        .wordmark,
        .search,
        .menu-button {
          grid-column: 1;
        }

        .wordmark,
        .menu-button {
          grid-row: 1;
        }

        .search {
          grid-row: 2;
        }

        .menu-button {
          align-self: center;
          justify-self: end;
          margin: 0;
        }

        /* A thumb's worth of target around the button. */
        .menu-button::after {
          position: absolute;
          inset: -4px;
          content: '';
        }

        .search-icon {
          left: 16px;
          width: 18px;
          height: 18px;
          margin-top: -9px;
          stroke: var(--text-2);
        }

        .search-input {
          padding-left: 46px;
        }

        .search.has-query .search-input {
          padding-right: 48px;
        }

        /* A thumb's worth of target at the field's end. */
        .search-clear {
          right: 4px;
          width: 40px;
          height: 40px;
          margin-top: -20px;
        }
      }

      /*
        A soft veil along the foot of the screen, as under the top strip: on
        the black ground it is not there at all, and over the streets it keeps
        the key's words clear without a chip around them. Low enough to leave
        the country's lines at the national view as they are.
      */
      .stage::after {
        position: absolute;
        inset: auto 0 0;
        z-index: 1;
        height: calc(var(--inset-bottom) + var(--edge) + var(--control-height) + 12px);
        pointer-events: none;
        content: '';
        background: linear-gradient(
          rgb(0 0 0 / 0),
          rgb(0 0 0 / 0.1) 20%,
          rgb(0 0 0 / 0.28) 45%,
          rgb(0 0 0 / 0.5) 75%,
          rgb(0 0 0 / 0.64)
        );
      }

      /*
        The key to the map's four lights, in the bottom corner across from the
        attribution, level with the wordmark above it: each status in its own
        color and shape, as the map draws it, set on the map itself like the
        update time, with no chip around it. The map's labels keep clear of it.
        Once the live file lights schools, each status gives how many the map
        shows (App.svelte), and a status with none dims.
      */
      .legend {
        position: absolute;
        bottom: calc(var(--inset-bottom) + var(--edge));
        left: calc(var(--inset-left) + var(--edge));
        z-index: 2;
        /*
          One line, never wrapped: a line that wrapped in the fallback face and
          came back to one in Geist would move the key as the font loads.
        */
        display: flex;
        flex-wrap: nowrap;
        gap: 8px var(--legend-gap);
        align-items: center;
        min-height: var(--control-height);
        margin: 0;
        padding: 0;
        font-size: var(--legend-font);
        font-weight: 500;
        line-height: 16px;
        color: var(--text-2);
        white-space: nowrap;
        list-style: none;
        pointer-events: none;
        text-shadow:
          0 0 2px #000,
          0 0 8px #000;
        /* The space between the keys, and between each mark and its word. */
        --legend-gap: 20px;
        --legend-font: 12px;
        --key-gap: 7px;
      }

      /*
        A soft shadow under the key, with no edge to it: nothing on the black
        ground, and over the streets it dims what runs under the words (a
        school's light, a street), so no light on the map is taken for a mark
        of the key.
      */
      .legend::before {
        position: absolute;
        inset: 0 -8px;
        z-index: -1;
        pointer-events: none;
        content: '';
        background: rgb(0 0 0 / 0.72);
        border-radius: calc(var(--control-height) / 2);
        box-shadow: 0 0 16px 8px rgb(0 0 0 / 0.72);
      }

      /*
        On a phone, a button that takes the map to where the phone is: a
        thumb's reach above the attribution's corner, solid like the search
        field (no backdrop blur over the moving map).
      */
      .locate {
        position: absolute;
        right: calc(var(--inset-right) + var(--edge));
        bottom: calc(var(--inset-bottom) + var(--edge) + var(--control-height) + 12px);
        z-index: 2;
        display: none;
        place-items: center;
        width: 48px;
        height: 48px;
        margin: 0;
        padding: 0;
        color: var(--text-2);
        cursor: pointer;

    <div id="lock" hidden>
      <form id="lock-form" autocomplete="off">
        <input
          id="lock-input"
          type="password"
          inputmode="numeric"
          placeholder="%copy.lock.password%"
          aria-label="%copy.lock.password%"
        />
      </form>
    </div>
    <script>
      (function () {
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return;
        try {
          if (localStorage.getItem('sl-lock') === 'MjM4MQ==') return;
        } catch (e) {}
        var lock = document.getElementById('lock');
        var input = document.getElementById('lock-input');
        lock.hidden = false;
        input.focus();
        document.getElementById('lock-form').addEventListener('submit', function (event) {
          event.preventDefault();
          if (btoa(input.value) === 'MjM4MQ==') {
            try {
              localStorage.setItem('sl-lock', 'MjM4MQ==');
            } catch (e) {}
            lock.remove();
          } else {
            input.value = '';
            lock.classList.add('is-wrong');
          }
        });
        input.addEventListener('input', function () {
          lock.classList.remove('is-wrong');
          if (btoa(input.value) === 'MjM4MQ==')
            document.getElementById('lock-form').requestSubmit();
        });
      })();
    </script>
