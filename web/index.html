<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>%copy.appName%</title>
    <meta name="description" content="%copy.meta.description%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      The black stage is static SVG so the first frame paints before any script
      runs. A bare background color would not register as a contentful paint.
    -->
    <svg
      class="backdrop"
      aria-hidden="true"
      focusable="false"
      viewBox="0 0 1 1"
      preserveAspectRatio="none"
    >
      <rect width="1" height="1" fill="#000" />
    </svg>
    <div id="app"></div>
  </body>
</html>
