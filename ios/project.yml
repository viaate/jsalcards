# The only definition of the Xcode project. XcodeGen (pinned in
# .github/workflows/ios-app.yml) turns this file into ios/Snowlight.xcodeproj, which is
# never committed. No team, no signing identity and no profile belongs in this file.
name: Snowlight
options:
  bundleIdPrefix: com.snowlightmap
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SnowlightCore:
    path: SnowlightCore
  SnowlightKit:
    path: SnowlightKit
targets:
  Snowlight:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SnowlightKit
      - package: SnowlightCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowlightmap.app
        PRODUCT_NAME: Snowlight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Snowlight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  # The on-screen words, read by a UI test (M1 6.3): run on the macos-26 job only, by
  # tools/ui-test.sh. tools/tour-words is one folder reference, copied whole into the test
  # bundle with its paths kept, so files of the same name in its folders stay apart.
  SnowlightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: tools/tour-words
        type: folder
        buildPhase: resources
    dependencies:
      - target: Snowlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowlightmap.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Snowlight
schemes:
  Snowlight:
    # The build action builds the app alone (tools/build.sh); the UI test target is built
    # for testing only.
    build:
      targets:
        Snowlight: all
        SnowlightUITests: [test]
    test:
      targets:
        - SnowlightUITests
