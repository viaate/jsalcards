# Snowlight's status page: static files and one Function (GET /api/status) that reads the
# checker's D1 database. Deployed by .github/workflows/status.yml, which fills in the database
# id. See docs/status.md.
name = "snowlight-status"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "snowlight-status"
database_id = "00000000-0000-0000-0000-000000000000"
