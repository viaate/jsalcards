name: iOS words watch

# A change to the site's code or the shared fixtures: do the app's golden answers still match?
# A warning only, until testers hold the app (PLAN section 9.2). Before then it never fails,
# so a web lane is never held up by the app. It watches all of web/src, so its list cannot
# fall behind what the generator loads; the generator refuses to load a site file from
# anywhere else.
on:
  push:
    paths:
      - web/src/**
      - web/scripts/check-copy.mjs
      - pipeline/tests/schemas/examples/**
      - pipeline/tests/live/golden/**
      - pipeline/tests/predict/golden/**
      - .github/workflows/ios-words-watch.yml

permissions:
  contents: read

concurrency:
  group: ios-words-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: words watch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compare
        run: |
          set +e
          node ios/tools/sync-fixtures.mjs --check
          fixtures=$?
          node ios/tools/gen-golden.mjs --check
          golden=$?
          set -e
          if [ "$fixtures" -eq 0 ] && [ "$golden" -eq 0 ]; then
            echo "The app's golden answers match the site."
          elif [ "$golden" -eq 2 ]; then
            echo "::warning title=iPhone app generator::The app's generator could not load the site's code (the log above names the file). No word is known to have changed. Fix the loader under ios/tools before the next iOS push."
          else
            echo "::warning title=iPhone app words::An answer of the site's words or rules, or a shared fixture, changed. Make the app's golden files again (node ios/tools/gen-golden.mjs, node ios/tools/sync-fixtures.mjs) and update the Swift port. The next iOS push fails until then."
          fi
