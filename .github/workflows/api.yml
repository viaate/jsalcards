name: API

# Deploys the accounts API (api/, docs/accounts.md): the Cloudflare Worker
# snowlight-api and its D1 database snowlight-accounts, both on the owner's
# Cloudflare account and the free plan. It finds the database by name (making
# it the first time), applies the migrations, deploys the Worker and sets its
# ADMIN_KEY secret.
#
# The admin password never reaches Cloudflare. The runner derives the key the
# browser would send for the admin's login (api/scripts/derive-key.mjs:
# PBKDF2-SHA256, 600,000 iterations) from the ADMIN_PASSWORD secret and pipes
# only that key into `wrangler secret put` on stdin. Nothing prints either one.
#
# Fails dark: without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets the job prints one notice and succeeds. Without ADMIN_PASSWORD the
# Worker deploys with no ADMIN_KEY, and no one can log in as the admin.

on:
  push:
    paths:
      - api/**
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - id: secrets
        working-directory: .
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::The accounts API is not set up yet: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/accounts.md). Skipping the deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - if: steps.secrets.outputs.enabled == 'true'
        run: npm ci
      - if: steps.secrets.outputs.enabled == 'true'
        run: npm run check && npm test

      # The database's id, by name; made on the first run.
      - if: steps.secrets.outputs.enabled == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const db = JSON.parse(s).find((d) => d.name === "snowlight-accounts");
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          id="$(find_id)"
          if [ -z "${id}" ]; then
            npx wrangler d1 create snowlight-accounts > /dev/null
            id="$(find_id)"
          fi
          if ! printf '%s' "${id}" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "::error::Could not find or create the D1 database snowlight-accounts."
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"${id}\"/" wrangler.toml
      - if: steps.secrets.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply snowlight-accounts --remote
      # The site's origins: its domain and the repository's GitHub Pages origin.
      - if: steps.secrets.outputs.enabled == 'true'
        env:
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          pages="$(printf '%s' "${PAGES_ORIGIN}" | tr '[:upper:]' '[:lower:]')"
          npx wrangler deploy --var "ALLOWED_ORIGINS:https://snowlightmap.com,https://www.snowlightmap.com,${pages}"

      - if: steps.secrets.outputs.enabled == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::notice::No ADMIN_PASSWORD secret: the admin login stays off (docs/accounts.md)."
            npx wrangler secret delete ADMIN_KEY > /dev/null 2>&1 || true
            exit 0
          fi
          login="$(sed -n 's/^ADMIN_USERNAME = "\(.*\)"$/\1/p' wrangler.toml)"
          DERIVE_LOGIN="${login}" DERIVE_PASSWORD="${ADMIN_PASSWORD}" node scripts/derive-key.mjs \
            | npx wrangler secret put ADMIN_KEY > /dev/null

      # The API root, from the account's workers.dev subdomain, and a health check.
      - if: steps.secrets.outputs.enabled == 'true'
        env:
          API_ROOT_OVERRIDE: ${{ vars.SNOWLIGHT_API_ROOT }}
        run: |
          root="${API_ROOT_OVERRIDE}"
          if [ -z "${root}" ]; then
            sub="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result?.subdomain ?? ""))')"
            root="https://snowlight-api.${sub}.workers.dev"
          fi
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "${root%/}/v1/health" > /dev/null; then
              echo "::notice::The accounts API answers at ${root%/}/v1/health"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The accounts API did not answer at ${root%/}/v1/health"
          exit 1
