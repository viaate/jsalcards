name: Preview

# Publishes the current state of the site to GitHub Pages on every push to the
# default branch, so work in progress can be seen at the repository's Pages URL.
# Pages must be enabled once: Settings > Pages > Build and deployment > Source:
# GitHub Actions.

on:
  push:
    paths-ignore:
      - pipeline/config/archive-requests.json
      - docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Until Pages is enabled this step fails; the job then skips the build
      # and deploy with a notice instead of failing on every push.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is not enabled for this repository yet (Settings > Pages > Source > GitHub Actions); skipping the preview."
      - if: steps.pages.outcome == 'success'
        run: npm ci
      - if: steps.pages.outcome == 'success'
        run: npx vite build --base="${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
