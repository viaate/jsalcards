name: Preview

# Publishes the current state of the site to GitHub Pages on every push to the
# default branch, so work in progress can be seen at https://snowlightmap.com,
# the custom domain set in Settings > Pages (getsnowlight.com forwards to it at
# the registrar). Pages must be enabled once: Settings > Pages > Build and
# deployment > Source: GitHub Actions. The build's base path comes from
# configure-pages: "/" under the custom domain, "/<repo>/" without one, so the
# site follows the domain setting without a code change.
#
# The site is built with the pipeline's real data, made here: the school
# directory (snowlight directory build: NCES files, pinned in
# pipeline/config/directory.yaml) and the city and ZIP code records (snowlight
# places build: Census files), whose downloads are kept between runs in
# pipeline/.cache, and the replay days, published from the seeds in
# pipeline/data/replays against that directory (snowlight replays publish).
# npm run stage then stages what the pipeline wrote as the
# site's data and builds the search index from it (web/scripts/stage-data.mjs).
# If any of it fails, nothing is published: the preview never ships without
# its data, or with data from anywhere else.
#
# The directory keeps the date of the one the site serves now while its content
# is unchanged, so a redeploy leaves the live files indexed into it valid, and a
# changed directory takes a date no deploy has used: the build reads the deployed
# schools/edition.json (its date, counts and content digest) and compares the
# digest with its own. That read must be of the live deploy itself, so it is not
# a plain GET: Pages' CDN ignores query strings and no-cache headers and can
# answer with the edition of an earlier deploy for ten minutes or more.
# snowlight directory deployed-edition reads the live deploy's artifact through
# the API (actions: read, deployments: read), or a CDN copy fetched after the
# last deploy settled, checks that it names the directory deployed beside it,
# and fails otherwise; the preview then fails and the site stays as it is. Only "no edition deployed" lets the build take its own date,
# and only before editions shipped (contents: read shows the deployed commit's
# tree). docs/deployed-edition.md is the runbook for a read that keeps failing.

on:
  push:
    paths-ignore:
      - pipeline/config/archive-requests.json
      - docs/**
  workflow_dispatch:
    inputs:
      date_past_mismatch:
        description: >-
          Recovery only (docs/deployed-edition.md): the live deploy's edition.json names
          another directory than the one beside it, and its cause is fixed. Dates the
          directory past both, a date no deploy has used.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  # The deployed directory edition: which deploy is live (deployments), its
  # artifact (actions) and whether its commit predates editions (contents).
  # All read-only.
  actions: read
  deployments: read

# One run at a time on the default branch, none cancelled: a newer run waits
# for the running one to end, its deploy included, and of the runs waiting only
# the newest goes on. So each run's reader reads a deploy that has ended, and no
# deploy is cut off midway (one cut off could still go live after the next run
# read the deployed edition). A run cancelled by hand can still do that;
# docs/deployed-edition.md says what covers it. The default branch keeps the
# group the preview has always used, "pages", so a run of an older version of
# this file still in flight is waited for too. Runs on other branches build
# nothing and sit in groups of their own, so they never hold up the default
# branch's run.
concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Until Pages is enabled this step fails; the job then skips the build
      # and deploy with a notice instead of failing on every push.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is not enabled for this repository yet (Settings > Pages > Source > GitHub Actions); skipping the preview."

      # The pipeline: the school directory and the city and ZIP code records.
      - if: steps.pages.outcome == 'success'
        # setup-uv pins the v10.2.0 release commit, as ci.yml does.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock
      # tippecanoe builds schools.pmtiles; Ubuntu 24.04 packages 2.49, the release the build is checked against.
      - if: steps.pages.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends tippecanoe
      # The edition the site serves now, read exactly or the preview stops here.
      # A failed read leaves the site as it is; docs/deployed-edition.md says what
      # each error means and how to clear one that lasts.
      # The date_past_mismatch input (by hand only) is the runbook's recovery
      # from a live edition.json that names another directory.
      - if: steps.pages.outcome == 'success'
        working-directory: pipeline
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
          DATE_PAST_MISMATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.date_past_mismatch == true }}
        run: |
          uv sync --locked
          mkdir -p .cache
          recovery=()
          if [ "$DATE_PAST_MISMATCH" = true ]; then
            recovery=(--date-past-mismatch)
            echo "::warning::recovery run: the directory is dated past a deployed edition that names another directory"
          fi
          uv run snowlight directory deployed-edition --site "$SITE_URL" --out .cache/edition.json "${recovery[@]}"
      # The NCES and Census downloads, kept between runs. A new pin in directory.yaml starts a new cache.
      - if: steps.pages.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/nces
            pipeline/.cache/places
          key: pipeline-downloads-${{ hashFiles('pipeline/config/directory.yaml') }}
          restore-keys: pipeline-downloads-
      - if: steps.pages.outcome == 'success'
        working-directory: pipeline
        # The downloader gives up after about 15 s, too soon to ride out a
        # passing network fault between the runner and nces.ed.gov, so each
        # build gets two more tries after a pause. A failed try prints what the
        # runner sees at the directory's first file, so a lasting block shows
        # its cause in the log. Exit 4 is a refusal the inputs decide (the
        # deployed edition, or too few known time zones), and exit 2 a usage
        # error in this step or a failure of uv itself, which exits 2 on its own
        # errors: neither is retried.
        run: |
          # With no edition deployed the reader leaves no file, and the directory takes the build date.
          previous=()
          if [ -f .cache/edition.json ]; then
            previous=(--previous-edition .cache/edition.json)
          else
            echo "::notice::no schools/edition.json is deployed; the directory takes the build date"
          fi
          build() {
            name=$1
            shift
            for pause in 0 60 180; do
              sleep "$pause"
              status=0
              uv run snowlight "$name" build "$@" || status=$?
              if [ "$status" -eq 0 ]; then return 0; fi
              if [ "$status" -eq 4 ]; then
                echo "::error::snowlight $name build refused its inputs; docs/deployed-edition.md says what to do"
                return 4
              fi
              if [ "$status" -eq 2 ]; then
                echo "::error::snowlight $name build exited 2: a usage error or a uv failure (see the log above); docs/deployed-edition.md says what to check"
                return 2
              fi
              echo "::warning::snowlight $name build failed; probing nces.ed.gov"
              curl -sS -o /dev/null -r 0-1023 --max-time 30 \
                -w 'HTTP %{http_code} in %{time_total}s from %{remote_ip}\n' \
                https://nces.ed.gov/programs/edge/data/EDGE_GEOCODE_PUBLICSCH_2425.zip || true
            done
            return 1
          }
          build directory "${previous[@]}"
          # Supplement entries whose evidence or address goes stale within 60
          # days: a warning each, so they are checked again before they drop off.
          jq -r '.supplement.expiring[]? | "::warning::Supplement entry \(.id) \(.name): its \(.what) goes stale on \(.expires_on); check it again in pipeline/config/directory-supplement.yaml"' \
            out/internal/directory/build_report.json
          build places
      # The replay days (pipeline/data/replays), published again against the
      # directory just built: no network. A seed it leaves out is a ::warning::
      # and the deploy goes on; with no seed it writes no replays/ folder.
      - if: steps.pages.outcome == 'success'
        working-directory: pipeline
        run: uv run snowlight replays publish

      # The site, with that data staged, for the Pages base path.
      - if: steps.pages.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.pages.outcome == 'success'
        working-directory: web
        run: npm ci
      - if: steps.pages.outcome == 'success'
        working-directory: web
        run: npm run stage
      - if: steps.pages.outcome == 'success'
        working-directory: web
        run: npx vite build --base="${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Where the page reads live/closings.json from, a host published apart from this site
          # (docs: S8 live closings). Empty until the owner turns live closings on: the page then
          # reads its own data/.
          VITE_SNOWLIGHT_LIVE_ROOT: ${{ vars.SNOWLIGHT_LIVE_ROOT }}
          # The waitlist (web/tools/waitlist.ts): the front page is the waitlist once the
          # repository variable WAITLIST_KIT_FORM holds the Kit form's id. Unset, the site builds
          # as before. WAITLIST_CONFIRM must match the Kit form's double opt-in: unset while it is
          # on (Kit's default), off only when the form sends no confirmation email.
          # WAITLIST_HEADLINE=chrome sets the headline in the wordmark's chrome lettering.
          # WAITLIST_CONTACT, an email address, puts a way to ask for removal on the privacy page.
          # The owner turned the waitlist on (Oct 19) with Kit form 10065423, a public id. A repository
          # variable WAITLIST_KIT_FORM still overrides it; removing this default turns the waitlist off.
          VITE_WAITLIST_KIT_FORM: ${{ vars.WAITLIST_KIT_FORM || '10065423' }}
          # The owner turned the confirmation email off (Oct 19: Kit auto-confirms new subscribers),
          # so the page says the address is on the list. A repository variable still overrides it.
          VITE_WAITLIST_CONFIRM: ${{ vars.WAITLIST_CONFIRM || 'off' }}
          VITE_WAITLIST_HEADLINE: ${{ vars.WAITLIST_HEADLINE }}
          VITE_WAITLIST_CONTACT: ${{ vars.WAITLIST_CONTACT }}
      # The build carries the staged directory, its edition, school tiles and search index, or it is not published.
      - if: steps.pages.outcome == 'success'
        working-directory: web
        run: |
          for file in schools/meta schools/points schools/schools search-index; do
            ls dist/data/${file}.*.* > /dev/null
          done
          test -f dist/data/schools/edition.json
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
