name: CI

on:
  push:
    # A change to the archive request file only starts the archive-captures
    # workflow; it touches no code.
    paths-ignore:
      - pipeline/config/archive-requests.json
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  # The end-to-end suite runs in three jobs side by side, so each stays well
  # inside the job's time limit as the suite grows. Nearly all of its time is
  # in the desktop project (most phone tests skip themselves), so the desktop
  # tests are split in two halves and the phone tests run on their own.
  e2e:
    name: e2e (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: desktop 1 of 2
            args: --project=desktop --shard=1/2
          - part: desktop 2 of 2
            args: --project=desktop --shard=2/2
          - part: phone
            args: --project=phone
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- ${{ matrix.args }}

      # Traces of the tests that failed, for playwright show-trace.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ strategy.job-index }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Lighthouse on the production build (perf/lighthouse.mjs): 90 or more in all
  # four categories in the mobile and desktop presets, mobile FCP under 1.5 s,
  # CLS 0, no console errors and no request leaving the site at the initial
  # view. The script exits 1 when any gate fails.
  perf:
    name: perf
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # Lighthouse drives the Chromium Playwright installs.
      - run: npx playwright install --with-deps chromium
      - run: npm run perf
      # The waitlist build (tools/waitlist.ts) in both its looks: phone Performance 95 or more,
      # CLS 0, no script file and nothing asked of another site before a signup.
      - run: npm run perf:waitlist

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: |
            web/perf/lighthouse.json
            web/perf/lighthouse-waitlist.json
            web/perf/lighthouse-waitlist-chrome.json
            web/perf/raw/
          if-no-files-found: ignore
          retention-days: 14

  pipeline:
    name: pipeline
    runs-on: ubuntu-24.04
    # The suite takes about 12 minutes on a usual runner, and the same tests
    # ran 26% slower on another (874 s against 694 s on Oct 14), which put it
    # past 15 minutes at 99%. The limit leaves room for that spread.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv stopped publishing floating major tags after v7, so this pins
      # the v10.2.0 release commit instead.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          working-directory: pipeline
          enable-cache: true
          # Resolved against working-directory, so this is pipeline/uv.lock.
          cache-dependency-glob: uv.lock

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict snowlight tests
      - run: uv run pytest
