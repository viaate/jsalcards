name: CI

on:
  push:
    # A change to the archive request file only starts the archive-captures
    # workflow; it touches no code.
    paths-ignore:
      - pipeline/config/archive-requests.json
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      # Traces of the tests that failed, for playwright show-trace.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Lighthouse on the production build (perf/lighthouse.mjs): 90 or more in all
  # four categories in the mobile and desktop presets, mobile FCP under 1.5 s,
  # CLS 0, no console errors and no request leaving the site at the initial
  # view. The script exits 1 when any gate fails.
  perf:
    name: perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # Lighthouse drives the Chromium Playwright installs.
      - run: npx playwright install --with-deps chromium
      - run: npm run perf

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: |
            web/perf/lighthouse.json
            web/perf/raw/
          if-no-files-found: ignore
          retention-days: 14

  pipeline:
    name: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv stopped publishing floating major tags after v7, so this pins
      # the v10.2.0 release commit instead.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          working-directory: pipeline
          enable-cache: true
          # Resolved against working-directory, so this is pipeline/uv.lock.
          cache-dependency-glob: uv.lock

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict snowlight tests
      - run: uv run pytest
