name: iOS app

# The iPhone app (ios/), built on one of GitHub's standard hosted Macs: the core tests
# on Apple's Foundation, then an unsigned build for the simulator from a project that
# XcodeGen makes from ios/project.yml, then pictures of the app taken from the real
# simulator screen. The pictures come back as one small artifact, ios-shots; the color
# at a named point of each picture is printed in the log, so the log alone tells a light
# screen from a dark one. No signing identity, no account and no secret is involved.
# Logic lives in the ios/tools scripts so this file changes rarely: every change to it
# also runs the normal CI.
on:
  push:
    paths:
      - ios/**
      - .github/workflows/ios-app.yml
  pull_request:
    paths:
      - ios/**
      - .github/workflows/ios-app.yml

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  app:
    name: app (macos-26, Xcode 26.6)
    # A standard runner: free for this public repository.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIM_OS_PREFIX: "iOS 26."
      SIM_DEVICE: "iPhone 17 Pro"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: What this machine has
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::The pinned Xcode is gone from this image. Bump DEVELOPER_DIR in this workflow."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          date +%Z
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i iphone || true
          xcrun simctl help launch || true
          xcbeautify --version || true
          df -h /
      - name: Core tests on macOS, in a half-hour zone with clock changes
        env:
          TZ: America/St_Johns
          SNOWLIGHT_EXPECT_ZONE: America/St_Johns
        run: swift test --package-path ios/SnowlightCore
      - name: XcodeGen, pinned and checked
        run: bash ios/tools/get-xcodegen.sh
      - name: Generate the project
        run: |
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml
      - name: Build for the simulator, unsigned
        run: bash ios/tools/build.sh
      - name: Picture tour
        run: bash ios/tools/tour.sh
      - name: Colors at named points in the pictures
        if: always()
        run: |
          xcrun swiftc -O ios/tools/pixels.swift -o "$RUNNER_TEMP/pixels"
          "$RUNNER_TEMP/pixels" ios/out/full
      - name: Small pictures
        if: always()
        run: bash ios/tools/shots.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-shots
          path: ios/out/small/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screens-full
          path: ios/out/full/
          if-no-files-found: ignore
          retention-days: 7
