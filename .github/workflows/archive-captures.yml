name: Archive captures

# Lists Internet Archive (Wayback Machine) captures of closings pages for a
# date range. The Wayback CDX API is not reachable from every build
# environment, so this runs on GitHub's runners and uploads the raw CDX rows
# as an artifact for the backfill to read.
#
# Run it by hand with inputs, or push a change to
# pipeline/config/archive-requests.json ({"urls": [...], "from": "YYYYMMDD",
# "to": "YYYYMMDD"}).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URL patterns (a trailing * matches a prefix)
        required: true
      from:
        description: First day, YYYYMMDD
        required: true
      to:
        description: Last day, YYYYMMDD
        required: true
  push:
    paths:
      - pipeline/config/archive-requests.json

permissions:
  contents: read

jobs:
  cdx:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - name: Resolve the request
        id: request
        env:
          EVENT: ${{ github.event_name }}
          IN_URLS: ${{ inputs.urls }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
        run: |
          set -eu
          if [ "$EVENT" = "push" ]; then
            file=pipeline/config/archive-requests.json
            urls=$(jq -r '.urls | join(" ")' "$file")
            from=$(jq -r '.from' "$file")
            to=$(jq -r '.to' "$file")
          else
            urls=$IN_URLS
            from=$IN_FROM
            to=$IN_TO
          fi
          for value in "$from" "$to"; do
            printf '%s' "$value" | grep -Eq '^[0-9]{8}$' || { echo "bad date: $value"; exit 1; }
          done
          {
            echo "urls=$urls"
            echo "from=$from"
            echo "to=$to"
          } >> "$GITHUB_OUTPUT"
      - name: Query the Wayback CDX API
        env:
          URLS: ${{ steps.request.outputs.urls }}
          FROM: ${{ steps.request.outputs.from }}
          TO: ${{ steps.request.outputs.to }}
        run: |
          set -u
          mkdir -p out
          for url in $URLS; do
            name=$(printf '%s' "$url" | tr -c 'A-Za-z0-9' '_')
            if curl -sS --fail --retry 3 --retry-delay 5 --max-time 120 \
                -A "snowlight-pipeline (+https://github.com/viaate/jsalcards)" \
                -G "https://web.archive.org/cdx/search/cdx" \
                --data-urlencode "url=${url}" \
                --data-urlencode "from=${FROM}" \
                --data-urlencode "to=${TO}" \
                --data-urlencode "output=json" \
                --data-urlencode "fl=timestamp,original,statuscode,mimetype,length,digest" \
                -o "out/${name}.json"; then
              echo "${url}: $(jq 'if length > 0 then length - 1 else 0 end' "out/${name}.json" 2>/dev/null || echo '?') captures"
            else
              echo "${url}: request failed"
            fi
            sleep 4
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cdx-${{ steps.request.outputs.from }}-${{ steps.request.outputs.to }}
          path: out
          retention-days: 30
