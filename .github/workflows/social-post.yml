# Posts on the X account @SnowlightMap (docs/social.md): at most one post a run.
#
# A push to the default branch that changes social/queue/ (or this file) posts the oldest
# queued post not posted yet. The daily schedule (16:37 UTC, US daytime) posts a queued post
# if one is waiting, else one post Claude Haiku writes from social/facts.md, once the
# ANTHROPIC_API_KEY secret is in the x-posting environment (until then it says
# "no Anthropic key" and posts only queued posts). Caps live in the code (pipeline/snowlight/
# social): one post a run, two a UTC day, one Haiku post a day, four Haiku calls a run.
#
# Secrets: the X ones (X_CLIENT_ID, X_CLIENT_SECRET, X_REFRESH_TOKEN) and ANTHROPIC_API_KEY
# are environment secrets of x-posting, which only the default branch may use; the Cloudflare
# ones are repository secrets. Only the post step gets them, and nothing a fork or a pull
# request can start runs this workflow: it has no pull_request, pull_request_target or
# workflow_dispatch trigger. The job checks the branch again before anything else. Every
# token the run derives is masked, nothing is written to a file, artifact, cache or summary,
# and the log-check job reads the post job's own log and fails on any secret-shaped value.
#
# To stop it: disable this workflow (Actions > social-post > Disable workflow), or delete it,
# or remove the X secrets from the x-posting environment.
name: social-post

on:
  schedule:
    - cron: "37 16 * * *"
  push:
    branches:
      - claude/keen-faraday-oy7yqw
    paths:
      - social/queue/**
      - .github/workflows/social-post.yml

permissions: {}

jobs:
  post:
    if: github.repository == 'viaate/jsalcards' && github.ref == 'refs/heads/claude/keen-faraday-oy7yqw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: x-posting
    concurrency:
      group: social-post
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # the one "X posting stopped: refresh token" issue
    defaults:
      run:
        working-directory: pipeline
    env:
      PYTHONWARNINGS: ignore
    steps:
      - name: Run only on the default branch
        working-directory: .
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REF" != "refs/heads/claude/keen-faraday-oy7yqw" ] || [ "$REPOSITORY" != "viaate/jsalcards" ]; then
            echo "::error::social-post runs only on the default branch of viaate/jsalcards."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 100 # the subjects of the commits since the last post

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          working-directory: pipeline
          enable-cache: false

      - run: uv sync --locked --no-dev

      - name: Post
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: uv run --no-sync snowlight social post --root .. --event "$EVENT"

  log-check:
    needs: post
    if: always() && needs.post.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the post job's own log
    steps:
      - name: The post job's log holds no secret-shaped value
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          job=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '.jobs[] | select(.name == "post") | .id')
          for try in 1 2 3 4 5 6; do
            if gh api "repos/$REPOSITORY/actions/jobs/$job/logs" > /dev/null 2>&1; then break; fi
            sleep 10
          done
          # The log is read from the API into the scanner's standard input, never saved. The
          # scanner is the same rule as pipeline/snowlight/social/logscan.py: a run of 30 or
          # more token characters with upper case, lower case and a digit, or a known key
          # prefix. It prints line numbers and lengths only.
          gh api "repos/$REPOSITORY/actions/jobs/$job/logs" | python3 -c '
          import re, sys
          run = re.compile(r"[A-Za-z0-9_\-~+=.]{30,}")
          prefixes = ("sk-ant-", "ghs_", "ghp_", "gho_", "github_pat_")
          def shaped(v):
              return v.startswith(prefixes) or (any(c.isupper() for c in v) and any(c.islower() for c in v) and any(c.isdigit() for c in v))
          found = [(n, len(m)) for n, line in enumerate(sys.stdin.read().splitlines(), 1) for m in run.findall(line) if shaped(m)]
          for n, size in found[:20]:
              print(f"::error::secret-shaped value in the post job log at line {n} ({size} characters)")
          print(f"log-check: {len(found)} secret-shaped values")
          sys.exit(1 if found else 0)
          '
