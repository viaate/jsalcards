# The live closings file, v1/live/closings.json on the live host (docs/accounts.md, docs/live.md).
#
# The list readers live in live-read.yml (one self-chained loop, all day; docs/live.md "The
# reader"). This workflow keeps them going and publishes the admin's manual statuses while the
# reader runs in shadow:
# - `reader` (a few seconds, no checkout): starts a live-read run when none has a job that is
#   not completed, and when the repository variable LIVE_PUBLISH changes (read as Actions
#   compares strings: on, shadow or off; anything else, unset included, is shadow) cancels the
#   run in the old mode and starts one in the new. A refused call is one notice, never a red
#   run;
# - `watch` (a few seconds, no checkout): reads the served file of the reader's prefix through
#   the CDN (v1-shadow in shadow, v1 in on, nothing in off) and says when it is over 15 minutes
#   old, missing or over 60 s ahead: one annotation in shadow, one issue in on;
# - `check`, `publish` and `notify` as below. While LIVE_PUBLISH is not on, the publish job
#   writes the admin's statuses to v1 exactly as before; in on the reader writes v1 (with the
#   admin's statuses in every pass) and the publish job is skipped.
#
# For the admin's manual statuses (accounts spec C): the active overrides
# from the API (GET {API}/v1/overrides), each id checked against the deployed directory,
# through S8-D's publisher and gate (`snowlight live overrides`). In the S8-C merge the
# admin's statuses outrank every list read (pipeline/snowlight/live/merge.py, with_overrides).
#
# The owner's Cloudflare timer dispatches this workflow (workflow_dispatch on the default
# branch) every 5 minutes when no run is queued or running, so a run is quick and quiet:
# - no API root (no repository variable SNOWLIGHT_API_ROOT, and no CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID secrets to find the Worker's workers.dev address with; or the
#   Cloudflare API gives no subdomain, or lists no snowlight-api Worker), or no API deployed
#   at a named root (404 twice, 10 s apart): one notice, and the run succeeds. A root that is
#   not an https URL: one warning, and the run succeeds. If the public files still show
#   statuses then, a warning, and the publish job takes them down
#   (`snowlight live overrides --none`);
# - LIVE_OVERRIDES_PUBLISH off or shadow while v1 still shows statuses: one warning on every
#   run (nothing in those modes writes v1; docs/live.md says how to take them down);
# - no active override and public files that show no status: one line, and it succeeds;
# - otherwise the publish job runs (environment `live`, SNOWLIGHT_LIVE_TOKEN; without the
#   token, one notice). It uploads when the statuses changed and every 10 minutes while any
#   show (the heartbeat). An answer from the API that is not a well-formed list fails the run
#   and publishes nothing: the public file stays as it was.
# Then the notify job sends the status notifications (docs/notify.md): one line and nothing
# else while no browser gets notifications.
name: live-ingest

on:
  workflow_dispatch:

concurrency:
  group: live-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Keep the live reader running (docs/live.md, "The reader"). No checkout: the script
  # below and GitHub's API only. A refused call (a disabled workflow, 403, 422, 5xx) is a
  # notice and the job succeeds: it never turns the owner's run red.
  reader:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      actions: write # list, cancel and start live-read runs
    steps:
      - name: Start or switch the live reader
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PUBLISH: ${{ vars.LIVE_PUBLISH }}
        run: |
          set -uo pipefail
          # As Actions compares strings: case ignored, nothing trimmed.
          normal() {
            local lower
            lower=$(printf '%s' "$1" | LC_ALL=C tr '[:upper:]' '[:lower:]')
            case "$lower" in on | shadow | off) echo "$lower" ;; *) echo shadow ;; esac
          }
          mode=$(normal "$LIVE_PUBLISH")
          if [ -n "$LIVE_PUBLISH" ] && [ "$mode" = shadow ] && [ "$(printf '%s' "$LIVE_PUBLISH" | LC_ALL=C tr '[:upper:]' '[:lower:]')" != shadow ]; then
            echo "::warning::LIVE_PUBLISH is not on, shadow or off: the reader runs in shadow."
          fi
          api="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/actions"
          call() { # METHOD URL OUT [BODY]: prints the HTTP status, 000 for no answer
            local args=(-sS --max-time 20 -o "$3" -D "$3.headers" -w '%{http_code}' -X "$1"
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
            if [ -n "${4:-}" ]; then args+=(-d "$4"); fi
            curl "${args[@]}" "$2" 2>/dev/null || echo 000
          }
          code=$(call GET "$api/workflows/live-read.yml/runs?per_page=30" runs.json)
          # The repository's GITHUB_TOKEN count this hour, for the soak report (bar: 600).
          header() { tr -d '\r' < runs.json.headers 2>/dev/null | awk -v name="$1" 'tolower($1) == name ":" { print $2 }' | tail -n 1; }
          used=$(header x-ratelimit-used)
          limit=$(header x-ratelimit-limit)
          reset=$(header x-ratelimit-reset)
          if [[ "$used$limit$reset" =~ ^[0-9]+$ ]] && [ -n "$used" ] && [ -n "$limit" ] && [ -n "$reset" ]; then
            echo "::notice::github token used $used of $limit reset $reset"
          fi
          if [ "$code" != 200 ]; then
            echo "::notice::live-read runs could not be listed (HTTP $code): nothing started."
            exit 0
          fi
          now=$(date +%s)
          running=0
          while IFS=$'\t' read -r id created title; do
            [ -n "$id" ] || continue
            code=$(call GET "$api/runs/$id/jobs" jobs.json)
            if [ "$code" != 200 ]; then
              running=1 # unknown: never start a second reader on a guess
              continue
            fi
            # its reader job only: the evidence job after it never holds a reader back
            open=$(jq '[.jobs[] | select(.name != "evidence" and .status != "completed")] | length' jobs.json)
            total=$(jq '[.jobs[] | select(.name != "evidence")] | length' jobs.json)
            age=$((now - $(date -d "$created" +%s)))
            if [ "$open" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$age" -ge 120 ]; }; then
              continue # GitHub still lists it, but its job is over
            fi
            if [ "$(normal "${title#live-read }")" = "$mode" ]; then
              running=1
              continue
            fi
            code=$(call POST "$api/runs/$id/cancel" cancel.json)
            if [ "$code" = 202 ]; then
              echo "live reader: cancelled run $id (another mode); starting one in $mode"
            else
              echo "::notice::live-read run $id could not be cancelled (HTTP $code)."
              running=1
            fi
          done < <(jq -r '.workflow_runs[] | select(.status != "completed") | [.id, .created_at, (.display_title // "")] | @tsv' runs.json)
          if [ "$running" -eq 1 ]; then
            echo "live reader: running in $mode"
            exit 0
          fi
          body=$(jq -cn --arg ref "$GITHUB_REF_NAME" --arg mode "$mode" '{ref: $ref, inputs: {mode: $mode}}')
          code=$(call POST "$api/workflows/live-read.yml/dispatches" dispatch.json "$body")
          if [ "$code" = 204 ]; then
            echo "live reader: started one in $mode"
          else
            echo "::notice::live-read could not be started (HTTP $code)."
          fi
          exit 0

  # The served file of the reader's prefix, as a page reads it (docs/live.md, "Alerts").
  # Shadow: one annotation when it is stale, missing or ahead, never an issue. On: one issue
  # (label live-alert, found by its marker), a comment past 30 minutes at most once an hour,
  # closed when a fresh file is served. Off: nothing.
  watch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      issues: write # the stale issue, in on only
    steps:
      - name: Check the served live file
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PUBLISH: ${{ vars.LIVE_PUBLISH }}
          LIVE_ROOT: https://viaate.github.io/snowlight-live/
        run: |
          set -uo pipefail
          lower=$(printf '%s' "$LIVE_PUBLISH" | LC_ALL=C tr '[:upper:]' '[:lower:]')
          case "$lower" in on | shadow | off) mode="$lower" ;; *) mode=shadow ;; esac
          if [ "$mode" = off ]; then
            echo "live watch: publishing is off: nothing to watch"
            exit 0
          fi
          prefix=v1-shadow
          if [ "$mode" = on ]; then prefix=v1; fi
          now=$(date +%s)
          code=$(curl -sS --max-time 20 -o served.json -w '%{http_code}' \
            "${LIVE_ROOT}${prefix}/live/closings.json?watch=$now" 2>/dev/null || echo 000)
          state=fresh
          age=""
          if [ "$code" != 200 ]; then
            state=missing
          elif ! stamp=$(jq -er '.generated_at | strings' served.json 2>/dev/null); then
            state=missing
          elif ! made=$(date -d "$stamp" +%s 2>/dev/null); then
            state=missing
          else
            age=$((now - made))
            if [ "$age" -gt 900 ]; then state=stale; elif [ "$age" -lt -60 ]; then state=ahead; fi
          fi
          line="the served $prefix file is $state${age:+ (${age} s old)}"
          if [ "$mode" = shadow ]; then
            if [ "$state" = fresh ]; then echo "live watch: $line"; else echo "::warning::live watch: $line"; fi
            exit 0
          fi
          repo="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY"
          call() { # METHOD URL OUT [BODY]
            local args=(-sS --max-time 20 -o "$3" -w '%{http_code}' -X "$1"
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
            if [ -n "${4:-}" ]; then args+=(-d "$4"); fi
            curl "${args[@]}" "$2" 2>/dev/null || echo 000
          }
          marker="<!-- live-alert:stale:$prefix -->"
          code=$(call GET "$repo/issues?state=open&labels=live-alert&per_page=100" issues.json)
          if [ "$code" != 200 ]; then
            echo "::notice::live watch: $line; the issues could not be listed (HTTP $code)"
            exit 0
          fi
          number=$(jq -r --arg m "$marker" 'first(.[] | select((.body // "") | contains($m)) | .number) // empty' issues.json)
          updated=$(jq -r --arg m "$marker" 'first(.[] | select((.body // "") | contains($m)) | .updated_at) // empty' issues.json)
          run="${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID:-}"
          if [ "$state" = fresh ]; then
            echo "live watch: $line"
            if [ -n "$number" ]; then
              body=$(jq -cn --arg b "recovered at $(date -u +%H:%MZ)" '{body: $b}')
              call POST "$repo/issues/$number/comments" out.json "$body" > /dev/null
              call PATCH "$repo/issues/$number" out.json '{"state":"closed","state_reason":"completed"}' > /dev/null
            fi
            exit 0
          fi
          echo "::warning::live watch: $line"
          if [ -z "$number" ]; then
            call POST "$repo/labels" out.json '{"name":"live-alert","color":"b60205"}' > /dev/null
            body=$(jq -cn --arg t "Live alert: stale ($prefix)" \
              --arg b "$marker"$'\n'"live alert \`stale\` ($prefix)"$'\n'"$line at $(date -u +%Y-%m-%dT%H:%M:%SZ)"$'\n'"run: $run"$'\n'"see docs/live.md#alerts" \
              '{title: $t, body: $b, labels: ["live-alert"]}')
            code=$(call POST "$repo/issues" out.json "$body")
            if [ "$code" != 201 ]; then echo "::notice::live watch: the issue could not be opened (HTTP $code)"; fi
          elif [ -n "$age" ] && [ "$age" -gt 1800 ] && [ $((now - $(date -d "$updated" +%s))) -ge 3600 ]; then
            body=$(jq -cn --arg b "still $state at $(date -u +%H:%MZ)${age:+: ${age} s old}" '{body: $b}')
            call POST "$repo/issues/$number/comments" out.json "$body" > /dev/null
          fi
          exit 0

  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.find.outputs.api }}
      publish: ${{ steps.find.outputs.publish }}
    steps:
      - id: find
        name: Find the API and anything to publish
        env:
          API_ROOT: ${{ vars.SNOWLIGHT_API_ROOT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          LIVE_REPOSITORY: viaate/snowlight-live
          LIVE_PUBLISH: ${{ vars.LIVE_OVERRIDES_PUBLISH || 'on' }}
          RETRY_PAUSE: "10"
        run: |
          set -euo pipefail
          publish=false
          api=""
          trap 'echo "publish=$publish" >> "$GITHUB_OUTPUT"; if [ -n "$api" ]; then echo "api=$api" >> "$GITHUB_OUTPUT"; fi' EXIT
          # GET a URL into a file; prints the HTTP status, or 000 when no answer came.
          get() {
            local out="$1"
            shift
            curl -sS --max-time 20 -o "$out" -w '%{http_code}' "$@" 2>/dev/null || true
          }
          # How many statuses and open statements the public files show: a number, or
          # "unknown" when one cannot be read (then it is published over, never taken down).
          shown_now() {
            local total=0 pair code count
            for pair in closings:days opens:opens; do
              code=$(get public.json -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github.raw+json" \
                "${GITHUB_API_URL:-https://api.github.com}/repos/$LIVE_REPOSITORY/contents/v1/live/${pair%%:*}.json")
              case "$code" in
                200) count=$(jq -er --arg key "${pair#*:}" \
                       '.[$key] | if type == "array" then length else error("not a list") end' \
                       public.json 2>/dev/null) || { echo unknown; return; } ;;
                404) count=0 ;;
                *) echo unknown; return ;;
              esac
              total=$((total + count))
            done
            echo "$total"
          }
          # No API to read (none named, no workers.dev subdomain, or none deployed there): stay
          # dark, and take down the statuses a past API left on the map. $2 "warning": a
          # misconfiguration the owner should see even with nothing on the map.
          dark() {
            local shown=0
            if [ "$LIVE_PUBLISH" = on ]; then shown=$(shown_now); fi
            if [ "$shown" != unknown ] && [ "$shown" -gt 0 ]; then
              echo "::warning::$1, but the public files still show $shown manual statuses: taking them down (docs/live.md)."
              publish=true
            else
              echo "::${2:-notice}::$1: nothing to publish (docs/accounts.md)."
            fi
            exit 0
          }
          # Nothing but LIVE_PUBLISH on writes v1: say so while v1 still shows statuses.
          if [ "$LIVE_PUBLISH" != on ]; then
            shown=$(shown_now)
            if [ "$shown" != unknown ] && [ "$shown" -gt 0 ]; then
              echo "::warning::LIVE_OVERRIDES_PUBLISH is $LIVE_PUBLISH, but v1 still shows $shown manual statuses, and nothing takes them down in that mode (docs/live.md, Manual statuses)."
            fi
          fi
          # GET v1/overrides into overrides.json; a 404, 5xx or no answer is asked again once,
          # $RETRY_PAUSE s later, so one bad answer neither fails the run nor takes the map down.
          get_overrides() {
            local code
            code=$(get overrides.json -H "Accept: application/json" "${root}v1/overrides")
            case "$code" in
              000 | 404 | 5??)
                sleep "${RETRY_PAUSE:-10}"
                code=$(get overrides.json -H "Accept: application/json" "${root}v1/overrides")
                ;;
            esac
            echo "$code"
          }
          root="$API_ROOT"
          if [ -z "$root" ]; then
            if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              dark "No API root (vars.SNOWLIGHT_API_ROOT, or the Cloudflare secrets)"
            fi
            code=$(get subdomain.json -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "${CLOUDFLARE_API_URL:-https://api.cloudflare.com/client/v4}/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
            if [ "$code" != "200" ] || ! jq -e '.success == true' subdomain.json > /dev/null 2>&1; then
              echo "::notice::The Cloudflare API gave no workers.dev subdomain (HTTP $code; is one registered, and may CLOUDFLARE_API_TOKEN read Workers?): nothing to publish (docs/accounts.md)."
              exit 0
            fi
            sub=$(jq -r '.result.subdomain // empty' subdomain.json)
            if [ -z "$sub" ]; then dark "No workers.dev subdomain on the Cloudflare account"; fi
            if ! [[ "$sub" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
              echo "::notice::The Cloudflare API gave a subdomain that is not a name: nothing to publish (docs/accounts.md)."
              exit 0
            fi
            # Whether the Worker is deployed, from the account itself: what workers.dev answers
            # for a Worker that is not there is not something to rely on.
            code=$(get scripts.json -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "${CLOUDFLARE_API_URL:-https://api.cloudflare.com/client/v4}/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
            if [ "$code" != "200" ] || ! jq -e '.success == true and (.result | type == "array")' scripts.json > /dev/null 2>&1; then
              echo "::notice::The Cloudflare API did not list the account's Workers (HTTP $code; may CLOUDFLARE_API_TOKEN read Workers?): nothing to publish (docs/accounts.md)."
              exit 0
            fi
            if ! jq -e 'any(.result[]; .id == "snowlight-api")' scripts.json > /dev/null 2>&1; then
              dark "The snowlight-api Worker is not deployed on the Cloudflare account"
            fi
            root="https://snowlight-api.$sub.workers.dev/"
          fi
          root="${root%/}/"
          # As strict as the publisher (overrides.api_url): https, or http to this machine for
          # a test server; no query, fragment or space.
          if ! [[ "$root" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/[^?#[:space:]]*$ ]] &&
            ! [[ "$root" =~ ^http://(127\.0\.0\.1|localhost)(:[0-9]+)?/[^?#[:space:]]*$ ]]; then
            dark "SNOWLIGHT_API_ROOT is not an https URL without a query" warning
          fi
          code=$(get_overrides)
          if [ "$code" = "000" ]; then
            echo "::error::The API did not answer GET v1/overrides at $root: nothing is published."
            exit 1
          fi
          if [ "$code" = "404" ]; then
            dark "The API is not deployed (GET v1/overrides answered 404 twice)"
          fi
          if [ "$code" != "200" ]; then
            echo "::error::GET v1/overrides answered HTTP $code: nothing is published."
            exit 1
          fi
          active=$(jq -er '.overrides | if type == "array" then length else error("not a list") end' overrides.json 2>/dev/null) || {
            echo "::error::GET v1/overrides is not a list of overrides: nothing is published."
            exit 1
          }
          api="$root"
          if [ "$active" = "0" ] && [ "$(shown_now)" = "0" ]; then
            echo "No active override, and the public files show no status: nothing to publish."
            exit 0
          fi
          publish=true

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true' && vars.LIVE_PUBLISH != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    permissions:
      contents: read
      actions: read # the Pages artifact of the deployed directory
      deployments: read # the deployed directory's handshake (S8-0)
    defaults:
      run:
        working-directory: pipeline
    env:
      LIVE_HOST_TOKEN: ${{ secrets.SNOWLIGHT_LIVE_TOKEN }}
      LIVE_PUBLISH: ${{ vars.LIVE_OVERRIDES_PUBLISH || 'on' }}
      GITHUB_TOKEN: ${{ github.token }}
      API_ROOT: ${{ needs.check.outputs.api }}
    steps:
      - id: token
        name: Stay dark without the live host token
        working-directory: .
        run: |
          if [ -z "$LIVE_HOST_TOKEN" ]; then
            echo "::notice::No SNOWLIGHT_LIVE_TOKEN in the live environment: nothing is published (docs/predict.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: steps.token.outputs.ready == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock

      - if: steps.token.outputs.ready == 'true'
        run: uv sync --locked --no-dev

      # The publisher's private state (its memory and the day's change log: school ids, codes
      # and times, no words; a few KB). A lost state is rebuilt from the public files. Its key
      # is not `live-state-`: that prefix is the live loop's store, which predict.yml restores.
      - if: steps.token.outputs.ready == 'true'
        id: state
        uses: actions/cache/restore@v4
        with:
          path: pipeline/out/internal/live/state
          key: live-overrides-state-${{ github.run_id }}
          restore-keys: live-overrides-state-

      # With no API left to read (the check job's warning), take the statuses down.
      - if: steps.token.outputs.ready == 'true'
        name: Publish the manual statuses
        run: |
          if [ -n "$API_ROOT" ]; then
            uv run snowlight live overrides --api "$API_ROOT"
          else
            uv run snowlight live overrides --none
          fi

      - if: always() && steps.token.outputs.ready == 'true' && hashFiles('pipeline/out/internal/live/state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: pipeline/out/internal/live/state
          key: live-overrides-state-${{ github.run_id }}

  # Status notifications (docs/notify.md): after the publish job, or when there was nothing to
  # publish, on every run whose check job finished. Its first step asks the accounts database
  # (D1, over the Cloudflare API, with the same two secrets) how many browsers get
  # notifications; with none, no Cloudflare secrets, or the tables not there yet, it says so in
  # one line and stops before any setup. Otherwise `snowlight notify status` compares the public
  # closings file (read through GitHub's API) with what each account was sent, and pushes what
  # is new, changed or lifted. A file that is not current sends nothing.
  notify:
    needs: [check, publish]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A notification problem never turns the closings run red (the command itself warns
    # and exits 0; this covers setting it up).
    continue-on-error: true
    permissions:
      contents: read
      actions: read # the Pages artifact of the deployed directory
      deployments: read # the deployed directory's handshake (S8-0)
    defaults:
      run:
        working-directory: pipeline
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - id: count
        name: Count the browsers that get notifications
        working-directory: .
        run: |
          set -euo pipefail
          send=false
          trap 'echo "send=$send" >> "$GITHUB_OUTPUT"' EXIT
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "notify: no Cloudflare secrets: nothing to send"
            exit 0
          fi
          api="${CLOUDFLARE_API_URL:-https://api.cloudflare.com/client/v4}/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          code=$(curl -sS --max-time 20 -o databases.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?name=snowlight-accounts" 2>/dev/null || true)
          id=$(jq -r 'first(.result[]? | select(.name == "snowlight-accounts") | .uuid) // empty' databases.json 2>/dev/null || true)
          if [ "$code" != "200" ] || ! [[ "$id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "notify: the accounts database was not found (HTTP $code): nothing to send"
            exit 0
          fi
          code=$(curl -sS --max-time 20 -o count.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"sql":"SELECT COUNT(*) AS n FROM push_subscriptions p JOIN users u ON u.id = p.user_id JOIN sessions s ON s.token_hash = p.session_hash AND s.expires_at > CAST(strftime('"'"'%s'"'"', '"'"'now'"'"') AS INTEGER) * 1000 WHERE u.disabled = 0","params":[]}' \
            "$api/$id/query" 2>/dev/null || true)
          n=$(jq -er '.result[0].results[0].n | numbers' count.json 2>/dev/null || true)
          if [ "$code" != "200" ] || [ -z "$n" ]; then
            echo "notify: the notification tables cannot be read yet (HTTP $code; api.yml applies them): nothing to send"
            exit 0
          fi
          if [ "$n" = "0" ]; then
            echo "notify: no browser gets notifications: nothing to send"
            exit 0
          fi
          echo "notify: $n browsers get notifications"
          send=true

      - if: steps.count.outputs.send == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: steps.count.outputs.send == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock

      - if: steps.count.outputs.send == 'true'
        run: uv sync --locked --no-dev

      - if: steps.count.outputs.send == 'true'
        name: Send the status notifications
        run: uv run snowlight notify status
