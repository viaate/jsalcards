# The snow-day chance model's settings (S7 spec, piece 1).
# Read by snowlight.predict.config; secrets never live here (see docs/predict.md).

# Labels (spec a): which captures say what a district did on a school day.
labels:
  read_from: "06:30"          # a read on D: fetched in [read_from, read_until) local on D
  read_until: "09:30"
  no_school_share: 0.5        # at least this share of eligible schools lit closed or remote
  delayed_share: 0.5          # at least this share lit delayed
  open_max_share: 0.10        # read on D and at most this share lit with any status
  audience_days: 2            # a station lists a district on at least this many days of the season
  market_rows_void: 5         # an empty read is void when a market peer holds this many rows
  station_min_captures: 5     # a station with fewer populated captures in the archive never reads a district
  capture_min_share: 0.5      # on a storm day a populated read needs this share of its station's median rows
  storm_absence_share: 0.5    # on a storm day, absence is not open when this share of the market closed
  first_season: 2015          # 2015-16
  excluded_from: "2020-03-13" # the pandemic closures: never a weather label
  excluded_until: "2020-08-14"
  reason_rule: 2              # REASONS decisions 4 and 5: flooding, severe storms and a hurricane
                              # count only on a tropical day; Election Day, Veterans Day,
                              # Columbus Day and Good Friday are breaks

# Weather class (spec b): the alerts that count for a school day.
weather:
  snapshot_hour: 21           # training snapshot: 21:00 local on D-1
  window_from: "18:00"        # an alert counts when it overlaps [18:00 D-1, 09:00 D) local
  window_until: "09:00"
  covered_share: 0.5          # a district's class covers at least this share of its schools
                              # (the outlook's words say "half": web/src/copy-chance.ts)
  memory_hours: 30            # live alerts kept this long after they were last seen

# The pooled rates (spec c.1). Round 1 used m = 1024 everywhere with own 1024 and levels 64 days:
# those values were picked after looking at the walk-forward test seasons, so that backtest was
# not out of sample. Round 2 goes back to the spec: own 4 days, levels 8 days, and each m chosen
# per level and class group by leave-one-season-out log loss inside the training seasons only
# (from a wider grid than the spec's, up to 1024), fixed before the backtest was run.
# The base sentence names a level only when it is true of that level's recorded days (the
# lead's addenda b and d): its own days hold at least half the weight (n >= m) and the share
# the website says for its published rate is true of its y of n (an exact share only when y/n
# rounds to the same percent, "more than s in o" only above s/o, "almost never" only under
# almost_share); otherwise the base moves up, to the nation, whose rate is its record y/n. A
# situation the nation holds fewer than nation_min_days labeled days of is not modeled and
# publishes its fallback's rates, its sentence saying which recorded days it counts (never the
# uninformed 1 in 2 of an empty count).
model:
  own_min_days: 4             # a district's own rate needs this many labeled days
  level_min_days: 8           # a pooled level is named only with this many days
  nation_min_days: 30         # a situation is modeled only with this many labeled days nationally
  almost_share: 0.05          # "almost never" only under 1 in 20 closed ("almost always": over 19 in 20)
  fallback:                   # a situation not modeled takes this one's rates and sentence
    lake_snow: snow_warning
    blizzard: snow_warning
    ice: snow_warning
    cold: snow_warning
    tropical: snow_warning
    advisory_after: advisory
    none_after: none
    advisory: snow_warning
  m_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  floor: 0.01
  ceiling: 0.99
  record_days: 8
  # The private schools' chain (contract C3) names a place below the nation (nearby, county,
  # state, region) only with this many labeled private school-days, the nation's own minimum:
  # private schools come onto the lists a storm day at a time (661 labeled days in all), and
  # with 8 a state's rate rested on one or two storm days (the private backtest's storm Brier
  # was 0.159 against B0's 0.082; with 30 it is 0.080). Chosen after that backtest, so the
  # private backtest is not out of sample for this one setting (docs/predict.md).
  private_level_min_days: 30

# The backtest (spec c.3).
backtest:
  test_seasons: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  apart: [2020]               # reported apart
  storm_day_market_closings: 10
  reliability_bins: 10
  reliability_min_rows: 300
  g1_min_storm_rows: 300       # G1 per season gates only seasons with this many storm rows
  g1_tolerance: 0.005         # ... each no worse than B0's storm Brier by more than this

# The serving pass (spec d and the addendum of 2026-10-20).
serve:
  forecast_zone: "America/Los_Angeles"  # today is today here; the file holds today and tomorrow
  neighbor_miles: 10
  min_district_share: 0.99    # fewer deployed districts than this in the model: dark
  alerts_max_age_minutes: 20  # the feed's updated older than this: dark
  collapse_from: 50           # a pass with more winter alerts than this ...
  collapse_drop: 0.8          # ... followed by one with this much fewer: confirm first
  budget_raw_bytes: 16500000  # asserted worst cases (tests/predict/test_loop.py, counts from the committed model plus 5%): with no record days or previous chances and 9,000 private outlooks 16,326,296 bytes raw; with no record days and 2,000 outlooks 15,108,482; the committed model's whole file 16,446,182. A file over it steps down serve.Fit (docs/predict.md, Size)
  budget_gzip_bytes: 1500000
  heartbeat_minutes: 30       # an unchanged file is uploaded at least this often
  heartbeat_skip_minutes: 4   # ... and by every grid pass, unless an upload went out this recently
  memory_gap_minutes: 20      # the alert memory is whole only if the feed was read this often
  history_lead_hours: 48      # a rebuilt memory reads NWS alert products from this long before
  check_minutes: 5            # the alerts are checked this often between passes
  min_gap_minutes: 10         # at most one extra pass per this many minutes
  grid_minutes: [7, 37]       # the heartbeat passes, on the hour's grid
  opens_max_age_minutes: 60   # an opens file older than this says nothing (the usual chance stands)
  elevation_margin_feet: 500  # an alert "above N feet" reaches a school at N - 500 ft or higher ("below", "between" alike; docs/predict.md, Heights)
  # Advisory-sane L3 (docs/predict.md, "The storm-class levels"): every advisory, warning and cold
  # day is served from its class's level (capture-corrected priors, the district's exposure, the
  # live outcome-blind labels, the plausibility pull; all set by live_score below), never from an
  # archive closure share. Off: the served chain, as before.
  anchor: true
  # Piece 3 (docs/predict.md, "The reasons"): off until the lead turns them on. Off, every chance
  # is the base alone, byte for byte as before piece 3.
  reasons: false              # the reasons' terms (forecast amounts, districts next door) move the chance
  announces: false            # a district's usual posting time is its forecasts' announces_at
  reasons_gate_override: ""   # names the lead who signed off on serving terms whose backtest v2 gate failed; empty: refused
  neighbors_max_age_minutes: 60  # a closings file older than this says nothing of the districts next door
  # Advisory-sane L5 (docs/predict.md, "The forecast adjustment"): with anchor on, the forecast at
  # the class snapshot moves each advisory and warning day within its class (live_score
  # forecast_adjustment), each district's days still averaging its class level. Off: the class
  # level alone, as L3 served it. Turn-on items 8 and 10 (L5 round 2, the docs' first option): a
  # day is adjusted only from its class snapshot on (9 PM the evening before on the school's
  # clock); before it, and for any day after the next school day's, the class level alone.
  forecast_adjust: "on"       # off | on
  # S7-F (docs/predict.md, "The night-before outlook"): with PREDICT_OUTLOOK on, a district whose zone
  # has no forecast run under 3 hours old gets the issued-alerts-only chance (identity, the lead's
  # decision of 2026-10-20), or the pass goes dark (dark). Off and shadow publish as before either way.
  forecast_stale: identity
  # The night chart (docs/predict.md, "The night chart"; option (iv), NBM 1-hour snowfall): on since
  # Nov 1, 2026, with the owner's OK. On, a gated pass reads the blend (at most chart_hold_seconds)
  # and builds the file with nights before it publishes. Shadow published the chart-off file and
  # built the one with nights in memory after, to report it.
  chart: "on"                     # off | shadow | on
  chart_nbm_max_age_minutes: 150  # NBM cycle age at the 2025 and 2026 January heartbeats, on the files a pass needs: median 97, p98 127 and 157 min; over 150 min 0.27% and 2.76% (docs/predict.md)
  chart_hold_seconds: 15          # with on: the most the blend's reads hold a pass back before it publishes (then nbm_slow); every lookup, connect and socket read ends by it
  chart_min_inches: 1.0           # the district's 50% value of the night's new snow
  night_max_raw_bytes: 16446182   # a file with nights is never larger than today's worst case
  # GC4's faults, shadow only, on the in-memory build alone: rotate injects raise, stale_night_at,
  # frozen_listing, bad_host and nbm_slow in turn on 1 grid slot in 6, once a slot; the 48 h counts
  # go up beside the file (v1/predictions/chart-shadow.json). Config refuses any fault unless chart
  # is shadow: turning the chart on sets chart: "on" AND chart_fault: none in the same change.
  chart_fault: none               # none | raise | stale_night_at | frozen_listing | bad_host | nbm_slow | rotate

# Automatic learning (S7-L, spec addenda c and d): 'snowlight predict learn', nightly inside the
# predict workflow. Live-read district-days become labels by the archive's rules; a storm situation
# with anchor_min_days of them nationally (and enough held-out ones to check it on) counts its
# absolute level on them (re-anchored), the archive giving relative propensities only; a refit is
# swapped in only when the walk-forward check on the newest held-out live days finds it no worse
# than the model served, pooled and in every situation it re-anchors.
learn:
  anchor_min_days: 200          # live-read district-days a situation needs, nationally, to be re-anchored
  holdout_min_storm_rows: 100   # the held-out days (newest first) hold at least this many storm district-days
  holdout_max_share: 0.5        # ... and never more than this share of the live-labeled days
  holdout_min_storm_days: 3     # ... spread over at least this many storm days
  holdout_min_states: 2         # ... and at least this many states
  ece_tolerance: 0.01           # reliability: the refit's ECE may exceed the current one's by at most this
  holdout_min_situation_rows: 30  # a situation is re-anchored only with this many held-out rows to check it on
  holdout_bin_min_rows: 20      # held-out reliability bins with this many rows are checked against their bound
  snapshot_slack_minutes: 60    # a weather class taken this long before 21:00 the evening before is too old
  morning_reads_days: 44        # the live morning record and the class snapshots keep 45 days (the evidence store keeps them for good): older unlabeled days stay unknown
  excluded_days: []             # live days found misread (YYYY-MM-DD): never learned from (docs/predict.md)

# The live scoring rules, pre-registered on 2026-10-29 before any live morning from Nov 1 on is
# scored (advisory-sane L0; numbers and codes only). The class levels, the district standing and
# the live update are fitted and scored by these and by nothing else; a change to any of them is
# a reviewed commit that applies only to rows that arrive after it. The sha256
# (config.LIVE_SCORE_SHA256, logged by predict learn on every run) covers this block, the
# labels: and weather: blocks above (the outcome and class rules the labels are made by) and
# learn.snapshot_slack_minutes, so none of those changes without it.
live_score:
  read:                           # a district is read on a school morning when one of its sources...
    window: ["06:30", "09:30"]    # ...had a whole read in a 30-minute slot of this local window
    healthy_share: 0.9            # ...in a slot whose reader healthy share is at least this
    recent_days: 14               # ...and had a counted day (C2) in this many days before (or a second proven source read)
    min_captures: 5               # a proven county source has at least this many closing-size captures
                                  # (lead rulings B1.4, C1, C2: one test, archive and live alike: the
                                  # list's OWN rows named at least 3 districts under a warning-or-
                                  # above class (snow, lake snow, ice, blizzard, tropical warnings;
                                  # cold and advisories are not); archive: on the capture's local day
                                  # or the next, one value a day, the day's largest capture (review
                                  # R5-S3); live: at the day's snapshot and lit closed, remote or
                                  # delayed on our map, from a read that passed every check (shown,
                                  # healthy, not stale, gated, labels.station_min_captures captures by
                                  # then, at least labels.capture_min_share of its reference as it
                                  # stood, or for a thin reference of its longest vouching market
                                  # peer's read that day, by the read's one peer-vouch rule; in a slot
                                  # inside the named districts' read window). Only such counted live
                                  # days are a list's live captures
                                  # (labels.station_min_captures), reference values, tier B captures
                                  # and recent days; that our map lit districts the list carries is
                                  # never enough. The reference is the median of the closing-size
                                  # values, never under the archive's median when the archive alone
                                  # holds labels.station_min_captures. B1.2: a list with fewer
                                  # closing-size values (thin reference) reads on a storm day only
                                  # when its read holds labels.capture_min_share of the longest read
                                  # in the window of a market peer that vouches (review R6-B1: shown,
                                  # healthy, not stale, not a district site, 5 captures, a reference
                                  # of its own not thin, and its read at least
                                  # labels.capture_min_share of it; an empty read never); else
                                  # small_capture
                                  # for all its districts. B1.3: on a warning-or-above morning a
                                  # populated read naming no district for the day while its market
                                  # named some is stale_populated, and on any morning so is a
                                  # populated read whose rows name only days before the day before.
                                  # C3: the closing-size row counts are numbers, not text, and may be
                                  # committed. C4: the archive audiences keep the (list, district)
                                  # pairs listed in the current or previous season (seasons begin Aug
                                  # 1)
    open_if_unnamed: true         # a covered district a whole fresh read did not name counts as open (owner O5)
  sensitivity:                    # list sensitivity from co-listing trials (closed districts only,
                                  # lit no school, never delayed; reported with their distinct dates
                                  # and lists and a day-aggregated interval;
                                  # a trial: a list read whole in the window that had not lit the
                                  # district by the window's end, on any log day; named = its rows
                                  # named the district for the day in a slot it qualified in; each
                                  # trial also keeps named_in_day, reported beside it)
    tier_a_prior: [9, 1]          # Beta(9 + hits, 1 + misses)
    tier_b_prior: [4, 2]          # Beta(4 + hits, 2 + misses)
    tier_b_min: 0.7               # tier B enters the primary set at this sensitivity...
    tier_b_min_trials: 20         # ...over at least this many closed co-listing trials (lead ruling
                                  # B1.5: from at least 5 distinct dates). Lead ruling C5: the by-date
                                  # mean (each date one observation) is reported against tier_b_min
                                  # beside it, "met by trials, not by date" when under it, as a
                                  # diagnostic until 20 tier B lists exist (the larger of the lists
                                  # tier B as of the run and the lists the trials come from); from
                                  # then on G1 also needs it
  classes:                        # the class each weather class is scored and served in
    advisory: advisory
    advisory_after: advisory
    cold: cold
    snow_warning: warning
    lake_snow: warning
    ice: warning                  # no archive ice row: inside warning, under the warning prior
    blizzard: warning             # 263 archive rows on 4 dates, busiest 52%: inside warning too
    tropical: warning
    none: chain                   # none and none_after stay on the served chain, never scored here
    none_after: chain
  split:                          # a weather class leaves warning for a level of its own...
    min_live_dates: 5             # ...once it has this many distinct live dates...
    prior: warning                # ...starting from the warning prior
  prior:                          # capture-corrected class levels (k about 26), never an archive closure share
    advisory: {target: 0.10, alpha_mean: -2.953, alpha_sd: 0.85}
    cold: {target: 0.10, alpha_mean: -2.953, alpha_sd: 1.00}
    warning: {target: 0.45, alpha_mean: -0.284, alpha_sd: 1.20}
    capture_k: 26.4
    delay_beta: [1.1, 8.9]        # the delay share q's prior (mean 11%)
    alpha_grid: [-8, 4, 801]
    delay_grid: 401
    tau: 1.5                      # the market-day random effect's sd
    tau_choices: [1.0, 1.5, 2.0, 2.5]
    tau_free_market_days: 30      # tau is chosen by marginal likelihood from this many live market-days
    quadrature_points: 20
  standing:                       # the district's own standing within its class
    exposure_beta: 0.5            # x = -ln((f + 0.5) / (f_ref + 0.5)), f the district's class days a season
    exposure_offset: 0.5
    f_ref: national_median_nonzero  # f_ref: the national median of f over districts with at least 1 day of the class
    seasons: ["2015-16", "2024-25"]  # f: the district's school-days of the class a winter, averaged over these winters (weather.parquet 2015-25)
    region_delta_strength: 0.5    # half-strength region deltas...
    region_delta_clip: 1.0
    region_min_days: 30           # ...only where level_supported holds
    region_min_dates: 3
    region_max_busiest: 0.5
    live_region_sd: 0.5
    live_state_sd: 0.4
    live_level_min_dates: 5
    live_level_min_market_days: 2
  scoring:                        # nightly, frozen before the morning
    horizons: [1, 0]
    freeze_local: ["20:07", "05:07"]  # horizon 1 frozen at 20:07 local the evening before, horizon 0 at 05:07 local
    freeze_day_offsets: [-1, 0]
    primary_min_sensitivity: 0.7
    bootstrap_resamples: 1000
    bootstrap_seed: 20261101
    bound: 0.90
    bins: [0.0, 0.1, 0.3, 0.5, 0.7, 1.0]
  shrink:                         # a class whose live calibration is badly off is pulled toward its prior, never hidden
    ece_above: 0.10
    nights: 3
    min_rows: 100
    keep_share: 0.5               # while it holds: served = prior + 0.5 x (posterior - prior), on the log-odds scale
    release_nights: 3             # it lifts after this many nights in a row at or under ece_above
    pooled: true                  # ECE and min_rows are over the rows of the last `nights` scored nights together, not each night alone
  live_update:                    # the class level served is the grid posterior under the prior above
    refresh_hours: 24             # refitted from the live labels once a day
    fit_from: "2026-10-27"        # the level is fitted on labels from this school day on (every day the morning record holds)...
    score_from: "2026-11-01"      # ...but only rows from this school day on, after this registration, are scored
    prior_weight: alpha_sd        # the prior's weight is its alpha_sd (no extra pseudo-count; capture_k is the capture-odds constant)
  forecast_adjustment:            # Addendum A item 3 (L5): the forecast moves a storm-class day within its class
    registered: true              # S7 addendum i (2026-11-01) fixes these before any of its rows is scored
    addendum: "i"
    classes: [advisory, warning]  # cold days stay at their class level (the cold is the class itself)
    snow_per_log: 1.0             # a: log-odds per unit of ln((s + c) / (u + c)), s the window snow still to come
    snow_offset: 0.5              # c (inches)
    bounds_advisory: [-0.7, 2.0]  # the day's terms together, log-odds; -0.7: a 9 PM read cannot see snow already down (SF-R5-1), so no snow ahead lowers an advisory day to about half its level, no less (PHYS-R3-S2)
    bounds_warning: [-0.4, 1.5]   # a 9 PM read cannot see a storm's snow already down: a light forecast lowers little
    ice_snow: 25                  # an inch of window ice counts as this many inches of snow on top of the day's snow (0.1 in: 2.5 in)
    chill_from: 15                # feels at 7 AM (F) below this...
    chill_per_degree: 0.02        # ...adds this a degree...
    chill_max: 0.3                # ...up to this
    timing_outside: 0.5           # snow outside 10 PM to 9 AM on the school's clock weighs this (inside: 1)
    timing_max: 0.4               # the timing term's bound either way
    timing_min_snow: 0.5          # inches: the timing term phases in from no snow to this
    timing_even_max: 0.9          # the window's even weight is taken at most this: snow at least 80% in the commute hours never lowers
    timing_bus: true              # predict-next BUS-TIMING (Nov 3): the timing weighs snow before the bus hour (07:00 on the school's clock) against snow after it, in place of 10 PM to 9 AM (off: L5's timing exactly); on: the within-date test with a season held out found it no worse than L5 (docs/predict.md, "The bus hour timing term")
    timing_after_bus: 0.95        # o: what snow after the bus hour weighs against snow before it (1: no timing); fit within date with each season held out over 0.0-0.9 by 0.1 and 0.95, ties to the largest (docs/predict.md, "The bus hour timing term")
    timing_bus_share_max: 0.8     # F: the window's before-bus share is taken at most this in its even weight: snow at least 80% before the bus hour never lowers
    shrink_days: 10               # u: the district's own 9 PM codes on its class days plus this many of its county's (region's) mix
    county_min_days: 30           # a county with fewer class days lends its region's mix instead
    usual_max: 30.0               # u is solved in [0, usual_max] inches
    snow_amount: true             # predict-next SNOW-AMOUNT-2 (Nov 3): the total never under the snow alone's floor, as L5's up to the class's upper bound and over it bending toward snow_amount_high, each class's own slope; on: the within-date test with a season held out found it no worse than L5 (docs/predict.md, "The snow amount term")
    snow_amount_high: 3.0         # log-odds, chosen, not measured: the forecast history's codes stop at 9 inches or more, so the record cannot set it (4.0 scores the same); twice the warning bound (room 1.5 over it; 1.0 over the advisory bound)
    snow_amount_floor_ratio: 3.0  # the snow alone's floor is anchored at no less than u / 3, so the solve stays determinate
    snow_amount_slope_advisory: 1.65  # a on an advisory day with snow_amount on: fit within date (which districts closed given how many) on every season, in [0.8, 3.0]
    snow_amount_slope_warning: 3.0    # a on a warning day with snow_amount on: the same fit, at the range's top (3.0: past it the archive's nearly all-closed dates separate and the fit runs away)
  calibration:
    ece_max: 0.05
    bin_min_rows: 30
    hard_fail_mean: 0.50          # a bin predicting at least this...
    hard_fail_observed: 0.25      # ...observed below this fails
    predictive_interval: 0.90
    bin_interval: 0.95            # each reliability bin's date-clustered interval (date-block bootstrap)
  plausibility:                   # implied closures per district-season, checked before anything serves
    advisory_mean: 1.0
    advisory_p99: 3.0
    advisory_warning_mean: 2.0
    district_max: 6.0
    exp_within_brier: 0.002
    pull_scale: log_odds          # a district that would fail is pulled toward its class level: served = level + s x (district - level) on the log-odds scale...
    pull_step: 0.05               # ...s falling from 1 in steps of 0.05 (s = 0 is the class level itself, never below it)...
    pull_until: district_max      # ...to the largest s at which that district's implied closures are at or under district_max;
    pull_aggregate: largest_first # if the mean or p99 clause still fails, the districts with the most implied closures take one more step each, in that order, until it passes
    # L3 (docs/predict.md, "The storm-class levels", Plausibility; comments only, the sha256 is of
    # the values): the districts over district_max are the most exposed, whose exposure puts them
    # under their class level, so the pull toward it cannot reach district_max. Such a district
    # takes the s with the fewest closures, then one downward shift of every class's log-odds to
    # district_max (the cap); the national steps go by bisection (the same districts as one at a
    # time); a class level the national clauses still refuse is shrunk toward its prior (alpha =
    # prior + w (posterior - prior), w down in pull_step) until they pass. Every clause is judged
    # on the chances as published (hundredths, the floor), so a capped district is never served
    # over district_max by rounding. On today's exposure the national steps never act (pulled 0
    # at every raised level tried): the class shrink does that work, and the advisory-mean clause
    # holds the advisory reference level to about 29% at most.
    # The lead's rulings (Oct 31; docs/predict.md, "The storm-class levels"):
    # (1) the cap and the class shrink beyond the registered pull are KEPT as the G6 backstop on
    #     published chances; they act only when a published value would break G6, and the log
    #     line counts pulled, capped and shrunk (with a warning whenever more than the pull acted);
    # (2) the plug-in level SERVES (registered); the predictive mean (advisory 0.1146) is
    #     reported in anchor.json, not served; L4's frozen scorer judges calibration and its
    #     shrink fallback acts on misfit;
    # (3) NO re-centring on the day-weighted mean now: about 8.6% over the advisory days
    #     districts get is near 1 in 10 as the spec asks; L4 reports the day-weighted served
    #     mean per class, and the lead revisits with scored nights;
    # (4) ACCEPTED: the grid market-day integral for each market-day's likelihood, with the
    #     registered 20-point quadrature (quadrature_points) for the served level;
    # (5) KEEP one list's sensitivity per unnamed row (registered); anchor.json reports the
    #     multi-list rows (multi_list), and the lead revisits once L1's real record shows their
    #     share.
  supply:
    advisory: {rows: 300, dates: 8, states: 3, regions: 2, max_date_share: 0.25, k_eff: 15}
    warning: {rows: 100, dates: 4, states: 2, max_date_share: 0.40}
    cold: {rows: 100, dates: 4, states: 2, max_date_share: 0.40}
  read_independence:
    share_ratio: [0.8, 1.25]      # the class's read share against the none class's
    closure_points: 0.05          # market-days with and without a posted closure
    closure_ratio: 1.25
  accuracy:
    brier_vs_live_rate: 0.005
  hand_audit: {rows: 50, false_open_max: 0.05}
  call_time:                      # predict-next CALL-TIME (Nov 3; docs/predict.md, "The usual call time"): each district's usual call time u and a decline past it, while every required list proves the district silent; the term off (CALL-TIME-1), nothing served changes
    serve: "off"                  # off only: config refuses any other until LIVE-READS lands (the switch is CALL-TIME-2's, automatic in the learn step)
    classes: [advisory, warning, cold]  # a call is a map time on a day of these serving classes
    evening_from: "18:00"         # D-1 local: before it a call is ahead (no sample); from it to midnight, evening (kept apart, never in u)
    morning_until: "09:30"        # 00:00 to this local on D: a morning call (in u); later, late (never in u)
    proof_from: "05:00"           # a proof at slot end s reads the rule copy's window [proof_from, s) and D's record cut at s
    slots: ["05:30", "09:30"]     # slot ends s every step_minutes, local; held after the last
    held_row: "10:00"             # the decision rule's extra row: the held value
    step_minutes: 30              # x grows at most this a slot
    own_min_calls: 3              # an own u needs this many morning calls...
    own_grace: 15                 # ...and starts the decline this many minutes past u
    pool_grace: 30                # a pool-driven u's grace
    shrink: 3                     # u: the weighted median of the own morning calls (weight 1) and this many pseudo-samples at the pool's median
    pool_min_calls: 10            # a pool (market, else state; never national) holds this many morning calls...
    pool_min_districts: 3         # ...from this many districts
    pool_order: [market, state]
    market_lead: [whole_days, captures, id]  # d's market on D: its tier-A list with the most days of a whole read in lead_days, then more captures, then lowest id
    lead_days: 14
    required_days: 45             # a required list: every tier-A list of d in the live registry; one with no whole read in these days is dark, still required (lead ruling)
    m_grid: [0.35, 0.60, 0.05]    # F: m from 0.35 to 0.60 by 0.05...
    tau_grid: [20, 90, 5]         # ...tau from 20 to 90 minutes by 5...
    first_slot_max: 0.40          # ...and |Delta(30)| at most this (75 of the 90 points); outside F refused, never clamped
    default: [0.35, 45]           # (m, tau) before any training date: Delta(30) -0.3802
    fold: prequential_then_season_out  # one live season: dates before D; from two, each season held out (no call of it in a fitted value)
    bands: ["05:30", "06:30", "07:30", "08:30", "09:30"]  # strata [05:30, 06:30), [06:30, 07:30), [07:30, 08:30), [08:30, 09:30], plus 10:00
    frozen: [d0_0507, d0_0630]    # the base: d0_0507 before 06:30, d0_0630 from 06:30
    pr_moved: 0.05                # reported: the share of rows at risk at 06:30 whose two bases differ by over this
    supply: {dates: 8, states: 3, rows: 200}  # at-risk district-times with Delta < 0
    stratum_min_rows: 100
    bootstrap_resamples: 2000
    bound: 0.90
    tolerance: 0.005              # per district-time: overall gain at least 0, its lower bound and every class at least -tolerance
