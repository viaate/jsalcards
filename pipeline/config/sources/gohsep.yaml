  notes: 'Found for piece s4d (round 1 lead, built in round 2 on 2026-09-27): GOHSEP''s standing public
    ArcGIS layer Parish_School_Closures_Public_View_Layer (item e9ca4b01702d4bf3bce39f93f32b0a06, owner
    Andy.Venuto_GOHSEP, created 2025-05-19) holds each of the 64 parish school systems'' STATUS (Open,
    Closed, Planned Closure, Virtual Classes, Early Dismissal, Delayed Start) per CLOSURE_DATE, and is
    drawn by the ''Parish Emergency School Closures Dashboard'' (item 183276b0c4814b9cb1048b116c91f236,
    modified 2026-09-01: ''This dashboard displays the school system closures for Incident 26-020 - Tropical
    Storm Edouard'') through the web map ''Parish School Closures Public Map'' (930ce0655ab24e188fc11d2c378243f2).
    Before May 2025 GOHSEP made one layer per incident (24-004 Severe Weather, 24-006 Winter Weather,
    24-008, 24-014, 24-015, 24-018 and 24-019 Heavy Rainfall, 24-033 TC Francine, 25-007 Winter Weather).
    The list names school systems, not schools: a district-level source (leaids), counting only the parish
    school systems'' schools, not the city systems (Monroe, Bogalusa, Baker, Zachary, Central), charter
    school districts or private schools in the same parishes. Proof (piece s4d, 2026-09-28): this is a
    status board, listing every school or system with its status every day, so a read proves it only when
    a row''s status is other than open (Closed, Early Dismissal, Remote, a delay); an all-open read does
    not (notices.gate_proofs, reported in coverage.json''s district_notice_gate).'
