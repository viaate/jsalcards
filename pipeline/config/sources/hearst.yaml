# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: hearst
  name: Hearst Television closings pages
  operator: Hearst Television Inc.
  adapter: hearst
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'Every Hearst Television station site states its terms at the top of its robots.txt: no software
      robots, spiders, crawlers or other data gathering or extraction tools, automated or manual, may
      access, copy, monitor, scrape or aggregate the site or its content, and copying, downloading or
      archiving content needs prior written permission from Hearst Television; creating or providing archived
      or cached data sets of its content to others and any commercial purpose are named as prohibited
      uses. The full terms page (https://www.hearst.com/-/tv-terms-of-use) answered HTTP 403 to this pipeline
      on 2026-09-25. The same robots.txt disallows the whole site to ClaudeBot, Claude-Web, anthropic-ai,
      GPTBot, CCBot and archive.org_bot. The project owner decided on 2026-09-25 to read these lists anyway
      for this non-commercial project (owner_decision below); the terms stay recorded here, and the pipeline
      never uses the /api/ and /ajax/ paths robots.txt disallows to every crawler. The file names htvdigitalopsleads
      at hearst dot com as the contact.'
    evidence:
    - url: https://www.kmbc.com/robots.txt
      read_at: '2026-09-25T04:10:13Z'
      sha256: 3113c3fb87c8bb240d8c60c34cedcd9942a34e9ad7eb52d1ba0c8b3fa661d5f6
      excerpt:
      - 'Hearst Television Inc. content is made available for your personal, non-commercial use subject
        to our Terms of Service here: https://www.hearst.com/-/tv-terms-of-use You may not either directly
        or through the use of a device or other means copy, download, stream, reproduce, duplicate, archive,
        distribute, upload, publish, modify, translate, broadcast, perform, display, sell, transmit or
        retransmit the website or content without prior written permission from Hearst Television Inc.'
      - You may also not use any software robots, spider, crawlers, or other data gathering or extraction
        tools, whether automated or manual, to access, acquire, copy, monitor, scrape or aggregate the
        content or website or any portion thereof.
      - You may not knowingly or intentionally take any action that may impose an unreasonable burden
        or load on the website or its servers and infrastructures.
      - 'Prohibited uses include but are not limited to: (1) text and data mining activities under Art.
        4 of the EU Directive on Copyright in the Digital Single Market; (2) the development of any software,
        machine learning, artificial intelligence (AI), and/or large language models (LLMs); (3) creating
        or providing archived or cached data sets containing our content to others; and/or (4) any commercial
        purposes.'
      - Contact htvdigitalopsleads at hearst dot com for assistance.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4a, round 2): "terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." Relayed to the pipeline''s builder by the project''s build workflow;
        to revoke it, remove this block and live polling of this platform stops. The robots.txt decision
        is stated in the build instructions for piece s4a, round 3: "robots.txt does not exclude a station
        either: the owner decided on 2026-09-26 to read closings pages and data files even where robots.txt
        disallows them ... Still fetch and record each host''s robots.txt verdict in the registry and
        health output."'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the data files
        they load) for Snowlight, a non-commercial project, although the terms above forbid automated
        access. robots.txt: the project owner decided on 2026-09-26 to read closings pages and the list
        files they load even where robots.txt disallows them; robots.txt is still read for every URL and
        its verdict recorded here (each station''s robots block) and in every live read''s health, and
        any Crawl-delay it sets paces the requests. Unchanged: the User-Agent names the repository (never
        a browser string), requests touch only the closings page or the list file it loads (never a crawl),
        are paced per host with conditional requests and backoff on 429 (honouring Retry-After) and 5xx
        answers, and a station that actively blocks the project (a 403, a bot challenge) is dropped and
        noted, never worked around.'
  notes: 'The closings page is https://www.{site}/weather/closings on every station site. Its format changed
    twice in the captures read so far: server-rendered weather-closings-data-item rows (2023 to January
    2026; each row gives a name, a ''County, City, ST'' location and a status), then a Next.js page whose
    React Server Component payload embeds the whole list as a closingsData JSON object (from February
    2026). One adapter reads both (snowlight.sources.stations.hearst). WPTZ and WNNE share mynbc5.com;
    KHBS and KHOG share 4029tv.com. Sister channels the English Wikipedia navbox Template:Hearst (read
    2026-09-25) names under Hearst Television publish through a registered station''s site, per their
    own infoboxes (read 2026-09-25), and are not registered separately: KCWE (kmbc.com), KQCA (kcra.com),
    WCWG (wxii12.com), WKCF (wesh.com), KHOG (4029tv.com, with KHBS), WPXT (wmtw.com) and WZVN (gulfcoastnewsnow.com,
    with WBBH); WNNE shares WPTZ''s Champlain Valley market and mynbc5.com. WMOR-TV (Tampa, independent)
    is registered with no endpoint: its infobox names no news site.'
  shared_paths: []
