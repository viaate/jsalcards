# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: tegna
  name: TEGNA closings pages
  operator: TEGNA Inc. (a subsidiary of Nexstar Media Group, per nexstar.tv on 2026-09-26)
  adapter: tegna
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'TEGNA''s Terms of Service (footer link /terms on every station site; read at https://www.wusa9.com/terms,
      "Last Updated: June 26, 2025") forbid using "software or automated agents or scripts ... to generate
      automated searches, requests, or queries to (or to strip, scrape, or mine data from) the Services",
      with a revocable exception for public search engines, and license the Services for personal, noncommercial
      use. The project owner decided on 2026-09-25 to read the closings lists anyway for this non-commercial
      project (owner_decision below); the terms stay recorded here.'
    evidence:
    - url: https://www.wusa9.com/terms
      read_at: '2026-09-26T22:53:28Z'
      sha256: 942bfbd0b9ac48f857b32df6fb17abd036cd5342513b202b5ec0e6bef2c8188d
      excerpt:
      - 'Last Updated: June 26, 2025'
      - use software or automated agents or scripts to produce multiple accounts on the Services, or to
        generate automated searches, requests, or queries to (or to strip, scrape, or mine data from)
        the Services (provided, however, that we conditionally grant to the operators of public search
        engines revocable permission to use spiders to copy materials from the Services for the sole purpose
        of and solely to the extent necessary for creating publicly available searchable indices of the
        materials, but not caches or archives of such materials, subject to the parameters set forth in
        our robots.txt file)
      - we grant you a non-transferable, non-exclusive, revocable, limited license to use and access the
        Services solely for your personal, noncommercial use.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4b, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them. Relayed to the pipeline''s
        builder by the project''s build workflow; to revoke it, remove this block and live polling of
        this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages, the WordPress REST
        routes that publish the same pages, and the list files the pages frame) for Snowlight, a non-commercial
        project, although the terms above forbid automated access. robots.txt is read and its verdict
        recorded for every URL requested (no closings URL registered here was disallowed when checked
        on 2026-09-26); the owner decided on 2026-09-26 to read closings pages and files even where robots.txt
        disallows them. Unchanged by it: the User-Agent names the repository (never a browser string),
        only the closings page or file is requested (no crawling), requests are paced per host (any Crawl-delay
        is a floor) with conditional requests and backoff on 429 and 5xx answers, and a station that blocks
        the project (a 403, or a bot challenge such as the PerimeterX page Nexstar''s HTML pages answer
        with) is not worked around.'
  notes: 'Station list: https://www.tegna.com/brands/ ("64 Local News Brands in 51 Markets"), cross-checked
    with the TEGNA rows of https://www.nexstar.tv/stations/ (first-hand check 2026-09-26, docs/research/firsthand/nexstar-tegna-scripps.md);
    WTIC/WCCT and WFMY are on tegna.com only and are included. One registry entry per website (50 sites,
    67 full-power call signs). Every site serves https://www.{site}/closings rendered on the server with
    the TEGNA closings module (read with the tegna adapter), except KGW, whose page frames the FlashAlert
    Newswire report on content.kgw.com. KMSB/KTTU (Tucson) publish on kold.com, a Gray site already registered
    as gray-kold. WWL and KIII have no closings list the pipeline can read: their /closings pages held
    the module, empty, in every capture read (WWL on the Hurricane Sally and Ida days too), and now redirect,
    WWL''s to winter articles whose /article/ addresses answer this pipeline with 403 (not worked around),
    KIII''s to the front page.'
  shared_paths: []
