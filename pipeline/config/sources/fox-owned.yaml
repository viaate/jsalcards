# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: fox-owned
  name: FOX Television Stations closings pages and files
  operator: Fox Television Stations, LLC (Fox Corporation)
  adapter: fox-owned
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'FOX station footers link the FOX LOCAL Terms of Use (https://www.foxlocal.com/terms-of-use,
      "Last Revised: 08/21/2025"), which forbid copying, downloading, scraping, capturing, archiving,
      framing or deep-linking any content except as the terms expressly permit, and furnish the services
      for personal, non-commercial use. FOX station robots.txt files also disallow ia_archiver, archive.org_bot
      and wayback for the whole site (first-hand check), so archived captures of FOX station pages may
      be few; the media.foxtv.com list files are on another host whose robots.txt answered 403 (unrestricted
      under RFC 9309). The project owner decided on 2026-09-25 to read the closings lists anyway for this
      non-commercial project (owner_decision below); the terms stay recorded here.'
    evidence:
    - url: https://www.foxlocal.com/terms-of-use
      read_at: '2026-09-27T01:26:00Z'
      sha256: ee64d76c28c111580b08b1c56cdce2bd44ce862752c2748dac4006dcd94c5fc3
      excerpt:
      - 'TERMS OF USE Last Revised: 08/21/2025'
      - Except as expressly permitted in these Terms of Use, you may not copy, download, stream, scrape,
        capture, reproduce, duplicate, archive, upload, create derivative works from, modify, translate,
        publish, broadcast, transmit, retransmit, distribute, perform, display, sell, frame, deep-link,
        make available or otherwise use any Content contained in or accessible through the Fox Services.
      - Fox furnishes the Fox Services for your personal, non-commercial use and enjoyment.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c1, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming CBS''s assets1.cbsnewsstatic.com
        feeds as an example). Relayed to the pipeline''s builder by the project''s build workflow; to
        revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        or routes they load) for Snowlight, a non-commercial project, although the terms above forbid
        automated access. robots.txt is read and its verdict recorded for every URL requested; the owner
        decided on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'Station list: Wikipedia ''Fox Television Stations'' currently-owned table, read 2026-09-26 by
    the first-hand check (17 station groups, one per market site). Nine FOX-owned stations show a closings
    list: each page frames a static file on media.foxtv.com (the live poller''s data_url; all nine answered
    HTTP 200 on 2026-09-27, all empty). Three are NewsTicker HTML exports read in Gray''s format (WJBK,
    WNYW, WTXF), two NewsTicker exports with one cell per row (KDFW, KCPQ), two the NewsTicker export
    with a county menu (KMSP, WITI), WAGA''s the SC paragraph file and WTTG''s a table. Archived captures
    (archive-captures run 36323195832) show each of these formats with rows (KDFW 348 on 9 January 2025,
    WTXF 104 on 6 January 2025, WTTG 62 on 15 December 2022, WAGA 58, WNYW 34, KMSP 17, WITI 15, KCPQ
    1), and runs 36345276947 and later added WJBK''s file with rows (640 on 26 February 2020, 471 on 15
    January 2026), KCPQ''s (145 on 3 February 2025), KDFW''s (341 on 24 February 2022) and the earlier
    paths of three files (kdfw/closings.html, wnyw/closings/closing.htm, witi/closings/index.html). The
    pages framed files on other hosts before 2021-2022 (media2.fox5ny.com, www.fox5dc.org, media.fox9.com,
    media.fox29.com, media2.fox2detroit.com, wagaradio2.com and others), registered as each station''s
    list_files from the page captures that frame them; run 36355124151 read them (2014 to 2021) with the
    same readers: WJBK''s with 819 rows on 30 January 2019 (media.fox2detroit.com) and 56 on 10 January
    2017 (media2.fox2detroit.com), WTTG''s with 135 on 29 January 2014 (fox5dc.org), WNYW''s with 25 and
    10 in 2016 (media2.fox5ny.com), WAGA''s with 153 and 165 in March 2020 (wagaradio2.com), KMSP''s with
    141 in June 2020; WTXF''s and KMSP''s other earlier files were read empty, and WITI''s S3 file of
    2016 to 2021 is a tabbed shell that loads each tab''s list from a file beside it (witi_schools.html
    first, which listed 42 rows on 17 April 2020, run 36356138811). No closings page was found for KSAZ
    (Phoenix), KTTV (Los Angeles), KTVU (San Francisco), WOFL (Orlando), WTVT (Tampa) or KTBC (Austin),
    and KRIV (Houston) has a page with no list; FOX 32 Chicago (WFLD) frames the Emergency Closing Center
    (platform ecc). Those eight have no endpoint of their own here.'
  shared_paths: []
