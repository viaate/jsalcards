# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: edlio
  name: 'Edlio school district sites: the homepage alert'
  operator: Edlio, LLC (the CMS); each site's school district (the content)
  adapter: edlio
  poll_minutes: 30
  terms:
    automated_access: permitted
    summary: 'The district sites are public school districts'' own websites. Their footers link a ''Terms
      of Use'' page: Edinburg CISD''s (read 2026-09-28) holds its title and no text; nothing on the sites
      forbids reading them with software, and robots.txt allows every homepage polled (or is absent, which
      leaves it unrestricted).'
    evidence:
    - url: https://www.ecisd.us/apps/pages/index.jsp?uREC_ID=2124647&type=d&pREC_ID=2155577
      read_at: '2026-09-28T09:31:36Z'
      sha256: 8e7142941f856ac15b10d36af365cb129384ade68a56685975b79556b7234583
      excerpt:
      - Terms of Use – Web Policies – Edinburg Consolidated Independent School District
    permission: null
    owner_decision: null
  notes: 'Found for piece s4d while scouting the gap states'' district sites (round 2: Natrona County,
    Sublette #9, Hot Springs #1 and Weston #1 in Wyoming, Soda Springs in Idaho, Livingston in Montana;
    round 3: eleven South Texas districts). An Edlio district marks a news story or page as its homepage
    alert, and the homepage carries it, rendered on the server, as a dialog (article#homepage_news_alert_modal)
    the page opens on load; when none is up the page has no such element, so a quiet day''s page gave
    no hint of it. Round 3''s archived captures showed it: Mission CISD''s homepage of 2025-01-21 11:10
    UTC (the January 2025 snow) carried ''Weather Advisory: No School - Jan 21, 2025 / Delayed Start -
    Jan 22, 2025''; on 2026-09-28 Sublette #9''s live homepage carried ''School Picture Days''. Because
    the alert is in the page as served, archived captures of the homepage can prove a district. A district-level
    source: each counts only its own district''s schools (leaids). Proof: a district''s general alert
    channel, so a read proves it only when a row announced a closing, a delay, an early dismissal, a remote
    day, cancelled classes, or weather or an emergency for the district (notices.gate_proofs). Round 4,
    second batch (2026-09-28): the district sites of the other gap counties no working list reached (the
    Glendive, Alpena and Zanesville markets, the Mississippi Delta and coast, the Chico - Redding and
    Palm Springs markets and Del Norte), found the same way: 3 more Edlio sites there.'
  shared_paths: []
