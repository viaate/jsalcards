# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: spectrum
  name: Spectrum News 1 closings (one JSON file per viewing area)
  operator: Charter Communications (Spectrum News)
  adapter: spectrum
  poll_minutes: 10
  terms:
    automated_access: permitted
    summary: 'spectrumlocalnews.com links no site terms of use: its footer''s terms link is the Spectrum
      cable service''s residential terms (https://www.spectrum.com/policies/residential-terms.html, which
      timed out to this pipeline on 2026-09-27), and https://spectrumlocalnews.com/terms-of-use answered
      404. No clause on automated access was found. robots.txt sets Crawl-delay 1 (a pacing floor) and
      disallows /nyc/*, /ny/* and /content/news/* among others; the closings files are allowed.'
    evidence:
    - url: https://spectrumlocalnews.com/nys/capital-region/weather/closings
      read_at: '2026-09-27T06:18:45Z'
      sha256: null
      excerpt:
      - '(no terms of use were found for the site: the page''s footer links only the cable service''s
        residential terms and privacy policies; https://spectrumlocalnews.com/terms-of-use answered HTTP
        404 on 2026-09-27)'
    permission: null
    owner_decision: null
  notes: 'Found by the first-hand check of 2026-09-26: each Spectrum News 1 region''s closings page carries
    the region''s id (data-ravenid) and its script reads /services/closings.{ravenid}.json, which the
    live poller reads (all eleven answered HTTP 200 ''[ ]'' on 2026-09-27). Northern NY''s and the Southern
    Tier''s closings addresses are 404, and NY1 (New York City) is disallowed by robots.txt and has no
    closings list. Counties: each region is given the one Nielsen market it serves (Spectrum News 1 is
    a cable channel, not a broadcast station, so this is the market of the region''s cities); Coastal
    NC is given the Wilmington market only (its Greenville - New Bern towns are not counted), and Hudson
    Valley the New York market.'
  shared_paths: []
