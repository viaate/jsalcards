platform:
  id: hcoe
  name: 'Humboldt County Office of Education: alerts (school closures posted as news items)'
  operator: Humboldt County Office of Education
  adapter: hcoe
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: hcoe.org links no terms of use; its privacy policy (read 2026-09-27) says nothing about reading
      the site with software. robots.txt disallows only /wp-admin/.
    evidence:
    - url: https://hcoe.org/privacy-policy/
      read_at: '2026-09-27T21:50:31Z'
      sha256: 5bf3f38c30434470d7fbc36e2a8267342191584e99fa79992a73f8ac0f9176b0
      excerpt:
      - (the privacy policy holds no clause on robots, crawling, scraping or automated access; the site
        links no terms of use)
    permission: null
    owner_decision: null
  notes: 'The county office posts school closures as news items in its Alerts category (https://hcoe.org/news/alerts/),
    such as ''Klamath-Trinity Schools Closed Wednesday, March 11'' (2026-03-11) and ''Trinidad School
    Closed Monday Due to Water Issue'' (2026-01-05); the category page names its RSS feed (https://hcoe.org/news/alerts/feed/),
    which the live poller reads (the page''s own All Alerts list holds the same posts, and is what the
    archive holds from 2019 to 2026; the feed was archived only in 2020). Found by the first-hand checks
    of 2026-09-26 (docs/research/firsthand/others.json, record Humboldt COE alerts). The category also
    holds notices that are not closures (enrollment, statements); every post is a row and the status parser
    decides. A district-level source: it speaks for the school districts of Humboldt County (the districts
    NCES places in the county), so it counts their public schools only, not the county''s private schools.'
  shared_paths: []
