# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: smartsites
  name: 'ParentSquare Smart Sites school district sites: pop-up alerts'
  operator: ParentSquare, Inc. (Smart Sites, formerly Gabbart Communications' SchoolSites); each site's
    school district (the content)
  adapter: smartsites
  poll_minutes: 15
  terms:
    automated_access: forbidden
    summary: The district sites publish no terms of their own. ParentSquare's Terms of Use (read 2026-09-27),
      written for users of its Subscription Services, say a user may not copy, reproduce or share text
      on a public or password-protected ParentSquare page without the owner's written consent; recorded
      here as forbidding. Snowlight reads only each district's public pop-up alerts file, under the project
      owner's decision below.
    evidence:
    - url: https://www.parentsquare.com/terms/
      read_at: '2026-09-27T15:46:48Z'
      sha256: 6230b2e2f14d6369342a2f7c2eb1b2cd522efd1a078b81aa92b297ddc2956f65
      excerpt:
      - Copy, reproduce, or otherwise share any text, photos, videos, images, contacts, or any other information
        on a public or password-protected ParentSquare page, without prior express written consent of
        the owner and in any way that violates anybody’s rights.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4d, round 2): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." Relayed to the pipeline''s builder by the project''s build workflow;
        to revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of each district''s public /api/popup-alerts file for Snowlight, a non-commercial
        project. Unchanged by it: the User-Agent names the repository, only the alerts file is requested
        (no crawling), requests are paced per host (any Crawl-delay is a floor) with retries and backoff,
        and an active block (a 403, a bot challenge) is never worked around.'
  notes: 'Found for piece s4d on 2026-09-27 while scouting Florida''s county school districts: Orange,
    Osceola, Seminole, Leon, Hernando, Citrus, Charlotte, Jackson, Flagler and Sumter run ParentSquare
    Smart Sites (the pages load cdn.smartsites.parentsquare.com and answer x-gabbart-ecs), as do Bonneville
    Joint District 93 (Idaho Falls), Shelley (ID) and Belgrade (MT). Each page''s PopUpAlertsComponent
    script reads the site''s /api/popup-alerts (a JSON list of the district''s active urgent alerts, checked
    against a schema in the script) and shows them in a dialog; the poller reads that file. The rows name
    no school: each source is district-level (leaids), counting only its own district''s schools. A second
    search the same day (the website the NCES CCD 2024-25 LEA directory lists for each unbuilt district
    of Montana''s and Wyoming''s gap counties) found three more: Laramie County School District #1 (Cheyenne)
    and Lincoln County School District #1 (Kemmerer) in Wyoming, and Libby (MT); and two more Florida
    county districts (Calhoun, Hamilton) and Sugar-Salem #322 (ID), found by a search; 19 sites in all.
    Proof (piece s4d, 2026-09-28): a district''s general alert channel, so a read proves it only when
    a row announced a closing, a delay, an early dismissal, a remote day, cancelled classes, or weather
    or an emergency for the district; hiring, board, election, enrollment and calendar notices do not
    (notices.gate_proofs, reported in coverage.json''s district_notice_gate). Round 3 (piece s4d, 2026-09-28):
    the district sites of South Texas'' uncovered counties (Hidalgo, Nueces, Cameron, Victoria, Webb,
    El Paso, San Patricio and the smaller ones around them), found by reading the website the NCES CCD
    2024-25 LEA directory lists for each of their districts: 17 more Smart Sites there. Round 4 (piece
    s4d, 2026-09-28): the district sites of the Mobile - Pensacola market''s uncovered counties (Mobile,
    Baldwin, Escambia, Clarke, Washington, Conecuh and Monroe in Alabama; Santa Rosa in Florida), found
    by reading the website the NCES CCD 2024-25 LEA directory lists for each of their districts: 1 more
    Smart Sites there. Round 4, second batch (2026-09-28): the district sites of the other gap counties
    no working list reached (the Glendive, Alpena and Zanesville markets, the Mississippi Delta and coast,
    the Chico - Redding and Palm Springs markets and Del Norte), found the same way: 4 more Smart Sites
    there.'
  shared_paths: []
