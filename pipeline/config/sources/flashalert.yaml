# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: flashalert
  name: FlashAlert Newswire regional closings reports
  operator: FlashAlert Newswire (irx, LLC)
  adapter: flashalert
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: FlashAlert's feed page (https://www.flashalert.net/xml-feeds.html) says it does not allow
      hotlinking, but that it "is acceptable for stations to periodically pull reports from FlashAlert
      (every 5 to 15 minutes) if FTP is not available" provided the information is cached and re-displayed
      rather than linked or framed; its Privacy Policy & Terms of Service page has no clause on automated
      access. The pipeline pulls each region's report every 15 minutes, keeps what it reads, and never
      links or frames FlashAlert's pages. The permission is written for stations; Snowlight is not one,
      which is recorded here.
    evidence:
    - url: https://www.flashalert.net/xml-feeds.html
      read_at: '2026-09-27T01:27:46Z'
      sha256: 870b682bbf46ea8ba56cc9aede5aaee998275ade374ecaa8b9303da7091d1f6f
      excerpt:
      - 'Important: FlashAlert does not allow "hotlinking" to its site. It is acceptable for stations
        to periodically pull reports from FlashAlert (every 5 to 15 minutes) if FTP is not available;
        however you need to cache and re-display this information to your site visitors instead of sending
        them directly to our servers via hot-linking or iframing FlashAlert report pages.'
      - Region Codes 1 Portland/Vancouver/Salem 2 Eugene/Springfield/Roseburg/Albany/Corvallis 5 Colorado
        Springs/Rocky Mountain Area 7 Spokane/Eastern Washington/Northern Idaho 10 Bend/Central Oregon/Eastern
        Oregon 12 Seattle/Western Washington 13 Columbia/Tri Cities/Pendleton/Yakima 15 Boise/Southern
        Idaho 25 Medford/Klamath Falls/Grants Pass
    - url: https://www.flashalert.net/privacy-terms
      read_at: '2026-09-27T01:27:50Z'
      sha256: c73ad5d791a0ab64379a0adcf5095c4a50de41c1af04facb2b021023262c3659
      excerpt:
      - Privacy Policy & Terms of Service - FlashAlert
      - (no clause on robots, scraping, crawling or automated access was found in the page's text)
    permission: null
    owner_decision: null
  notes: 'FlashAlert Newswire (irx, LLC) serves nine regions, each named by a RegionID on its feed page;
    every region is registered. The live poller reads each region''s HTML report (cwc-closures.php?RegionID=N,
    the report stations frame or receive by FTP), every 15 minutes; the emergency-only XML feed (flashnews_xml_emergency.php?RegionID=N)
    is an archive URL too, read with the same adapter. A region''s report carries every emergency posting
    of the region (roads and offices as well as schools; the XML marks school postings with schoolrelated="1").
    Counties: each region is mapped to the one Nielsen market its name leads with (Portland, Eugene, Colorado
    Springs-Pueblo, Spokane, Bend, Seattle-Tacoma, Yakima-Pasco-Richland-Kennewick for ''Columbia/Tri
    Cities/Pendleton/Yakima'', Boise, Medford-Klamath Falls); the other places a region''s name adds (''Eastern
    Oregon'', ''Southern Idaho'', ''Rocky Mountain Area'') are not given counties, since no published
    list says which. Pages: FlashAlert runs a public site for eight regions (flashalertportland.net, flashalerteugene.net,
    flashalertmedford.net, flashalertbend.net, flashalertboise.net, flashalertseattle.net, flashalertspokane.net,
    flashalertcolumbia.net) whose emergency reports page (closures-cats.html; by time and by message at
    closures-time.html and closures-report.html) shows the region''s postings: it is each of those regions''
    page_url, except region 1, whose page_url is the report address with no region, which answers region
    1''s report (the same bytes as RegionID=1, read live 2026-09-27). Colorado Springs (region 5) has
    no site. Archive: the Wayback Machine holds the report address for regions 10 and 13 and with no region
    (16 captures, 2017 to 2026, CDX run 36311251817: region 1''s report, with rows on 11 December 2024,
    14 to 16 January, 5 February and 14 February 2025, 26 postings that day, schools among them); requests
    for the other regions'' report addresses answered 404. The regional sites are archived from 2014 on
    (CDX runs 36345716195 and 36348669505): Eugene''s page listed 43 postings on 28 February 2019, 16
    of them Lane County schools, Seattle''s 232 on 6 February 2017, Columbia''s 44 on 11 February 2019,
    Medford''s 8 on 5 January 2017 (5 of them under school categories), Portland''s 296 on 23 February
    2023, Bend''s one or two road or office postings (2015 to 2024); every one of the 16 region-less report
    captures carries region 1''s header; Region 13''s own reports held rows in January 2017, February
    2019 and March 2020. robots.txt answered 404 (unrestricted) on www.flashalertnewswire.net and on every
    regional site.'
  shared_paths: []
