# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: cbs-owned
  name: CBS News and Stations school closings
  operator: CBS News and Stations (Paramount)
  adapter: cbs-owned
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'cbsnews.com station pages'' footers link Paramount''s CBS Interactive Terms of Use (https://legal.paramount.com/us/en/cbsi/terms-of-use,
      "Effective Date : May 27th, 2025"), which forbid "unauthorized spidering, ''scraping,'' data mining
      or harvesting of Content" and "any other unauthorized automated means to gather data", and permit
      access for personal, non-commercial purposes. The feeds on assets1.cbsnewsstatic.com are also disallowed
      by that host''s robots.txt (Disallow: / with Allow only for /fly/, /hub/ and /i/); the owner decided
      on 2026-09-26 to read closings files regardless, and every read records the verdict. The project
      owner decided on 2026-09-25 to read the closings lists anyway for this non-commercial project (owner_decision
      below); the terms stay recorded here.'
    evidence:
    - url: https://legal.paramount.com/us/en/cbsi/terms-of-use
      read_at: '2026-09-27T01:26:04Z'
      sha256: 22cca1e7632f0f6809e718a46c5cd759683027aa1f1b3c3090a1cb9740792a35
      excerpt:
      - 'Terms of Use Effective Date : May 27th, 2025'
      - Engage in unauthorized spidering, “scraping,” data mining or harvesting of Content, or use any
        other unauthorized automated means to gather data from or about the Services.
      - You are only permitted to access and view the Content for personal, non-commercial purposes in
        accordance with these Terms
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c1, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming CBS''s assets1.cbsnewsstatic.com
        feeds as an example). Relayed to the pipeline''s builder by the project''s build workflow; to
        revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        or routes they load) for Snowlight, a non-commercial project, although the terms above forbid
        automated access. robots.txt is read and its verdict recorded for every URL requested; the owner
        decided on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'Station list: Wikipedia ''CBS News and Stations'' currently-owned table, read 2026-09-26 by
    the first-hand check (15 station groups, one per market site). Eight CBS-owned stations show a closings
    list. Seven pages (https://www.cbsnews.com/{market}/school-closings/) name their feed in the closings
    widget''s data-school-closings-options attribute (the live poller''s data_url, each read from the
    live page on 2026-09-27): NewsTicker XML exports for WJZ, WBZ, WWJ, WCCO, KDKA and KTVT, and a School
    Closings ''File'' XML for KYW (provider bti). CBS Colorado frames a NewsTicker HTML file on static.cbslocal.com.
    On 2026-09-27 WBZ''s feed listed 2 records (Worcester Public Schools ''Early Release Day'', updated
    2026-06-11, and a church event), the others none. Archived captures (archive-captures runs 36323195832
    and 36330775706) show the feeds with rows at WBZ (258 records on 23 February 2026), WCCO (157), KDKA
    (24), WJZ (32) and WWJ (7, in a shorter export without FORCED_ORGANIZATION_NAME), and KCNC''s file
    with rows in November 2022 and January 2024; runs 36345276947 and later added KTVT''s feed with 10
    records (4 February 2023, after the North Texas ice storm) and KYW''s with 14 (2 December 2025). CBS
    Pittsburgh''s page named its feed on static.cbslocal.com in April 2022 (registered as an earlier list
    file). No closings page was found (404) for KCBS/KCAL (Los Angeles), KOVR (Sacramento), KPIX (San
    Francisco), WFOR (Miami), WCBS (New York) or WUPA (Atlanta); CBS 2 Chicago (WBBM) frames the Emergency
    Closing Center (platform ecc).'
  shared_paths: []
