# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: coesheet
  name: 'County offices of education: published school closure sheets'
  operator: County offices of education in California (Shasta, Trinity), on Google Sheets
  adapter: coesheet
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: 'The sheet is published to the web on Google Sheets. Google''s Terms of Service (read 2026-09-27)
      bar ''using automated means to access content from any of our services in violation of the machine-readable
      instructions on our web pages (for example, robots.txt files ...)''; docs.google.com''s robots.txt
      allows /spreadsheet (Crawl-delay 1), and the live poller reads only docs.google.com pages (the widget
      view and the tab page it loads). The sheet''s CSV output, read once on 2026-09-27 as a check, redirects
      to a googleusercontent.com host whose robots.txt answered 404 to one request and ''Disallow: /''
      to another; it is not polled. The county offices'' sites link no terms of use (Shasta: a privacy
      policy only; Trinity: no terms or privacy link).'
    evidence:
    - url: https://policies.google.com/terms?hl=en-US
      read_at: '2026-09-27T11:47:26Z'
      sha256: c733e2ff4f22c7f5712a119f473fc2a6b3aecd1de75e1d2263a3032d03551570
      excerpt:
      - using automated means to access content from any of our services in violation of the machine-readable
        instructions on our web pages (for example, robots.txt files that disallow crawling, training,
        or other activities)
    - url: https://www.shastacoe.org/privacy-policy
      read_at: '2026-09-27T11:49:30Z'
      sha256: 9194d06cf6278edd69226e0e23fdfcc374bacbb5102dffbe9038bb58b19f51e1
      excerpt:
      - We do not collect any personal information unless you voluntarily provide it by sending us e-mail,
        participating in a survey, or completing an on-line form.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4d on 2026-09-27 while scouting California''s gap counties (Shasta County,
    in the Chico-Redding market, had no working source). The county office''s page frames a Google Sheet
    that district superintendents and charter school leaders update, listing every school in the county
    with its status. The live poller reads the county office''s page and follows what a browser loads:
    the frame (the sheet''s widget view, drawn in script) and the tab page the widget''s script names
    (/pubhtml/sheet?headers=false&gid=..., a table the server writes). A new sheet for a new school year
    is picked up from the page. Trinity County''s office (tcoek12.org, also Finalsite) embeds a sheet
    of the same design with widget=false, so its framed view is itself the server-written table. Proof
    (piece s4d, 2026-09-28): this is a status board, listing every school or system with its status every
    day, so a read proves it only when a row''s status is other than open (Closed, Early Dismissal, Remote,
    a delay); an all-open read does not (notices.gate_proofs, reported in coverage.json''s district_notice_gate).'
  shared_paths: []
