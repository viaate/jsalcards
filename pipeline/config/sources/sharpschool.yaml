# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: sharpschool
  name: 'SharpSchool district sites: the homepage''s emergency alerts'
  operator: Finalsite (SharpSchool, the CMS); each site's school district (the content)
  adapter: sharpschool
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: Lee's 'Terms of Use' (linked from its homepage footer, read 2026-10-03) say nothing about
      reading the site with software; they reserve the site's material ('Reproduction is prohibited other
      than in accordance with the copyright notice'), and the pipeline republishes no text of an alert,
      only the status the classifier draws from it. Marion's and Polk's homepages link no terms of use
      (read 2026-10-03). The alert service is what each public homepage asks for every visitor. Corona-Norco's,
      Desert Sands' and Butte County's (ID) homepages link no terms of use (read 2026-10-13).
    evidence:
    - url: https://www.leeschools.net/terms_of_use
      read_at: '2026-10-03T21:09:54Z'
      sha256: 1c80a93e463ca3e2a6fed4465bb0e4185a1f570ccd8ed7b05c6b271fae4c9357
      excerpt:
      - This website contains material which is owned by or licensed to us. This material includes, but
        is not limited to, the design, layout, look, appearance and graphics. Reproduction is prohibited
        other than in accordance with the copyright notice, which forms part of these terms and conditions.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4 (the coverage gate, round 1, 2026-10-03). The gate''s starting point named
    Lee, St. Lucie and Marion as the Florida counties with the most closure weight and no working source;
    the gap-state part had found in round 2 (2026-09-27, docs/research/firsthand/gaps.json, records LEE
    (FL), MARION (FL), POLK (FL)) that the Lee, Marion and Polk district homepages are SharpSchool sites
    whose emergency-alert component (unifiedPublishingAlertComponent, a React component) loads its alerts
    after the page by POSTing {"returnDummyAlerts":false} as JSON to the site''s /WebServices/UnifiedPublishing/UnifiedPublishingService.asmx/GetActiveAlerts
    (read from the component''s bundle, /Common/JavaScript/resourcelibrary/reactportlets/unifiedPublishingAlert.js,
    which reads the answer''s d list: AlertId, Title, Body, AlertType, Expiry), and left them unbuilt
    because the live poller sent only GET and the archive keeps no answer to a POST. This part added the
    POST read (a station''s data_post: the poller posts the page script''s own body, with no conditional
    request) and asked the archive for the homepages'' captures on hurricane days (archive-captures run
    37152148780): they show the districts posting closures on the homepage itself in its earlier forms,
    which this adapter reads (Lee''s SharpSchool hero slider, Hurricane Ian, captured 2022-10-04 03:52
    UTC; Marion''s Web Community Manager announcements app, Hurricane Ian 2022-09-27 23:56 UTC and Tropical
    Storm Idalia 2023-08-28 18:07 UTC). Polk''s homepage of 2022 was a WordPress page whose Smart Slider
    3 storm slide carried the Ian closure (captured 2022-09-28 10:03 UTC), which this adapter reads too.
    A district''s general alert channel, so a read proves a source only when a row announced a closing,
    a delay, an early dismissal, a remote day, cancelled classes, or weather or an emergency for the district
    (notices.gate_proofs). District-level sources: each counts only its district''s schools (leaids).
    Round 5 (2026-10-13): the critic of round 4 found three districts the gap-state part had recorded
    as ''not read'' after one timeout in late September whose homepages are SharpSchool sites with the
    same component, and whose alert service answers the component''s POST (HTTP 200, {"d":[]}): Corona-Norco
    Unified and Desert Sands Unified (Riverside County, CA) and Butte County Joint School District 111
    (Arco, ID); each was read again first-hand and added. Their homepages'' archived captures are read
    in the forms this adapter knows.'
  shared_paths: []
