# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: sinclair
  name: Sinclair stations' closings lists (NewsTicker files their pages frame, Chameleon ticker)
  operator: Sinclair, Inc. (Sinclair Broadcast Group) and its partner stations
  adapter: sinclair
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'Every Sinclair station site''s footer links Sinclair''s Terms & Conditions (https://sbgi.net/terms-conditions/),
      read 2026-09-27: use is for personal, non-commercial purposes, and among the prohibited uses is
      to ''Access the Service with any mining, scraping, data extraction or other tools''. (The first-hand
      check of 2026-09-26 searched the same page and missed that line.) The project owner decided on 2026-09-25
      to read the closings lists anyway for this non-commercial project (owner_decision below); the terms
      stay recorded here. robots.txt on every Sinclair Next.js host disallows /resources/ftptransfer/,
      the folder of the list files; the owner decided on 2026-09-26 to read closings files regardless,
      and each read records the verdict.'
    evidence:
    - url: https://sbgi.net/terms-conditions/
      read_at: '2026-09-27T06:24:26Z'
      sha256: d134f3ef7f7f08ade77dfb7404943fb666f2f9958fd4339c80a677e13a0a9fce
      excerpt:
      - You may only use the material and the services available through this Service for your personal
        and non-commercial use.
      - Access the Service with any mining, scraping, data extraction or other tools;
      - 'The following provision applies to all visitors to this Service (including, without limitation,
        persons, representatives of legal entities, and digital engines of any kind, including, without
        limitation, ones that crawl, index, scrape, copy, store, or transmit digital content): By accessing
        this Service, you specifically acknowledge and agree that: (i) AP Material shall not be published,
        broadcast, rewritten for broadcast or publication, or redistributed directly or indirectly in
        any medium;'
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c2, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming Sinclair''s
        /resources/ftptransfer/ files, Allen''s ftp2 files and WVEIS as examples). Relayed to the pipeline''s
        builder by the project''s build workflow; to revoke it, remove this block and live polling of
        this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        they frame or load) for Snowlight, a non-commercial project, although the terms above forbid automated
        access. robots.txt is read and its verdict recorded for every URL requested; the owner decided
        on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'Station list: Sinclair''s station map (https://sbgi.net/wp-json/sbg/v1/station-map, 140 station
    web domains), checked station by station in the first-hand check of 2026-09-26 (docs/research/firsthand/others.json,
    group Sinclair) and re-read live by this part on 2026-09-27. 38 news stations publish a list this
    adapter reads: 36 frame a NewsTicker export (or, at WJAC, WSBT, WTOV, WCYB and KRCG, a ''Closings
    Last Updated at'' grid) under /resources/ftptransfer/{call}/closings/ on their own host; WBFF frames
    its export on ftptransfer.sinclairstoryline.com; KATV and WZTV frame a Chameleon display page whose
    script reads the Chameleon ticker (ticker.news.sinclairinc.cloud). The live poller reads each framed
    file directly (data_url); the Chameleon display pages are followed to the ticker address they carry
    (base64-encoded, with the page''s own public key, which is therefore not written here). Five secondary
    sites frame a copy of their news station''s file under their own host and are read once, as that station:
    foxrochester.com (WUHF: WHAM''s file), foxchattanooga.com (WTVC''s), cw7michigan.com / arcwestmichigan.com
    (WWMT''s), cwcentralpa.com (WHP''s) and fox23maine.com (WPFO: WGME''s). Stations whose pages frame
    another platform''s list are registered there: KHGI''s WeatherThreat list (weatherthreat-ntv), WJAR''s
    frame of the Rhode Island Broadcasters Association list (riba-statewide), the TownNews BLOX pages
    of WRSP, WICS and KHQA (blox), and the FlashAlert region reports KATU, KUNP, KVAL, KPIC, KCBY and
    KMTR frame (platform flashalert). The news stations without a readable list are registered as no_endpoint
    with the check that found none; the 37 secondary CW, MyTV and Telemundo sites without a closings page
    are not listed (their news station''s record covers the market).'
  shared_paths: []
