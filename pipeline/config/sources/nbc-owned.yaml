# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: nbc-owned
  name: NBC Owned Television Stations school closings
  operator: NBCUniversal Local (NBC Owned Television Stations, Comcast)
  adapter: nbc-owned
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: The NBC-owned station sites' footers link NBCUniversal's Terms of Service (https://www.nbcuniversal.com/terms,
      "Effective Date October 28, 2022; Updated December 24, 2024"), whose list of Prohibited Actions
      (https://www.nbcuniversal.com/terms/prohibited-actions) forbids collecting data from the services
      "by any means (whether automated or manual) other than through our currently available, published
      interfaces" and using "any robots, spiders, crawlers, devices, scripts or other data gathering or
      extraction software" to access, copy, monitor, scrape or aggregate content; the license is for personal
      use. The first-hand check of 2026-09-26 read only the main page and found no such clause; the Prohibited
      Actions page it links holds it. The project owner decided on 2026-09-25 to read the closings lists
      anyway for this non-commercial project (owner_decision below); the terms stay recorded here.
    evidence:
    - url: https://www.nbcuniversal.com/terms
      read_at: '2026-09-27T01:25:57Z'
      sha256: 9124347a94429173bcd9898d73d1da6daaee3211e9c15e990d652493d784d589
      excerpt:
      - Terms of Service Effective Date October 28, 2022; Updated December 24, 2024
      - Prohibited Actions. You may not attempt any of the actions set forth in this list of Prohibited
        Actions or authorize, facilitate or induce others to do so.
      - We grant you a limited, non-sublicensable, non-transferable license to access and use the NBCUniversal
        Services for your personal use, and only in accordance with these TOS.
    - url: https://www.nbcuniversal.com/terms/prohibited-actions
      read_at: '2026-09-27T01:26:32Z'
      sha256: 6b39c232850b981d4002db71f85586f850a14c405f02e376b4385a0c9099e613
      excerpt:
      - No Data Extraction. You may not access, search and/or collect data from, or attempt to access,
        search and/or collect data from, the NBCUniversal Services by any means (whether automated or
        manual) other than through our currently available, published interfaces that are made available
        to you by us, unless NBCUniversal has given its express written authorization to do so.
      - you may not use any robots, spiders, crawlers, devices, scripts or other data gathering or extraction
        software and/or tools, whether automated or manual, to access, acquire, copy, monitor, scrape,
        data mine, or aggregate any Content or any portion of the NBCUniversal Services for any purpose
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c1, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming CBS''s assets1.cbsnewsstatic.com
        feeds as an example). Relayed to the pipeline''s builder by the project''s build workflow; to
        revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        or routes they load) for Snowlight, a non-commercial project, although the terms above forbid
        automated access. robots.txt is read and its verdict recorded for every URL requested; the owner
        decided on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'Station list: Wikipedia ''NBC Owned Television Stations'' currently-owned table, read 2026-09-26
    by the first-hand check (11 English-language NBC stations). Ten NBC-owned sites publish their closings
    list at the WordPress REST route /wp-json/nbc/v1/school-closings (the live poller''s data_url; each
    answered HTTP 200 on 2026-09-27, three of them populated: NBC New York, NBC Connecticut and NBC Boston)
    and render the same list on /weather/school-closings/. Archived captures (archive-captures runs 36311251817,
    36323195832 and 36330775706) show that page in two designs, both read by the adapter: the page before
    the WordPress platform (January 2017 to November 2019; rows at NBC Connecticut, 159 on 8 February
    2017, NBC Philadelphia and NBC Boston) and the WordPress page (from December 2019); NBC New York,
    Philadelphia, Washington, Boston, Connecticut and Dallas-Fort Worth listed rows on storm days (NBC
    Connecticut 853 on 13 February 2024, NBC DFW 426 on 2 February 2022), and the REST routes of NBC New
    York (6 items on 22 February 2026, 27 on 13 March 2020), NBC Philadelphia (22 on 16 March 2020) and
    NBC Connecticut (430 the day after 22 February 2026) held rows. Every capture read of the NBC Los
    Angeles, San Diego, Bay Area and Miami pages (2016 to 2026) was empty, on closure days too: all 26
    NBC Los Angeles captures of the January 2025 fire closures (6 to 15 January) and of the November 2024
    Mountain fire, NBC Bay Area during the October 2017 North Bay fires and the January 2023 storms, NBC
    7 San Diego during the January 2025 fire weather, and all 11 NBC 6 Miami captures of hurricane days
    (Eta 2020, Ian and Nicole 2022, Idalia 2023, Milton and Rafael 2024; runs 36345276947, 36348669505
    and 36353079096). Every archived capture of their four REST routes (41, 2019 to 2026, CDX run 36345276947)
    has one of the two digests of route captures read empty elsewhere (S7IXBYKV..., DFAKE2U3...). These
    four stations stay unproven: their lists answer but no reader has ever seen them used. NBC Chicago''s
    closings address redirects to the Emergency Closing Center (platform ecc), so WMAQ has no list of
    its own. robots.txt allowed every route and page when checked.'
  shared_paths: []
