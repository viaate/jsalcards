# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: apptegy-feed
  name: 'Apptegy (Thrillshare) district live feeds: the posts a district sends to its site, app, texts
    and Facebook at once'
  operator: Apptegy, Inc. (Thrillshare); each school district (the posts)
  adapter: apptegy-feed
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: 'The district sites are public school districts'' own websites; they publish no website terms
      of use (their footers link student-privacy pages such as FERPA notices, read 2026-09-27) and nothing
      against reading them with software, and every site''s robots.txt reads ''Allow: /''. Apptegy''s
      corporate site (apptegy.com) answered a bot challenge (''Client Challenge'') to the project''s User-Agent
      on 2026-09-27, so Apptegy''s own terms could not be read; the challenge was not worked around.'
    evidence:
    - url: https://www.hillsboroughschools.org/page/family-educational-protection-rights-ferpa
      read_at: '2026-09-27T15:29:38Z'
      sha256: 2f4ccd844b3c41e120a289d46b8c1bc4cea5238fb3070b266d023ae37cf8c4a4
      excerpt:
      - The Family Educational Rights and Privacy Act (FERPA) is a Federal law that protects the privacy
        of student education records, such as report cards, transcripts, disciplinary records and class
        schedules.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4 (the coverage gate, final round, 2026-10-13) under the owner''s gate of 2026-10-13
    (''dig for 90%+ of Idaho and Wyoming''). Wyoming''s Casper - Riverton districts'' homepage banners
    were never seen holding a closing in the archive (storm-read): an Apptegy district posts its closings,
    delays and early dismissals in its live feed, which Thrillshare sends to the site, the app''s push
    notifications, texts and Facebook at once, and which keeps every post with the time the server stamped
    it. The homepage loads the feed by script from https://thrillshare-cmsv2.services.thrillshare.com/api/v4/o/<organization>/cms/live_feeds
    (the organization is in the homepage''s own state); that host has no robots.txt (404: unrestricted).
    That verdict was first recorded at 2026-10-13T13:29:33Z, after the feed pages behind the history fixtures
    (each feed''s ?page_no= pages, read 12:55-13:14Z the same day) had been read: no robots.txt means
    no URL of the host is disallowed, so it is the verdict for every page read, but it was not read before
    them; every later scratch read of this round checked robots.txt first, URL by URL. A district-level
    source: each counts only its own district''s schools (leaids). A general channel (most posts are events
    and sports): a post proves the feed only as a weather or emergency closing (notices.weather_closing),
    and a post of the feed''s dated history only when published near the days it names, with an NWS advisory
    or warning over the district that school day or an emergency named (snowlight.sources.stations.history).'
  shared_paths: []
