# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: finalsite
  name: 'Finalsite school district sites: homepage page pops (alerts)'
  operator: Finalsite (the CMS); each site's school district (the content)
  adapter: finalsite
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: The district sites publish no terms of use of their own, and finalsite.com links only a privacy
      policy (read 2026-09-27), which covers what Finalsite collects from visitors and says nothing against
      reading public pages with software. The page-pops fragment is what each public homepage loads for
      every visitor.
    evidence:
    - url: https://www.finalsite.com/privacy-policy
      read_at: '2026-09-27T15:56:28Z'
      sha256: 00af052f2cc6654a841c102e2ec264c96cf7e33efac6d4b1da6537d5111b344a
      excerpt:
      - 'The personal information that Finalsite collects falls into three primary categories: (1) information
        you voluntarily provide to us, (2) information we collect from you automatically, and (3) information
        we collect from third parties.'
    permission: null
    owner_decision: null
  notes: 'Found for piece s4d on 2026-09-27 while scouting the gap states'' largest districts: Billings,
    Great Falls, Missoula, Bozeman, Kalispell and East Helena (MT), Pocatello-Chubbuck and Blaine County
    (ID), Teton County (WY) and Broward, Palm Beach, Pinellas, Volusia, Escambia and Collier (FL) are
    Finalsite sites. A Finalsite page''s script (the page-pops module of its application.js) asks /fs/pages/<data-pageid>/page-pops
    for the page''s alerts and opens each article.fsPagePop as a dialog (''N page alerts''); the poller
    reads that fragment. Some districts also post notices as news posts; those are not read. The rows
    name no school: each source is district-level (leaids). A second search the same day (the website
    the NCES CCD 2024-25 LEA directory lists for each unbuilt district of Montana''s and Wyoming''s gap
    counties; Idaho''s LEA records list none) found nine more: Havre, Lewistown, Laurel, Thompson Falls,
    Hellgate and Hobson (MT), Sweetwater #1 and Laramie #2 (WY), and Idaho Falls District 91 (ifschools.org,
    ID); and five more Florida county districts (Hendry, Franklin, Baker, Bradford, DeSoto) and Challis
    #181 (ID), found by a search; 30 sites in all. Proof (piece s4d, 2026-09-28): a district''s general
    alert channel, so a read proves it only when a row announced a closing, a delay, an early dismissal,
    a remote day, cancelled classes, or weather or an emergency for the district; hiring, board, election,
    enrollment and calendar notices do not (notices.gate_proofs, reported in coverage.json''s district_notice_gate).
    Round 3 (piece s4d, 2026-09-28): the district sites of South Texas'' uncovered counties (Hidalgo,
    Nueces, Cameron, Victoria, Webb, El Paso, San Patricio and the smaller ones around them), found by
    reading the website the NCES CCD 2024-25 LEA directory lists for each of their districts: 29 more
    Finalsite sites there. Round 4 (piece s4d, 2026-09-28): the district sites of the Mobile - Pensacola
    market''s uncovered counties (Mobile, Baldwin, Escambia, Clarke, Washington, Conecuh and Monroe in
    Alabama; Santa Rosa in Florida), found by reading the website the NCES CCD 2024-25 LEA directory lists
    for each of their districts: 8 more Finalsite sites there. Round 4, second batch (2026-09-28): the
    district sites of the other gap counties no working list reached (the Glendive, Alpena and Zanesville
    markets, the Mississippi Delta and coast, the Chico - Redding and Palm Springs markets and Del Norte),
    found the same way: 14 more Finalsite sites there. Round 5 (piece s4d, 2026-09-28): read through the
    homepage. /fs/pages/<id>/page-pops answers HTTP 200 with an empty body for any ID (read with the project''s
    client 2026-09-28T22:43Z: Billings'' 999999 and ''abc'', Chickasaw''s 999999, whose page 2 holds a
    pop), so the empty answer proves nothing unless the page named it. Every station now registers no
    data_url: the poller reads its homepage (page_url), the adapter reads the page''s own body data-pageid
    (a published Finalsite page: the fsLiveMode class) and the poller follows it to /fs/pages/<data-pageid>/page-pops.
    Each station''s page_check is a browser check of its homepage (finalsite_pagecheck.cjs, 2026-09-28
    22:37-22:44 UTC: all 82 asked for exactly one page-pops address, of their own data-pageid, answering
    200), and fetch.page_check_mismatch holds every live read to it: a homepage naming another page ID,
    none, or no Finalsite page at all is an error, never an empty list. Laramie #2 and the Floretta P.
    Carson academy now redirect to www.laramie2.org and www.fpcarsonacademy.org; their pages are read
    there. Archived homepages are read too: a Finalsite page is followed to the capture of its own page
    pops, an older template holding its pops in the page (Volusia, 2024-10-14) is read in place, and a
    district''s earlier Web Community Manager homepage (Palm Beach, 2024-10-10) by its important announcements.'
  shared_paths: []
