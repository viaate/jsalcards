# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: allen
  name: Allen Media Broadcasting stations' closings files (ftp2 hosts)
  operator: Allen Media Broadcasting (Allen Media Group)
  adapter: allen
  poll_minutes: 10
  terms:
    automated_access: permitted
    summary: 'Allen Media''s station terms (https://www.kwwl.com/site/terms.html, the same template at
      every Allen BLOX site), read 2026-09-27: use is for lawful, non-commercial purposes, content may
      not be reproduced, published or exploited; no clause on robots, scraping, crawling or automated
      access was found (grep of the page''s text). robots.txt on most ftp2 hosts is ''Disallow: /'' (KWWL,
      WXOW, WQOW, WAOW, WKTV, WJRT); the owner decided on 2026-09-26 to read closings files regardless,
      and each read records the verdict.'
    evidence:
    - url: https://www.kwwl.com/site/terms.html
      read_at: '2026-09-27T06:24:32Z'
      sha256: 26eaf99bbc746f83f103a29db7bfed1b982d7d7750cf4e74f527587040fd4609
      excerpt:
      - You shall use the Services for lawful, non-commercial purposes only and on a non-exclusive, non-assignable,
        non-transferable basis.
      - You may not remove, modify, reproduce, publish, transmit, publicly display, publicly perform,
        participate in the transfer or sale, create derivative works, or in any way exploit, any of the
        content, in whole or in part.
      - (no clause on robots, spiders, scraping, crawling or automated access was found in the page's
        text)
    permission: null
    owner_decision: null
  notes: 'Station list: Wikipedia''s Allen Media Group table as read by the first-hand check of 2026-09-26
    (docs/research/firsthand/others.json). Seven stations frame a closings file on their ftp2 host from
    their BLOX closings page: KWWL, WXOW, WQOW, WAOW and WKOW (NewsTicker exports), KIMT (a header table)
    and WKTV (a CGS Infographics ''All Active'' page). WJRT, which frames ftp2.wjrt.com the same way,
    is now a Gray station and is registered there (gray-wjrt). The live poller reads the ftp2 file (data_url).
    The banner counter each page reads (amb-feeds.s3.amazonaws.com/{CALL}_closings.json: a count, not
    a list) is kept as an archive URL. KVOA, KEZI, KDRV and KHSL publish no list this pipeline could read
    (their pages answered 404 or HTTP 429 from TownNews on 2026-09-26 and 2026-09-27); the nine stations
    Allen sold in 2026 are Gray sites now (platform gray).'
  shared_paths: []
