    of 2025-12-04 to 06 name no closing, and North Gem''s archived page that day held none); North Gem
    School District 149 (Caribou County) closed for weather on 2026-02-18, under a warning for its own
    zone, and KIFI wrote nothing of it (its stories of 2026-02-17 to 20: highways closed by ice, snowdrifts
