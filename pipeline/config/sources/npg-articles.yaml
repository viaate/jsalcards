# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: npg-articles
  name: News-Press & Gazette stations' closings articles (KIFI Local News 8, Idaho Falls)
  operator: News-Press & Gazette Co. (KIFI, Local News 8)
  adapter: wp-closings
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'KIFI''s Terms of Use (https://localnews8.com/terms-of-use/, linked from every page''s footer;
      News-Press & Gazette''s, the same as KQ2''s in npg.yaml), read 2026-10-13: ''You will not manipulate
      this Website by any means, including but not limited to the use of bots, botnets, automated scripts,
      or other automated or electronic means'', and use only for private, non-commercial purposes. The
      project owner decided on 2026-09-25 to read closings lists anyway for this non-commercial project
      (owner_decision below); the terms stay recorded here. localnews8.com''s robots.txt disallows only
      /wp-content/uploads/wpforms/ (the REST list of posts: no rule matches).'
    evidence:
    - url: https://localnews8.com/terms-of-use/
      read_at: '2026-10-13T13:08:31Z'
      sha256: 613844281ec20daacdd5428805a86cc036d700918d46deba6bfb1415b59829c2
      excerpt:
      - You will not manipulate this Website by any means, including but not limited to the use of bots,
        botnets, automated scripts, or other automated or electronic means.
      - You will use this Website only for private, non-commercial purposes.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4d, round 4): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." Relayed to the pipeline''s builder by the project''s build workflow;
        to revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of KIFI''s closings articles (the site''s REST list of posts searched for them)
        for Snowlight, a non-commercial project, although the terms above forbid automated means. robots.txt
        is read and its verdict recorded for every URL requested. Unchanged by it: the User-Agent names
        the repository (never a browser string), only that list is requested (no crawling), requests are
        paced per host with backoff on 429 and 5xx answers, and a station that blocks the project (a 403,
        or a bot challenge) is not worked around.'
  notes: 'Found for piece s4 (the coverage gate, final round, 2026-10-13) while digging for Idaho and
    Wyoming under the owner''s gate of 2026-10-13. The Idaho Falls - Pocatello market had no working whole-county
    source: KIFI''s /weather/closings/ answers 404, KPVI''s ''School Closures'' is one BLOX article last
    changed 2025-02-25, East Idaho News answers 403 (not worked around). KIFI''s newsroom types each storm
    day''s closings into an article titled for the day (''School closures and delays for Wednesday, March
    6'', 2024; ''School Closures - Tuesday February 25, 2025'') and gives a single school''s or district''s
    closing a story of its own (''Taylorview Middle School closed Thursday due to down heat pumps'', 2025-12-18;
    ''Teton County Schools Closed Tomorrow due to Jackson Boil Order'', 2026-09-25; ''School canceled
    for Chief Tahgee Elementary Academy'', 2026-10-07). The live poller reads the site''s REST list of
    posts searched for ''school'', the wire''s and the networks'' categories (AP, CNN, Stacker) left out,
    newest first, keeps the station''s own closings articles (wp_closings: a dateline crediting another
    outlet is not the station''s) and their rows while stamped within 36 hours; the newest closings article''s
    publication is the list''s own time, judged by the closure-season rule like any list''s. Recall, checked
    2026-10-13 against every KIFI closings article the REST list answered from 2022-09 to 2026-10 (47:
    27 list articles, 20 stories; tests/stations/test_wp_closings_kifi.py). Proof: the article of 2024-03-06
    read from the same list (a history fixture; snowlight.sources.stations.history).'
  shared_paths: []
