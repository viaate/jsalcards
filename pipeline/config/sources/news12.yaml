platform:
  id: news12
  name: News 12 school closings and delays (one page per region)
  operator: News 12 Networks (Altice USA)
  adapter: news12
  poll_minutes: 10
  terms:
    automated_access: permitted
    summary: The closings pages' footer links News 12's terms of service at http://www.news12.com/story/35212665/terms-of-service,
      an address from News 12's former site; it did not answer this pipeline within its timeouts on 2026-09-27,
      and no current terms page was found. No clause on automated access was read.
    evidence:
    - url: https://itv.news12.com/school_closings/closings.jsp?region=LI
      read_at: '2026-09-27T06:09:31Z'
      sha256: null
      excerpt:
      - '(no terms of use were found for the site: the page''s footer links http://www.news12.com/story/35212665/terms-of-service,
        which did not answer within the pipeline''s timeouts on 2026-09-27)'
    permission: null
    owner_decision: null
  notes: 'Found by the first-hand check of 2026-09-26: one server-rendered page per region, https://itv.news12.com/school_closings/closings.jsp?region={LI,NJ,WC,HV,CT,BX,BK}
    (NJ confirmed by a News 12 page; HV, BX and BK answer the same template). Each region is given the
    New York market''s counties (News 12''s regions are cable channels inside that market; the page names
    no counties). The pages were populated live on 2026-09-26 and 2026-09-27 (LI 6 rows, WC 1, CT 4).'
  shared_paths: []
