# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: cowles
  name: Cowles Montana Media school closures ticker (KULR-8 and NonStop Local Montana)
  operator: Cowles Montana Media Company (KULR, KFBB/KHBB, KTMF, KWYB)
  adapter: cowles
  poll_minutes: 10
  terms:
    automated_access: permitted
    summary: The terms of both Cowles sites (the TownNews BLOX template at https://www.montanarightnow.com/site/terms.html
      and https://www.kulr8.com/site/terms.html, read 2026-09-27) limit the material to 'private, non-commercial
      use' and forbid bots that scrape or copy content 'to train an LLM or other artificial intelligence'.
      They have no clause against automated reading as such. Snowlight is non-commercial and reads only
      the closures ticker, to show each school's status; nothing read is used to train a model. The ticker
      itself is a public-read S3 object with no terms of its own.
    evidence:
    - url: https://www.montanarightnow.com/site/terms.html
      read_at: '2026-09-27T11:21:22Z'
      sha256: 45fdac38a93474867cb32871ff2b508922ea48fccc38f8fb3f290c6653e6c577
      excerpt:
      - The material on the Web site is provided for private, non-commercial use only.
      - Without limiting the generality of the foregoing you agree that you will not use or cause any
        bot or other automated function to scrape or “memorize” or copy any of the Website content to
        train an LLM or other artificial intelligence.
    - url: https://www.kulr8.com/site/terms.html
      read_at: '2026-09-27T11:24:39Z'
      sha256: e37a200e8c94ed4c829fd9e4ef175ab1122a7206ec92315f61e90a540921612f
      excerpt:
      - The material on the Web site is provided for private, non-commercial use only.
      - Without limiting the generality of the foregoing you agree that you will not use or cause any
        bot or other automated function to scrape or “memorize” or copy any of the Website content to
        train an LLM or other artificial intelligence.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4d (the gap states) on 2026-09-27: Montana had no working source (9% of its
    schools covered, the largest gap in the closure-weighted ranking). KULR-8''s ''Montana School Closures''
    page (https://www.kulr8.com/schoolclosures/) and NonStop Local Montana''s ''School Closures Around
    Montana'' page (https://www.montanarightnow.com/schoolclosures/, the site of KFBB/KHBB Great Falls-Helena,
    KTMF Missoula and KWYB Butte-Bozeman; kfbb.com and abcfoxmontana.com redirect there) both frame one
    file the company''s ticker system writes to S3, https://company-wide-tickers.s3.us-west-2.amazonaws.com/KULR_School_Results/closings.html.
    The live poller reads the file. One station per call sign, each counting its own market''s counties
    (the list is the closings page of every one of them); all five read the same file. NBC Montana (KECI,
    KCFW, KTVM, also Cowles) shows no closings list (nbcmontana.com, checked 2026-09-26 and 2026-09-27).
    The ticker''s rows name no county, so the county lists rest on the stations'' markets. The ticker
    is in use: NonStop Local Montana''s article ''Montana School Closures for March 12, 2026'' (https://www.montanarightnow.com/montana-school-closures-for-march-12-2026/article_e17217db-8084-456c-b3f5-f2bbe77bded5.html,
    published 2026-03-11T17:38-06:00; archived 20260313115733 in the listing of run 36315417698; read
    live 2026-09-27T15:38:40Z, sha256 1f399b70f147390f...) says ''The following schools have reported
    they will be closed or delayed on March 12, 2026:'' over an iframe of this same S3 file. That frames
    the ticker on a storm day, but it is not proof of a populated list: the article holds no rows of its
    own and the S3 file itself has no archived capture, so the five stations stay unproven until a live
    read (or a capture) shows a row.'
  shared_paths: []
