# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: abc-owned
  name: ABC Owned Television Stations school closings pages
  operator: ABC Owned Television Stations (The Walt Disney Company)
  adapter: abc-owned
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'The ABC-owned station sites'' footers link Disney''s Terms of Use (https://disneytermsofuse.com/,
      "Last Updated: May 24, 2024"), which forbid accessing, monitoring, copying or extracting the Disney
      Products "using a robot, spider, script, or other automated means", data mining and web scraping
      included (public search engines excepted), and license them for personal, noncommercial use. The
      project owner decided on 2026-09-25 to read the closings lists anyway for this non-commercial project
      (owner_decision below); the terms stay recorded here.'
    evidence:
    - url: https://disneytermsofuse.com/english/
      read_at: '2026-09-27T01:25:53Z'
      sha256: da40caa1e5e182ec84fa5d2a1edaf4dcb3374e6caad84cc013fefefeaddcadce
      excerpt:
      - 'Last Updated: May 24, 2024'
      - access, monitor, copy or extract the Disney Products using a robot, spider, script, or other automated
        means, including, for the avoidance of doubt, for the purposes of creating or developing any AI
        Tool, data mining or web scraping or otherwise compiling, building, creating or contributing to
        any collection of data, data set or database (other than for a public search engine’s use of spiders
        for creating search indices to the extent not disallowed by Disney, including through the applicable
        robots.txt files or NOINDEX or NOFOLLOW meta-tags)
      - You understand that the Disney Products are for your personal, noncommercial use and are intended
        for informational and entertainment purposes only
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c1, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming CBS''s assets1.cbsnewsstatic.com
        feeds as an example). Relayed to the pipeline''s builder by the project''s build workflow; to
        revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        or routes they load) for Snowlight, a non-commercial project, although the terms above forbid
        automated access. robots.txt is read and its verdict recorded for every URL requested; the owner
        decided on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'Station list: Wikipedia ''ABC Owned Television Stations'' currently-owned table, read 2026-09-26
    by the first-hand check (8 stations). Every ABC-owned station''s closings page is https://{site}/community/schoolclosings/,
    rendered on the server by Disney''s abcotv application; the page state''s schoolclosings.time (epoch
    seconds) is when the list last changed, and the page''s ''Last updated'' line is that instant in UTC.
    On 2026-09-27 the Los Angeles (KABC), San Francisco (KGO) and Fresno (KFSN) pages, and WLS''s page
    state, all said the list was last updated 02/12/2019 08:39pm (time 1550003979): those lists have not
    listed a closing since, so the live reader records them as stale (not working) until they change;
    every archived capture of those three pages (May 2019 to June 2025) carries the same time. WLS (Chicago)
    renders no list: its page frames https://wgnr-closings.s3.amazonaws.com/index.html, which answered
    403 AccessDenied; Chicago''s working list is the Emergency Closing Center (platform ecc). Archived
    storm-day captures (archive-captures run 36293423860) show two page designs, both read by the adapter:
    the older server-rendered list without the page state (December 2015 to February 2019; its earliest
    empty form is one empty list) and the abcotv application (from May 2019). The WABC, WPVI, WTVD and
    KTRK lists held rows in both (WPVI 316 on 19 January 2024, WTVD 326 on 21 February 2020, KTRK 82 on
    26 January 2026 and 121 during Hurricane Harvey on 27 August 2017, WABC 14 on 23 February 2026); WLS''s
    own list held 962 rows on 8 January 2015 and 1,062 rows on 9 February 2018, and every WLS capture
    from January 2021 to January 2026 frames the closing center copy. robots.txt on every ABC host allowed
    the closings page when checked (see each station''s robots block).'
  shared_paths: []
