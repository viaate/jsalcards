# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: ecc
  name: Emergency Closing Center (Chicago)
  operator: Emergency Closing Center, run on WGN Radio's closings data (Nexstar Media Inc.)
  adapter: ecc
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'The Emergency Closing Center''s application (wgnr-closings.emergencyclosingcenter.com) links
      no terms; its data file is served from Nexstar''s host media.psg.nexstardigital.net as WGN Radio''s
      (WGNR) closings, so Nexstar''s Terms of Use apply (https://www.nexstar.tv/terms-of-use/, "UPDATED:
      September 16, 2026", covering Nexstar "together with its Affiliates"): they forbid using "any robot,
      spider ... or processes on the Properties, for any purpose" and to "Scrape, data-mine or data-crawl
      the Properties". The project owner decided on 2026-09-25 to read the closings lists anyway for this
      non-commercial project (owner_decision below); the terms stay recorded here.'
    evidence:
    - url: https://www.nexstar.tv/terms-of-use/
      read_at: '2026-09-27T01:26:07Z'
      sha256: 38dab9dbbb8635ea72e3d599bdcc107836b2ed7a373ff00fb7ba646a4ba1108b
      excerpt:
      - 'UPDATED: September 16, 2026'
      - The Properties are for your personal and non-commercial use only, unless otherwise permitted by
        us.
      - Use any robot, spider, spyware, or any other device, method, or processes on the Properties, for
        any purpose.
      - Scrape, data-mine or data-crawl the Properties or engage in any data gathering or data extraction
        practices for any purpose.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c1, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming CBS''s assets1.cbsnewsstatic.com
        feeds as an example). Relayed to the pipeline''s builder by the project''s build workflow; to
        revoke it, remove this block and live polling of this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        or routes they load) for Snowlight, a non-commercial project, although the terms above forbid
        automated access. robots.txt is read and its verdict recorded for every URL requested; the owner
        decided on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'The Emergency Closing Center is Chicago''s shared closings system: CBS 2 (WBBM) and FOX 32 (WFLD)
    frame its application, NBC 5 (WMAQ) redirects its closings address to it, and WGN frames it too (WGN
    is registered by the Nexstar platform, nexstar-wgn, which reads the same data file). The application''s
    script (read 2026-09-26 and 2026-09-27) loads https://media.psg.nexstardigital.net/WGNR/closings/closings.json
    every 120 s; the live poller reads that file. Its legacy page www.emergencyclosingcenter.com/complete.html
    answered 403 AccessDenied (first-hand check); archived, that page (the closing center''s own site,
    run by WGN Radio before the application) listed 3,274 facilities on 6 January 2014, 3,672 on 7 January
    2014 and 3,358 on 8 January 2015 (runs 36345276947 and 36348669505; fixture ecc/chicago-legacy-20140106060437.html),
    read as the adapter''s ecc-legacy-page variant; the old site''s home page (/ecc/home.jsp, an archive
    URL) carried the same table below its search form (3,210 facilities on 6 January 2014, 2,860 on 30
    January 2019; run 36355124151), read the same way and kept out of the fixtures for its size (about
    1 MB). When the Nexstar registry is loaded beside this one, the data file''s archived captures are
    attributed to nexstar-wgn, which lists the file among its archive URLs; this platform''s own proof
    of the file are its test fixtures (source ecc-chicago, tests/stations/fixtures/networks/ecc/), eight
    archived captures of the file from December 2023 to August 2026, seven of them populated (up to 203
    closings on 20 January 2025).'
  shared_paths: []
stations:
