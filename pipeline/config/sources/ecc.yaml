  evidence: 'First-hand check of 2026-09-26 (docs/research/firsthand/others.json, record ECC); application
    https://wgnr-closings.emergencyclosingcenter.com/index.html (create-react-app shell) and its data
    file https://media.psg.nexstardigital.net/WGNR/closings/closings.json (named in static/js/main.c73bd0ff.chunk.js,
