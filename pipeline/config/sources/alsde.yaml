  notes: 'Found for piece s4d in round 4 (2026-09-28) while scouting the Mobile - Pensacola market''s
    uncovered counties: the ALSDE homepage (https://www.alabamaachieves.org/, read 2026-09-28T14:41:17Z)
    links ''Weather Closure List'' (https://www.alabamaachieves.org/weather-closure-list/), which frames
    the statewide ''School Closures/Delays'' list at https://schoolnotification.alsde.edu/SchoolClosuresPublic.aspx
    (an ASP.NET page; its DevExpress grid is rendered on the server with every report it shows). Alabama''s
    public school systems report their closings, delays and early dismissals there (the columns Date,
    System, School(s), Type of Closure, Opening or Closing Time, Reason, activities cancelled, Superintendent
    Comments, Modified). The list names public school systems and their schools, not private schools,
    so the station is a district-level source (leaids) counting only the systems it has been seen to name
    (a real basis: the systems in its own lists), city, county and charter systems alike; archived captures
    (runs 36445058527 and 36470567011) show 98 systems over five school years, never Mobile County, which
    is left to its own site. A closings list, not a status board: any report proves it.'
