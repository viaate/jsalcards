platform:
  id: district-homepage
  name: 'Utah district homepages read whole: Granite, Jordan, Canyons, Washington County and Provo'
  operator: Each school district (its own WordPress site)
  adapter: district-homepage
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: Read 2026-10-05 (05:53 UTC) with the project's User-Agent. Granite's 'Terms of Use' (https://www.graniteschools.org/terms-of-use)
      grant a license to view the site's materials for personal, non-commercial, transitory viewing and
      forbid modifying, copying, mirroring or commercial use; they say nothing of reading with software.
      Snowlight is non-commercial, reads only the emergency notifications file the homepage itself loads,
      and shows each school's status, not the district's materials. Jordan's 'Terms of Use' (https://jordandistrict.org/resources/terms/)
      are a disclaimer about outside links and the browsers the site is tested in. Canyons' privacy policy
      statement, Provo's privacy notice and Washington County's data privacy page (the sites' only policy
      links) are about student data, not the public site's readers. None forbids automated reading; each
      homepage's robots.txt is recorded with its station.
