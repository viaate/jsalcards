        County, U.S.A.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4 (the coverage gate, round 3, 2026-10-05): the critic of round 2 found that
    Utah''s largest districts had no source although Granite''s homepage script reads a public file (https://www.graniteschools.org/wp-json/wp/v2/en?notification_type=district,
    HTTP 200 [] that day). Read first-hand on 2026-10-05 between 05:3x and 05:54 UTC: Granite (84 schools)
    loads its emergency notifications from that file; Washington County (54) loads its alerts from https://alert.washk12.org/endpoint.php
    (one alert up, ''NEW STUDENT REGISTRATION''); Provo (21) renders an alerts section into its homepage
    (empty, ''section.alerts hidden''); Jordan (69, a WordPress theme with no alert plugin) and Canyons
    (49, Elementor) show what they post in the page. District-level sources: each counts only its own
    district''s schools (leaids). Proof: a district''s general alert channel (notices.gate_proofs): a
    read proves its station only when a row announced a closing, a delay, an early dismissal, a remote
    day, cancelled classes, or weather or an emergency for the district; a page-text row only by the stricter
    rule of notices.page_text_closing. The archive''s captures of the five homepages on Utah''s storm
    days, and the listings of the two files, were asked for by run 37269655553 (commit a01a012).'
  shared_paths: []
