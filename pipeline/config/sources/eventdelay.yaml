# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: eventdelay
  name: EventDelay closings widgets (WDEL SnoWatch)
  operator: Envisionwise (EventDelay) for Delmarva Broadcasting (WDEL)
  adapter: eventdelay
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: EventDelay links no terms of its own (https://eventdelay.com/terms answered 404 on 2026-09-27).
      WDEL's site terms (https://www.wdel.com/site/terms.html, Draper Media), read 2026-09-27, say users
      will not 'Use bots, automated scripts, or similar mechanisms to manipulate or interact with the
      Service.' The project owner decided on 2026-09-25 to read the closings list anyway for this non-commercial
      project (owner_decision below); the terms stay recorded here.
    evidence:
    - url: https://www.wdel.com/site/terms.html
      read_at: '2026-09-27T06:41:53Z'
      sha256: bd49b0776295e23eb96ef195f070c21d2213efbb08d79dc41f93e32bae60eb59
      excerpt:
      - 'Prohibited Uses You agree that you will not: Use bots, automated scripts, or similar mechanisms
        to manipulate or interact with the Service.'
      - You may not copy, reproduce, distribute, modify, adapt, publicly display, or otherwise exploit
        any material from the Service without prior written consent from Draper Media.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c2, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming Sinclair''s
        /resources/ftptransfer/ files, Allen''s ftp2 files and WVEIS as examples). Relayed to the pipeline''s
        builder by the project''s build workflow; to revoke it, remove this block and live polling of
        this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        they frame or load) for Snowlight, a non-commercial project, although the terms above forbid automated
        access. robots.txt is read and its verdict recorded for every URL requested; the owner decided
        on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'WDEL''s SnoWatch page (https://www.wdel.com/features/wdel-stormwatch/) frames EventDelay''s
    widget for channel 114 (''Wilmington''), which the server writes whole. The widget shows one list
    in two display modes: list mode (/list/, which the page framed from 2024 to December 2025, captured
    with rows on the storm days of 2025-01-08 and 2025-01-18) and page mode (/page, which the page frames
    since; seen only empty, and its template closes a table after each day, so its rows are written in
    a form never seen). The live poller reads list mode, which still answers with the same days (live
    2026-09-27). Before EventDelay the page framed the SnoWatch list (foreverdigitalmedia.com/wdel/snowatch.php;
    on delmarvabroadcasting.com in 2018); since 2025 that frame is inside an HTML comment, and the adapter
    reads its archived captures only (snowlight.sources.stations.snowatch). Other EventDelay channels
    were not enumerated.'
  shared_paths: []
