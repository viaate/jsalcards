# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: district-pages
  name: 'District homepages read whole: the short states'' districts with no vendor alert channel (Florida,
    Idaho, Wyoming, Mississippi, California)'
  operator: Each school district (its own site, on WordPress, Google Sites, Wix, Catapult, SchoolInSites,
    Smart Sites and others)
  adapter: district-homepage
  poll_minutes: 15
  terms:
    automated_access: permitted
    summary: 'Read 2026-10-13 (12:11 UTC) with the project''s User-Agent: each homepage''s links were
      searched for terms of use, a disclaimer, a legal notice or an acceptable-use page. Holmes (FL) links
      ''Terms of Use'' that condition use of the site on accepting its terms and notices and say nothing
      of reading it with software; Washington (FL) links a ''Terms of Use'' page that shows the homepage''s
      own content; St. Johns (FL) links its acceptable-use procedures (for students'' and staff''s use
      of the district network) and a disclaimer; Fremont #2 (WY) links a webpage disclaimer about the
      accuracy of its pages; Taylor (FL) a social-media disclaimer; Chico (CA) its acceptable-use policies
      for the district network. The other 50 homepages link no terms of use. None forbids reading the
      public homepage with software; Snowlight is non-commercial, reads only each homepage, and shows
      each school''s status, not the district''s text. Each homepage''s robots.txt is recorded with its
      station.'
    evidence:
    - url: https://www.hdsb.org/terms-of-use
      read_at: '2026-10-13T12:11:19Z'
      sha256: e1020c806803f2b118c6c4b6d734299cbd9d3313e5bf7b8be3b80a40f89f960b
      excerpt:
      - Holmes County Schools offers this Web site, including all information, software, products and
        services available from this Web site or offered as part of or in conjunction with this Web site
        (the “Web site”), to you, the user, conditioned upon your acceptance of all of the terms, conditions,
        policies and notices stated here. Holmes County Schools reserves the right to make changes to
        these Terms and Conditions immediately by posting the changed Terms and Conditions in this location.
    - url: https://www.stjohns.k12.fl.us/it/aup/
      read_at: '2026-10-13T12:11:12Z'
      sha256: 32499f74c69251c0b923622bcef45ceb710e80193fce0ac43f025370969501c9
      excerpt:
      - The purpose of the AUP is to ensure the safety, reliability, accountability, data integrity and
        security of the digital network and other district technology resources. It also protects our
        students, staff and technology resources. Separate Acceptable Use Procedures (AUP) documents are
        provided for students/visitors and employees of St. Johns County School District.
    - url: https://www.fremont2.org/webpage-disclaimer
      read_at: '2026-10-13T12:11:14Z'
      sha256: d0c3876f14b3262fd16e24bea07402f9e99af3cf22669bdd6e1dba9d8089d14e
      excerpt:
      - “The accuracy and quality of information cannot be guaranteed. The district will not be responsible
        for any information that may be lost, damaged, or unavailable due to technical or other difficulties.
        The district has made every reasonable attempt to ensure that the district’s web pages are educationally
        sound and do not contain links to any questionable material or anything that can be deemed in
        violation of the district’s electronic communications policy.”
    - url: https://www.chicousd.org/Departments/Information-Technology/Acceptable-Use-Policies/index.html
      read_at: '2026-10-13T12:11:23Z'
      sha256: 1d34dec7500171aaba239db9db3ab0aebeb18ca555e139a28e59e2ddbb862bfd
      excerpt:
      - The CUSD Board of Education supports the right of students, employees, and community members to
        have reasonable access to various information formats and believes it is incumbent upon users
        to utilize this privilege in an appropriate and reasonable manner.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4 (the coverage gate, round 5, 2026-10-13). The critic of round 4 found that
    the gap-state part''s records of late September called district homepages ''not built'' on a glance
    that no longer held (St. Lucie''s WordPress homepage) and ''not read'' after one timeout; the 68 records
    of the short states (FL, ID, WY, MS, CA) that said ''not built'' or ''not read'' were checked again
    on 2026-10-13 with the project''s User-Agent (the address the NCES CCD 2024-25 LEA directory lists,
    and, where it no longer answered, the district''s current site found by a web search). These 56 districts''
    homepages answer and carry none of the vendor alert channels the other district adapters read (Apptegy,
    Edlio, Finalsite, SharpSchool, Smart Sites alerts); what each district posts is in its homepage''s
    text, which the district-homepage adapter reads as district-homepage-text (a typed page: a line is
    kept live only while it names a day near the read or is new since an earlier read). District-level
    sources: each counts only its own district''s schools (leaids). Proof: a district''s general alert
    channel (notices.gate_proofs): a page-text row proves its station only by the stricter rule of notices.page_text_closing
    (a closing, delay, remote day or cancelled classes for weather or an emergency), or a dated closing
    an NWS warning corroborates. The archive''s listings of the homepages were asked for by archive-captures
    runs 38394807739 and 38395324045 (commits b18699e and 27aa7f2).'
  shared_paths: []
