# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: gray
  name: Gray Media GSync closings
  operator: Gray Local Media, Inc. (Gray Media)
  adapter: gray
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'The Gray Local Media Terms of Use (effective July 1, 2026), linked from every Gray station
      site, forbid reading the Services or any data available through them with a scraper, crawler or
      other automated system without Gray''s prior express written consent (sections (f) and (j)), and
      bar commercial reproduction or caching of Gray content without written permission. The closings
      exports on s3.amazonaws.com carry the data the station closings pages show, so they are treated
      as covered. The project owner decided on 2026-09-25 to read these lists anyway for this non-commercial
      project (owner_decision below); the terms stay recorded here. Requests for written permission would
      go to dmca-legal@graymedia.com (Gray Local Media, Inc., Attn: Legal Department, 445 Dexter Avenue,
      Suite 7000, Montgomery, AL 36104), as the terms say.'
    evidence:
    - url: https://www.kctv5.com/2020/02/14/gray-television-inc-terms-use-agreement/
      read_at: '2026-09-25T04:00:38Z'
      sha256: d7986ba64fbbb20f697e5cc18b880a2f98cd0e5a73142b0814399826b8839d87
      excerpt:
      - 'Gray Local Media, Inc. Terms of Use Agreement. Effective Date: July 1, 2026'
      - (f) Use or attempt to use any engine, software, tool, agent or other device or mechanism (including
        without limitation browsers, spiders, robots, avatars, artificial intelligence, or intelligent
        agents) to navigate or search the Services other than the search engine and search agents available
        from GLM and other than generally available third-party web browsers (e.g., Microsoft Edge, Mozilla,
        Firefox, or Google Chrome);
      - (j) Use any automated system, artificial intelligence, machine learning tool, large language model,
        web crawler, scraper, or data mining technology to access, collect, copy, index, store, reproduce,
        or train any model or algorithm on any GLM Content, Station content, or any data available through
        the Services, without the prior express written consent of GLM.
      - Except where permitted by law or expressly authorized by GLM, GLM Content may not be reproduced,
        distributed, transmitted, linked, cached or otherwise used for any commercial purposes unless
        you have the prior written permis[sion]
      - 'Requests for permission to use GLM Content for commercial purposes should be addressed to the
        contact person below: E-mail to dmca-legal@graymedia.com or send a letter to: Gray Local Media,
        Inc. Attn: Legal Department 445 Dexter Avenue, Suite 7000, Montgomery, AL 36104'
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4a, round 2): "terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." Relayed to the pipeline''s builder by the project''s build workflow;
        to revoke it, remove this block and live polling of this platform stops. The robots.txt decision
        is stated in the build instructions for piece s4a, round 3: "robots.txt does not exclude a station
        either: the owner decided on 2026-09-26 to read closings pages and data files even where robots.txt
        disallows them ... Still fetch and record each host''s robots.txt verdict in the registry and
        health output."'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the data files
        they load) for Snowlight, a non-commercial project, although the terms above forbid automated
        access. robots.txt: the project owner decided on 2026-09-26 to read closings pages and the list
        files they load even where robots.txt disallows them; robots.txt is still read for every URL and
        its verdict recorded here (each station''s robots block) and in every live read''s health, and
        any Crawl-delay it sets paces the requests. Unchanged: the User-Agent names the repository (never
        a browser string), requests touch only the closings page or the list file it loads (never a crawl),
        are paced per host with conditional requests and backoff on 429 (honouring Retry-After) and 5xx
        answers, and a station that actively blocks the project (a 403, a bot challenge) is dropped and
        noted, never worked around.'
  notes: 'Every station''s closings export is a JSON file at https://s3.amazonaws.com/grayfilestore-{call}/closingsData/closings_{CALL}.json
    (also served at grayfilestore-{call}.s3.amazonaws.com); 123 keys were confirmed to exist by the research
    (docs/research/sources.json, rounds 2-4, 2026-09-25). The path-style URLs are governed by https://s3.amazonaws.com/robots.txt,
    which answers 403 (RFC 9309: unavailable, no restriction); the Gray terms above forbid automated reading,
    and the owner''s decision above covers these files as it covers the pages. Station sites'' robots.txt
    (read by `snowlight stations robots`) disallow GPTBot, anthropic-ai, ClaudeBot, CCBot and other AI
    agents site-wide. KYTV''s export is under the brand name KY3 and WANF''s under its former call sign
    WGCL. Gray stations with no known closings endpoint: the registry lists, as no_endpoint, the nine
    the research probed without finding an export, and seven stations with a news site of their own that
    the research did not list (KATC, WPGA, WBBJ, WFLX, WMBF, WWSB, KYOU); archived captures, where any
    exist, decide whether each gets an endpoint. The navbox Template:Gray Media (English Wikipedia, read
    2026-09-25) also names these, not registered: out of scope (Alaska and Hawaii) KAUU, KTUU, KTVF, KFVE,
    KGMB, KHNL; stations whose infobox names a registered station''s site, so their closings are that
    station''s: WCOV (wsfa.com), WFXU (wctv.tv), WQCW (wsaz.com), WUPV (12onyourside.com), WVFX (wdtv.com),
    WZBJ (wdbj7.com), WYOW (wsaw.com), WFFT (21alivenews.com), KNDX (kfyrtv.com); no longer Gray''s per
    its infobox: KMSB (Tegna); owned by others (American Spirit Media, Tougaloo College): KVHP, WDBD,
    WXTX, WLOO; CW and secondary stations whose infobox names no news site of their own: KCWO, KDLH, WISE,
    WUAB, KWWT, WSLN, WSYM, WLTZ; infobox not found under the call sign: KEYU, KJTV, KLCW, KNCT, KPDX,
    KSMO, KTTU, KUBD, KXLT, WBKI, WBXX, WPCH, WSFX. No S3 key was probed for any of them; the Wayback
    CDX inventory of s3.amazonaws.com/grayfilestore-* (2023-11-01 to 2026-03-31) holds buckets for WFLX,
    WMBF, WWSB, KYOU, KHNL, KTUU, KTVF and a few others but no closings export for any of them. Before
    Gray''s Arc sites many closings pages held no list of their own (variants gray-frame, gray-gdm-script
    and gray-blox-script): they framed or loaded files on other hosts. A Wayback CDX listing of those
    hosts (archive-captures run 36139673237) holds 123 captures of closings files on gray.ftp.clickability.com
    (2013-01 to 2018-01, 46 in November to March), 263 on lmgcorporate.com/closings (2015-01 to 2021-12,
    150 in November to March) and 24 of wdbj7ftp.us/sch_closings pages (2013-08 to 2016-07); a filtered
    listing of webpubcontent.raycommedia.com closings files (run 36169215699) holds 287 captures, 2017-01
    to 2021-12. The archive reader follows each such page to the capture of the file it framed or loaded
    nearest in time (within six hours) and reads the file with snowlight.sources.stations.gray_files;
    a page whose file the archive did not capture near it stays unread and says so. Heartland Media pages
    (WLFI and WTHI, 2019 to 2021) write their closings file into the page (gray-heartland-*), and three
    Meredith files no downloaded page names (WSHM''s WMNclosings.xml, WSMV-SC4C.xml and WNEM''s schools.xml
    on lmgcorporate.com) are registered as list files of gray-wggb, gray-wsmv and gray-wnem, with the
    evidence in each list file''s seen note. Round 3 (2026-09-26): each station''s page was opened in
    Chromium and its requests recorded (page_check); data_url is the list file the page loads today, export_url
    the station''s own GSync export (the archive reader follows Arc count and lazy pages to it). Most
    pages load their own export; WFSB, WGGB, WLFI, WLIO, WTHI and WAND frame a NewsTicker or BTI file
    on webpubcontent.gray.tv, WJRT frames ftp2.wjrt.com, KAKE''s script loads www.kake.com/app/closings/closings.xml,
    and KSNB, KTRE and KJCT load a sister station''s export (KOLN''s, KLTV''s, KKCO''s). A list file whose
    Last-Modified is older than the start of the last winter is read as stale and not counted as working
    (snowlight.sources.stations.fetch). No_endpoint, with the check in each station''s evidence: KEVN,
    KMOT, KQCD, KUMV, KSPR and KTVK (their sites redirect to a sister station''s), KOLD, KVVU, KCWY and
    KGWN (their pages load no list), WEVV (HTTP 502) and WPGA (its list component fails; its export answers
    403).'
  shared_paths:
  - url: https://webpubcontent.raycommedia.com/raycom/gsync/
    role: 'Raycom''s GSync Web Embeds application, which the former Raycom stations'' closings pages framed
      from late 2019 to 2021 (#/embed/closings/{site}). Its shell and scripts hold no list: the script
      reads the station''s S3 closings export, whose address it builds from the frame''s site (see gray_legacy.gsync_export).'
    seen: Wayback captures of the shell (2019-11-16T21:25:53Z, 2020-11-01T04:00:51Z, 2020-11-09T10:37:49Z,
      2020-12-01T15:11:54Z, 2021-01-27T23:05:43Z) and of static/js/main.0a9438cb.chunk.js (2020-03-11T15:29:48Z),
      main.d97f0280.chunk.js (2020-12-09T17:19:46Z) and main.38810f0e.chunk.js (2021-11-19T17:16:01Z),
      archive-captures run 36169215699; each script's loadRemoteData requests /grayfilestore-{station}/closingsData/closings_{STATION}.json
      from https://s3.amazonaws.com.
