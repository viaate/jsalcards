# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: scripps
  name: E.W. Scripps closings pages
  operator: The E.W. Scripps Company
  adapter: scripps
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: Scripps' Terms of Use (footer link /terms-of-use on every station site; read at https://www.wtvr.com/terms-of-use,
      "Last Modified & Effective April 1, 2015") forbid using "an automatic device (such as a robot or
      spider) or manual process to copy or “scrape” the Services or Service Content for any purpose without
      our express written permission" and provide access for personal, non-commercial use. The project
      owner decided on 2026-09-25 to read the closings lists anyway for this non-commercial project (owner_decision
      below); the terms stay recorded here.
    evidence:
    - url: https://www.wtvr.com/terms-of-use
      read_at: '2026-09-26T22:53:31Z'
      sha256: d07a49c26769d1052ac05dd2282200834722c0081995573c822ea1bf13e50d93
      excerpt:
      - Terms of Use (Last Modified & Effective April 1, 2015)
      - use an automatic device (such as a robot or spider) or manual process to copy or “scrape” the
        Services or Service Content for any purpose without our express written permission.
      - Access to the Services including, without limitation, the Service Content is provided for your
        information and personal, non-commercial use only.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4b, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them. Relayed to the pipeline''s
        builder by the project''s build workflow; to revoke it, remove this block and live polling of
        this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages, the WordPress REST
        routes that publish the same pages, and the list files the pages frame) for Snowlight, a non-commercial
        project, although the terms above forbid automated access. robots.txt is read and its verdict
        recorded for every URL requested (no closings URL registered here was disallowed when checked
        on 2026-09-26); the owner decided on 2026-09-26 to read closings pages and files even where robots.txt
        disallows them. Unchanged by it: the User-Agent names the repository (never a browser string),
        only the closings page or file is requested (no crawling), requests are paced per host (any Crawl-delay
        is a floor) with conditional requests and backoff on 429 and 5xx answers, and a station that blocks
        the project (a 403, or a bot challenge such as the PerimeterX page Nexstar''s HTML pages answer
        with) is not worked around.'
  notes: 'Station list: https://scripps.com/our-brands/local-media/ (68 entries, read 2026-09-26 by the
    first-hand check, docs/research/firsthand/nexstar-tegna-scripps.md): 41 news websites serving 49 full-power
    call signs are registered, one entry per website. Not registered: the ION/The Spot and similar entries
    whose links go to thespottv.com (no local news site), KZCO (courttv.com), KAJA (Spanish-language telemundocc.com),
    KCDO (a section of denver7.com) and KAJ; WRTV, KATC and WFTX are not on the list (other owners now).
    Brightspot sites serve https://www.{site}/weather/school-closings-delays rendered on the server with
    the Scripps closings module (read with the scripps adapter); KPAX serves it at /school-closings-delays
    and KGUN and KTNV at /weather/closings-and-delays (addresses found in the archive''s listings on 2026-09-28).
    WTVQ (WordPress) frames a static SnoWatch file. KKTV, KKCO, KJCT and KMVT are still Gray Arc sites
    whose Gray exports are registered in gray.yaml. KSTU''s /weather/closings page (typed by hand in storms)
    and the Montana (MTN) sites'' /weather/closings pages (nothing on them in every capture read, winters
    2021 to 2026) are filed in scripps-typed.yaml, the only Scripps stations read as typed pages: this
    platform''s adapter never reads one, so a page here without its closings module, list file or list
    frame is an error, not an empty list. KERO''s page frames Kern County''s AlertLine, whose TLS chain
    could not be verified; it has no endpoint here. Each no-endpoint site''s archive check (listings and
    storm-day captures asked for from 2026-09-28, and what they showed) is in its evidence.'
  shared_paths: []
