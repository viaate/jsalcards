# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: radio
  name: Independent radio stations' closings pages (KXXO Olympia, WFRD Hanover)
  operator: KXXO Mixx 96.1 (Olympia, WA); WFRD 99Rock (Dartmouth Broadcasting, Hanover, NH)
  adapter: radio
  poll_minutes: 10
  terms:
    automated_access: permitted
    summary: 'KXXO''s site links no terms of use: its footer (captures of 2020 to 2026) links a sitemap,
      a privacy policy, EEO and FCC files, and the privacy policy (archived 2026-01-23, read 2026-09-27;
      the site does not answer from the build environment) has no clause on robots, crawling, scraping
      or automated access. KXXO''s robots.txt (archived 2025-08-05) disallows only /wp-admin/ and a forms
      folder. WFRD is not polled (it has no list a GET request can read, see its entry); its footer links
      only a privacy statement (archived 2024-08-12), which mentions ''our Terms of Use'' without linking
      them, and its robots.txt reads ''User-agent: * / Disallow: /'' (live, 2026-09-27).'
    evidence:
    - url: https://web.archive.org/web/20260123163554id_/https://www.kxxo.com/privacy-policy/
      read_at: '2026-09-27T23:22:45Z'
      sha256: 688efbb563a603c11effd78bd5380aa1350738e43bfddfbff1be86b424feb768
      excerpt:
      - (KXXO's privacy policy holds no clause on robots, crawling, scraping or automated access; the
        site links no terms of use)
    - url: https://web.archive.org/web/20250805140214id_/https://www.kxxo.com/robots.txt
      read_at: '2026-09-27T23:30:30Z'
      sha256: cf8a16ec6682d3c6def552279b5f37fe2559317a9dcafc7f5d3f2957731006b4
      excerpt:
      - 'User-agent: * Disallow: /wp-admin/ Allow: /wp-admin/admin-ajax.php Disallow: /wp-content/uploads/wpforms/'
    - url: https://web.archive.org/web/20240812075120id_/https://www.wfrd.com/privacy-statement/
      read_at: '2026-09-27T23:25:12Z'
      sha256: 269458677862bb1edee2fb47849f57a8d61d5e3ae3ad98953aebcdd18efcf468
      excerpt:
      - to verify or enforce our Terms of Use or other applicable policies
    permission: null
    owner_decision: null
  notes: Two radio stations the first-hand checks of 2026-09-26 found (docs/research/firsthand/others.json,
    records KXXO Mixx 96.1 school closings and WFRD). Neither site answers from the build environment
    (upstream connection reset or timeout through the egress proxy, 2026-09-26 and 2026-09-27), so both
    were read in the Internet Archive. KXXO's page frames its main list, a copy of FlashAlert Newswire's
    Seattle/Western Washington report written to KXXO's own server (kxxo-sftp/school_closures.html); FlashAlert's
    own copy of the same report is registered by part 3a as flashalert-seattle, so KXXO adds a second
    host for one list, not a second list. WFRD's page is the Entity Closing Lite plugin's Angular app,
    which POSTs to the plugin's list-front.php with a key from the page; no GET form of the list exists,
    and the archive (which keeps GET answers only) holds none.
  shared_paths: []
