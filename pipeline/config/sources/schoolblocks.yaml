# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: schoolblocks
  name: 'SchoolBlocks school district sites: the organization''s alerts in the homepage''s payload'
  operator: SchoolBlocks (the site builder); each site's school district (the content)
  adapter: schoolblocks
  poll_minutes: 30
  terms:
    automated_access: permitted
    summary: 'The district sites are public school districts'' own websites; their footers link only SchoolBlocks''
      privacy policy (read 2026-09-28), which says nothing on reading the sites with software, and every
      site''s robots.txt reads ''Allow: /''.'
    evidence:
    - url: https://www.schoolblocks.com/privacy.html
      read_at: '2026-09-28T10:46:32Z'
      sha256: 7f974fd9701221c01847806e2fcdec7c3dbda3f9e70a630c42aa5b98aa94e1bf
      excerpt:
      - Your privacy is important to us. Learn how SchoolBlocks collects, uses, and protects your personal
        information.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4d while scouting the gap states'' district sites (round 2: Browning in Montana,
    Uinta #1 and Sublette #1 in Wyoming, Salmon and North Gem in Idaho; round 3: Grace in Idaho and Alice,
    Industrial and Skidmore-Tynan in Texas). The homepage is a Next.js page rendered on the server; its
    React Server Components payload (self.__next_f.push) carries the district''s organization record,
    whose alerts list the site''s notification component shows over the page (overlay) or across it (banner).
    Every list read in round 2 was empty, so the adapter waited; on 2026-09-28 Grace School District #148''s
    held one alert, {id, message, type: ''overlay''}: ''Grace School District will be closed from September
    11-October 4 for potato harvest break.'' Because the payload is in the page as served, archived captures
    of the homepage can prove a district. A district-level source: each counts only its own district''s
    schools (leaids). Proof: a district''s general alert channel, so a read proves it only when a row
    announced a closing, a delay, an early dismissal, a remote day, cancelled classes, or weather or an
    emergency for the district (notices.gate_proofs). Round 4 (piece s4d, 2026-09-28): the district sites
    of the Mobile - Pensacola market''s uncovered counties (Mobile, Baldwin, Escambia, Clarke, Washington,
    Conecuh and Monroe in Alabama; Santa Rosa in Florida), found by reading the website the NCES CCD 2024-25
    LEA directory lists for each of their districts: 1 more SchoolBlocks sites there. Round 4, second
    batch (2026-09-28): the district sites of the other gap counties no working list reached (the Glendive,
    Alpena and Zanesville markets, the Mississippi Delta and coast, the Chico - Redding and Palm Springs
    markets and Del Norte), found the same way: 2 more SchoolBlocks sites there.'
  shared_paths: []
