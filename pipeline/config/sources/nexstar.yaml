# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: nexstar
  name: Nexstar Media Group closings lists
  operator: Nexstar Media Inc. and its affiliates (its own stations, the former Tribune, Media General
    and LIN stations, and stations it operates for Mission Broadcasting, White Knight Broadcasting and
    others)
  adapter: nexstar
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: 'Nexstar''s Terms of Use (https://www.nexstar.tv/terms-of-use/, "UPDATED: September 16, 2026";
      station footers link them) cover Nexstar "together with its Affiliates" and forbid using "any robot,
      spider ... or processes on the Properties, for any purpose" and to "Scrape, data-mine or data-crawl
      the Properties"; the Properties are for personal and non-commercial use. The project owner decided
      on 2026-09-25 to read the closings lists anyway for this non-commercial project (owner_decision
      below); the terms stay recorded here. The stations'' HTML pages answer this pipeline''s User-Agent
      with a PerimeterX challenge (HTTP 403), which is never worked around: the same pages are read through
      the WordPress REST API that robots.txt allows.'
    evidence:
    - url: https://www.nexstar.tv/terms-of-use/
      read_at: '2026-09-26T22:53:26Z'
      sha256: 4ec42b00a8dd67aed0e013ca27080a632c92fa31413136801551e492cb2d08a0
      excerpt:
      - 'UPDATED: September 16, 2026'
      - Nexstar Media Inc., together with its Affiliates (collectively, “Company”, “we”, “us”, or “our”),
        offers
      - The Properties are for your personal and non-commercial use only, unless otherwise permitted by
        us.
      - Use any robot, spider, spyware, or any other device, method, or processes on the Properties, for
        any purpose.
      - Scrape, data-mine or data-crawl the Properties or engage in any data gathering or data extraction
        practices for any purpose.
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4b, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them. Relayed to the pipeline''s
        builder by the project''s build workflow; to revoke it, remove this block and live polling of
        this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages, the WordPress REST
        routes that publish the same pages, and the list files the pages frame) for Snowlight, a non-commercial
        project, although the terms above forbid automated access. robots.txt is read and its verdict
        recorded for every URL requested (no closings URL registered here was disallowed when checked
        on 2026-09-26); the owner decided on 2026-09-26 to read closings pages and files even where robots.txt
        disallows them. Unchanged by it: the User-Agent names the repository (never a browser string),
        only the closings page or file is requested (no crawling), requests are paced per host (any Crawl-delay
        is a floor) with conditional requests and backoff on 429 and 5xx answers, and a station that blocks
        the project (a 403, or a bot challenge such as the PerimeterX page Nexstar''s HTML pages answer
        with) is not worked around.'
  notes: 'Station list: the table on https://www.nexstar.tv/stations/ (read 2026-09-26 by the first-hand
    check, docs/research/firsthand/nexstar-tegna-scripps.md): 188 full-power call signs in the 48 states
    and DC on 114 station websites, plus WJMN (upmatters.com), which the table does not list; rows marked
    as TEGNA stations are in tegna.yaml. One registry entry per website; call_sign is the site''s main
    station and name lists every call sign the site serves. Every site runs one WordPress build whose
    HTML pages answer 403 (PerimeterX) to this pipeline; the closings page is read through GET {origin}/wp-json/wp/v2/pages/{id},
    the page id found from pages?slug= on 2026-09-26 (by id, a deleted page is an HTTP error rather than
    an empty array). Every site but WJMN''s (whose TLS handshake fails) also answers GET {origin}/wp-json/nxd_app/v1/closings_alerts
    (the app feed; the same rows as the page at WTNH and WPRI on 2026-09-26), kept as an archive URL.
    Sites whose REST API returns no closings list (no page, a hand-typed page, or an unreachable frame)
    are registered with no endpoint while their app feeds answer [] and no read has shown the station
    posting closings. Where archived captures of the site''s own closings page show rows (KGET, KLBK,
    KMID, KWKT, WANE, WBRE, WDAF, WHBF, WJBF, WLAX, WNCN, WNCT, WRIC, WSAV, WUTR, WVNS, WXIN), the station
    posts closings: the feed is its data_url and that page its page_url, so the archived rows are the
    proof of its list. WGN''s page frames the Emergency Closing Center application (the poller reads its
    JSON), KSN''s frames a PSG static file and KOLR''s a School Closings Network report. The Tribune-era
    frames (cdn.trb.tv, s3 wjwclosings) and the stations'' older pages are archive URLs only. The stations
    that type their closings by hand into a WordPress page (WHNT, WDHN and WRBL, whose archived pages
    show typed closings on storm days) and WNTZ (whose closings address was archived as a typed article)
    are filed in nexstar-typed.yaml, the only Nexstar stations read that way: this platform''s adapter
    never reads a typed page, so a page here without its closings article, frame, feed or list file is
    an error, not an empty list. A page whose content holds entries typed beside its closings article
    (list items or table rows, or paragraph entries with no link in them) is an error for the stations
    filed here, never an empty list: the stations seen doing that (KIAH, WIVB) are filed in nexstar-typed.yaml.'
  shared_paths: []
