# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: blox
  name: TownNews BLOX sites' closings (station pages and the closings application's files)
  operator: 'Several owners on TownNews BLOX: Morgan Murphy Media (KOAM, KXLY), WRCB, Draper Media (Coast
    TV), Rincon (WRSP, WICS, KHQA; Sinclair partner stations)'
  adapter: blox
  poll_minutes: 10
  terms:
    automated_access: forbidden
    summary: Each site has its own BLOX terms page. Coast TV's (https://www.coasttv.com/site/terms.html,
      read 2026-09-27) prohibits manipulating the service 'by any means, including but not limited to
      the use of bots, botnets, automated scripts or other automated or electronic means'; the Rincon
      sites' (WRSP foxillinois.com, WICS newschannel20.com, KHQA khqa.com; Sinclair's template) prohibit
      accessing the service 'with any mining, scraping, data extraction or other tools'. KOAM's terms
      answered HTTP 429 (TownNews throttling) and KXLY's and WRCB's were not found. The project owner
      decided on 2026-09-25 to read the closings lists anyway for this non-commercial project (owner_decision
      below); the terms stay recorded here. TownNews answers bursts with HTTP 429; the poller paces each
      host and backs off, and never retries around a refusal.
    evidence:
    - url: https://www.coasttv.com/site/terms.html
      read_at: '2026-09-27T06:25:41Z'
      sha256: cf772c96bb280b34c38752cb0f178b96b8abdce3450e11055b6653940348bfa0
      excerpt:
      - Prohibited Uses You will not manipulate the Service by any means, including but not limited to
        the use of bots, botnets, automated scripts or other automated or electronic means.
    - url: https://www.foxillinois.com/site/terms.html
      read_at: '2026-09-27T06:25:46Z'
      sha256: 74d3b2ec8bd1be8bbf50b561d2009b815bc8a11e640f52c3d86657d3054fd163
      excerpt:
      - Access the Service with any mining, scraping, data extraction or other tools;
      - You may only use the material and the services available through this Service for your personal
        and non-commercial use.
    - url: https://www.newschannel20.com/site/terms.html
      read_at: '2026-09-27T06:41:58Z'
      sha256: 569e25c11c12dcb031f65b4b96a06a304fdd78b74eafd29e7abc0df7e06edd67
      excerpt:
      - Access the Service with any mining, scraping, data extraction or other tools;
    - url: https://www.khqa.com/site/terms.html
      read_at: '2026-09-27T06:42:03Z'
      sha256: c78e56fcb0a30d723f27f936ae4e26c6417fc4bc52ba561387b3ab0ded8d7ff0
      excerpt:
      - Access the Service with any mining, scraping, data extraction or other tools;
    permission: null
    owner_decision:
      decided_by: the project owner (Snowlight)
      decided_on: '2026-09-25'
      reference: 'Stated in the build instructions for the station adapters (piece s4c2, round 1): "Terms
        of use that forbid automated access do not exclude a station: the project owner decided on 2026-09-25
        to read them for this non-commercial project, so record each station''s terms internally in the
        registry and read it anyway." The same instructions record the owner''s decision of 2026-09-26
        to read closings pages and data files even where robots.txt disallows them (naming Sinclair''s
        /resources/ftptransfer/ files, Allen''s ftp2 files and WVEIS as examples). Relayed to the pipeline''s
        builder by the project''s build workflow; to revoke it, remove this block and live polling of
        this platform stops.'
      scope: 'Live reads of this platform''s public closings lists (the station pages and the list files
        they frame or load) for Snowlight, a non-commercial project, although the terms above forbid automated
        access. robots.txt is read and its verdict recorded for every URL requested; the owner decided
        on 2026-09-26 to read closings pages and files even where robots.txt disallows them. Unchanged
        by it: the User-Agent names the repository (never a browser string), only the closings page or
        file is requested (no crawling), requests are paced per host (any Crawl-delay is a floor) with
        conditional requests and backoff on 429 and 5xx answers, and a station that blocks the project
        (a 403, or a bot challenge) is not worked around.'
  notes: 'Stations on TownNews BLOX sites whose closings the first-hand check of 2026-09-26 found: KOAM
    and KXLY load a closings XML file by script, WRCB frames the closings application''s HTML export,
    Coast TV writes each closing as an article card, and the Rincon/Sinclair partner stations WRSP, WICS
    and KHQA write rows into hidden weather-closings tables. The live poller reads the list file where
    the page names one, else the page.'
  shared_paths: []
