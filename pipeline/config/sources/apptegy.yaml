# Station registry for one platform. Loaded with every other file in this folder
# by snowlight.sources.stations.registry; see its docstring for the fields.
# `snowlight stations robots --update` rewrites the robots blocks in place.
platform:
  id: apptegy
  name: 'Apptegy (Thrillshare CMS) school district sites: the homepage alert banner'
  operator: Apptegy, Inc. (the CMS); each site's school district (the content)
  adapter: apptegy
  poll_minutes: 30
  terms:
    automated_access: permitted
    summary: 'The district sites are public school districts'' own websites; they publish no website terms
      of use (their footers link student-privacy pages such as FERPA notices, read 2026-09-27) and nothing
      against reading them with software, and every site''s robots.txt reads ''Allow: /''. Apptegy''s
      corporate site (apptegy.com) answered a bot challenge (''Client Challenge'') to the project''s User-Agent
      on 2026-09-27, so Apptegy''s own terms could not be read; the challenge was not worked around.'
    evidence:
    - url: https://www.hillsboroughschools.org/page/family-educational-protection-rights-ferpa
      read_at: '2026-09-27T15:29:38Z'
      sha256: 2f4ccd844b3c41e120a289d46b8c1bc4cea5238fb3070b266d023ae37cf8c4a4
      excerpt:
      - The Family Educational Rights and Privacy Act (FERPA) is a Federal law that protects the privacy
        of student education records, such as report cards, transcripts, disciplinary records and class
        schedules.
    permission: null
    owner_decision: null
  notes: 'Found for piece s4d on 2026-09-27 while scouting Florida''s county school districts (16 of the
    33 largest are Apptegy sites) and the largest districts of the Idaho Falls-Pocatello, Twin Falls and
    Casper-Riverton markets (25 sites in all). Each district announces closures, delays and early dismissals
    in its homepage alert banner; the page is rendered on the server with the site''s state (a Nuxt 3
    __NUXT_DATA__ payload), so the banner is in the page as served and in its archived captures. The state
    also keeps banners no longer shown (drafts, archived): on 2026-09-27 Martin County''s held ''HURRICANE
    MILTON UPDATE: All MCSD-operated schools and offices will be closed Wednesday, O[ctober 9]'', Nassau''s
    ''School is closed due to Ice!'', Sarasota''s ''MONDAY, AUGUST 5 - SCHOOLS & DISTRICT OFFICES CLOSED
    Due to ongoing weather c[onditions]'' (Debby, 2024) and Walton''s closure ''Based on information from
    the National Weather Service'', which the adapter never reads as rows (they are not shown) but which
    show the districts use the banner for weather closures. A district-level source: each counts only
    its own district''s schools (leaids). A second search the same day (the website the NCES CCD 2024-25
    LEA directory lists for each unbuilt district of Montana''s and Wyoming''s gap counties, and a search
    for Idaho''s, whose LEA records list none) found 52 more Apptegy districts: 41 in Montana (Corvallis,
    Hamilton, Hardin, Centerville, Frenchtown, St. Ignatius and 35 smaller ones), 10 in Wyoming (Converse
    #1, Park #1 and #6, Sweetwater #2, Washakie #1, Big Horn #1, Fremont #1, #6, #14 and #24) and Marsh
    Valley (ID); and, reading the same directory for Florida''s remaining county districts, eight more
    there (Wakulla, Madison, Okeechobee, Suwannee, Hardee, Glades, Gilchrist, Highlands), and West Jefferson
    #253 (ID), found by a search; 86 sites in all. Proof (piece s4d, 2026-09-28): a district''s general
    alert channel, so a read proves it only when a row announced a closing, a delay, an early dismissal,
    a remote day, cancelled classes, or weather or an emergency for the district; hiring, board, election,
    enrollment and calendar notices do not (notices.gate_proofs, reported in coverage.json''s district_notice_gate).
    Round 3 (piece s4d, 2026-09-28): the district sites of South Texas'' uncovered counties (Hidalgo,
    Nueces, Cameron, Victoria, Webb, El Paso, San Patricio and the smaller ones around them), found by
    reading the website the NCES CCD 2024-25 LEA directory lists for each of their districts: 33 more
    Apptegy sites there. Round 4 (piece s4d, 2026-09-28): the district sites of the Mobile - Pensacola
    market''s uncovered counties (Mobile, Baldwin, Escambia, Clarke, Washington, Conecuh and Monroe in
    Alabama; Santa Rosa in Florida), found by reading the website the NCES CCD 2024-25 LEA directory lists
    for each of their districts: 5 more Apptegy sites there. Round 4, second batch (2026-09-28): the district
    sites of the other gap counties no working list reached (the Glendive, Alpena and Zanesville markets,
    the Mississippi Delta and coast, the Chico - Redding and Palm Springs markets and Del Norte), found
    the same way: 10 more Apptegy sites there.'
  shared_paths: []
