# Places build (city and ZIP search records): which Census and NCES releases a deploy
# reads, and the SHA-256 of every file they imply. Read by snowlight.places.pins.
# Deploys read these files from the data mirror (a release of this repository,
# seeded by .github/workflows/data-mirror.yml), never from census.gov or nces.ed.gov;
# a local `snowlight places build` without --mirror still finds the newest releases.
# To move to a newer release, change it here with the new files' checksums: the
# mirror seeds a new release on push, and the next deploy reads it
# (docs/deployed-edition.md, "Bumping a pinned source file").

