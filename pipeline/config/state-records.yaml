# Public state records of past school days (each-school P2d; docs/predict.md, "Past records";
# snowlight/predict/state_records.py). Read by `snowlight predict each-school past`
# (.github/workflows/each-school-record.yml), which fetches each file by plain GET from its URL,
# refuses any file whose size or SHA-256 is not the one pinned here (a changed file needs a
# reviewed pin and parser check), and writes its rows once into the evidence store's record
# kind. Nothing that learns or serves reads them. The record keeps ids, codes, counts and dates
# only: every URL and every name stays here.
#
# Field names here never contain the two words the schema guard refuses (LR8).
version: 1
states:
  ky:
    state: ky
    complete: >-
      Dated weather days (W) are the days a district missed for the weather and made up; a
      weather day not made up is removed from the amended calendar, and at-home NTI days (N)
      are not dated, so a day not listed is not known open: the dated rows are closings only
      and never complete. W may also carry a non-weather emergency (Jefferson County lists
      11/05/25, written in not_weather below). Yearly W counts are complete for made-up weather
      days; NTI counts (2024-25 and
      2025-26 only) are not split by cause. No delays.
