  # Missouri (records-mo, edition 1): the school calendar file Missouri's education department
  # sent in answer to a records request (received 2026-11-19). It has no URL: it is pinned by size
  # and SHA-256, read only from --files (never fetched, never stored or committed). The CCD 2024-25
  # school directory (the pin of config/directory.yaml) is read beside it for the id rule and each
  # LEA's deciding schools. Unlike New York, it writes no record keys: it gives two derived files,
  # committed under pipeline/data/records/mo/ (lead ruling LR-6), each pinned by the SHA-256 and
  # row count of its uncompressed bytes (snowlight/predict/state_records_mo.py; `snowlight predict
  # each-school past --state mo --files <folder> --derive <folder>` rebuilds them).
  mo:
    state: mo
    id_digits: 6
    dated_public: true
    complete: >-
      The file lists every school day each public district and charter lost to the weather
      (closed, or a short day), every day of school at home (AMI) and every make-up day, dated,
      for the school years 2016-17, 2017-18, 2018-19, 2024-25 and 2025-26, and yearly hours per
      building for 2019-20 to 2023-24 (no dates). A school day with an alert that is not on the
      list counts as open by the open-day rule. The state's codes for school not in session for
      other weather or emergency causes (12 and 13) are not in the file, so a weather closing
      filed under them would read as open; the state was asked on 2026-11-21. No delays.
    provenance: >-
      Missouri Department of Elementary and Secondary Education, public records response of
      2026-11-19 (the received file mo-dese-calendar-2026-11-18, SHA-256
      b3de98302114e5e3e9112651c08bb78c829138da7f0c36b2d24cdac7a571f83e). The derived files hold LEA ids, dates and
      letters only: no student, no staff member, no name, no building code and no hours by day.
    files:
      - id: mo-dese-calendar-2026-11-18
        form: mo_calendar
        received: mo-dese-calendar
        fetched: 2026-11-19
        bytes: 3712014
        sha256: b3de98302114e5e3e9112651c08bb78c829138da7f0c36b2d24cdac7a571f83e
        years: ["2016-17", "2017-18", "2018-19", "2019-20", "2020-21", "2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]
        parser: 1
        edition: 1
      - id: mo-ccd-sch-2024-25
        form: ccd_schools
        url: https://nces.ed.gov/ccd/Data/zip/ccd_sch_029_2425_w_1a_073025.zip
        fetched: 2025-10-24
        bytes: 13352819
        sha256: 39326da788aa322353d20ceaf8ad4baed26272502cd05b066cf6c594988b21ab
        years: ["2024-25"]
        parser: 1
        edition: 1
    # The open-day rule (snowlight/predict/open_days.py, rule 3: spec RECORDS-MO r2 section 3
    # with lead ruling LR-1's break edges and isolation guard).
    open_days:
      rule: 3
      complete_years: ["2016-17", "2017-18", "2018-19", "2024-25", "2025-26"]
      winter_late_from: 15
      winter_early_until: 12
      spring_from: [3, 1]
      spring_until: [4, 20]
      four_day_lost_days: 6
      isolation_share: 0.8
      isolation_peers: 3
      crowd_share: 0.95
      crowd_peers: 10
    # The districts' complete records (snowlight/predict/habit_record.py): built with
    # --derive <folder> --record-from <labels folder> from the day file, the labels run's class
    # history (weather.parquet and weather-charter.parquet) and the newest zone-county release.
    full_record:
      name: mo-record-ed1.csv
      rows: 1522
      sha256: 2cb6a5f84faa2070da4fae2c504dbd8206ef39d3ac52b4880f644213f2aa3f2c
    derived:
      - name: mo-days-ed1.csv
        rows: 26265
        sha256: 415e2b1b657b6f73c8f5e60b6dce467f7e8d9f4912a84b237d95ae338ea85519
      - name: mo-counts-ed1.csv
        rows: 2784
        sha256: 5dc75d84e3c65abc9055b2d3296e18cc58dc2afae944aa079b682e5e9052f72f
    codes:
      W:
        name: Actual Weather Day
        dated: true
        counted: true
        call: closed
        cause: weather
        weather_day: true
        day_off: weather
      M:
        name: Actual Weather Make-up Day
