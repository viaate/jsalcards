    # The review of the days the state lists under its weather code (W), done on 2026-11-14
    # against the district's own notices and local news. It checked three windows of the dated
    # years: every W day outside December to mid-March; every W date held by three districts or
    # fewer; and every W day from 2025-02-03 to 2025-02-14, the week a wave of flu and other
    # illness closed many districts. W days held by four districts or more inside December to
    # mid-March (the big storms) were not checked one by one.
    # - not_weather: a closing for another cause. The row keeps the code W but has cause named
    #   and is never a weather day (LR12).
    # - unconfirmed: a checked day the review could not tie to the weather for that district
    #   (no notice or report found that ties it to the weather). The row keeps the code W with
    #   cause any and is never a weather day; a later review that ties it to the weather moves
    #   it out in a new edition.
    # Each year's W count stays the state's number and says how many of its days each list
    # names. The other checked days were tied to the weather: the Helene windstorm of
    # 2024-09-27 and its power cuts to 2024-10-02; the first snow of 2024-11-22; the high water
    # of 2025-02-06 in the northeast (Boyd, Greenup, Carter, Lawrence, Elliott) and Lawrence's
    # flood damage of 2025-02-07; the snow of 2025-02-11 and 12; the February 2025 flood and
    # Pike County's closing after it to 2025-03-05; the April 2025 floods (McLean to 2025-04-18);
    # the snow of 2025-11-10 and 11 and of 2026-03-17. One listed day may be the state's own
    # year slip: Jackson County's 2026-01-23 (W) is the only W that day, and the district's
    # 2024-25 row lists 2025-01-23 and 01-24, a snow it posted then. The row stays as the state
    # lists it, in the unconfirmed list below. Letcher County's 2026-02-12 and 13 (closed with no
    # water after line breaks drained the town's tanks) are unconfirmed, not another cause:
    # reports tie the breaks to the freeze and thaw.
