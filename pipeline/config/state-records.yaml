  # New York (records-ny, edition 1): the Schedule A-8 exports of claim years 2011-12 to 2026-27,
  # sent by the state education department on request. They have no URL: each is pinned by size
  # and SHA-256, read only from --files (never fetched), and never stored or committed; only these
  # pins and the keys built from them leave the records folder. Each file holds the school year
  # before its claim year. The pick-list phrases in codes[*].match are the form's own words (public
  # in its directions), never a district row.
  ny:
    state: ny
    id_digits: 6
    dated_public: false
    complete: >-
      By the state's directions a district files Schedule A-8 only when its schools fell short
      of the 180 days the state requires because of an extraordinary condition (bad weather is
      one) or a declared emergency. Its dated days are the emergency closing days the district
      reported to the state: closings only and never complete (a day not listed is not known
      open, whether a filer lists every closing of its year is not measured, and a district
      that never filed is not known to have held out). Only WX is a weather day; a declared
      emergency (SOE) names no cause. No delays.
    files:
      - id: ny-a8-2011-12
        form: ny_a8
        received: nysed-records-request-2026-11
        fetched: 2026-11-18
