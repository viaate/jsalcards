    id_rule: >-
      The form's six-digit code is the first six digits of the 12-digit BEDS code that NCES
      writes as NY-<BEDS> in ST_LEAID; a district's BEDS code ends 0000 and its digits 7-8 are
      not 86 (a charter school). Read from the CCD 2024-25 school directory
      (https://nces.ed.gov/ccd/Data/zip/ccd_sch_029_2425_w_1a_073025.zip, SHA-256
      39326da788aa322353d20ceaf8ad4baed26272502cd05b066cf6c594988b21ab, the pin of
      config/directory.yaml): 756 codes pass the rule, none with two LEAIDs. 686 of the files'
      701 codes map; codes are never matched by name. one_school lists the 102 mapped LEAIDs
      that directory gives at most one open school (Open, New, Added, Changed Agency or
      Reopened): a building cell of one of them never says part of the district, so it reads
      unknown, never share (the directory is one year's, so never whole either).
