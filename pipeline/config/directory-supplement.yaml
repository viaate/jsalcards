# Real schools the NCES files miss, merged into the directory by
# snowlight/directory/supplement.py. Reviewed by hand; every entry needs:
#
# - id: SN and six digits, never reused or renumbered: a new entry takes the
#   number after last_id, which then becomes its id. An entry deleted from this
#   file has its id listed under retired_ids, never to be issued again; the
#   build refuses a number up to last_id that is neither an entry nor retired.
#   Edit entries here in place: this file is the record.
# - name, street, city, state, zip: as the school or its diocese lists them now.
# - address_from, address_url, address_checked_on: where the street address was
#   matched, and when: the school's own site (school-site) or the school list of
#   its diocese or church body (diocese-list) at address_url, or a closings row
#   that gives the street address (closings-row, on evidence_seen_on). An earlier
#   PSS file never vouches for an address: a school can move over a summer. An
#   address not matched since August 1 of the build's school year is dropped as
#   address_stale until it is matched again and its date updated.
# - county_fips, county_name, lat, lon, geocoded_address: from the Census Bureau
#   geocoder for that street address (geographies/onelineaddress, benchmark
#   Public_AR_Current, vintage Current_Current), coordinates at six decimals.
#   A school the geocoder cannot match exactly is not added: no location is guessed.
#   One exception, which no entry uses now: geocoder: nces-pss takes NCES's own
#   point for the same street address in the entry's earlier PSS row, only once a
#   reviewer has matched that point against the school's own map or address page,
#   recorded in location_url and location_checked_on. A point the reviewer cannot
#   match retires the entry.
# - grade_low, grade_high: PK, TK, KG, T1 or 01 to 12, as the school's current
#   pages give them. A school whose highest grade is kindergarten needs its grades
#   from a current source (diocese-list or school-site): a preschool that had a
#   kindergarten class in an earlier survey may have dropped it. An entry with an
#   nces_ppin records that PSS row's grades in pss_grade_low and pss_grade_high;
#   grades that differ from them need grades_url, the school's own current page
#   that gives them (a diocese list can be out of date), or, where its own site
#   does not answer or gives only part of them, the current page that does, with a
#   comment saying so. The load refuses such an entry without grades_url. An entry whose grades equal its PSS row's and that has no
#   grades_url keeps them because no current page of its own gives other grades.
# - source: where the school and its grades come from (pss-2021-22, pss-2019-20,
#   diocese-list, school-site, closings-list); nces_ppin for pss-* sources.
# - evidence: evidence_url (a current page listing the school as operating), or
#   evidence_station and evidence_seen_on (a closings list that named it in the
#   school year of checked_on or the one before), or both.
# - checked_on: the date the entry was last checked. Its evidence ages from
#   checked_on when it has an evidence_url, else from evidence_seen_on: evidence
#   from before last school year, or older than max_evidence_age_days
#   (config/directory.yaml), is dropped as evidence_stale until checked again.
# - distinct_from: NCES ids of nearby schools a reviewer checked are other
#   schools. The build stops on any kept NCES private school within 300 m, public
#   school within 150 m, or private school at the same street address that is not
#   listed here; and on an entry whose only evidence is a closings row when an
#   NCES school in another state has its name and town.
#
# An entry the NCES files list again (its nces_ppin, or the same name within
# 1 km) is dropped by the build as listed_by_nces and may then be retired here.
#
# Every entry's address is checked again each school year before August 1, and
# its evidence before it is a year old: the build report, and Preview's log as
# warnings, list the entries whose evidence or address goes stale within 60 days.
