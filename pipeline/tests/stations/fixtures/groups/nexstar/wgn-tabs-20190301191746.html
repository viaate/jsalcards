<script type="text/javascript">
    $(document).ready(function () {
        $( "#school_list" ).load( "wgn_schools.html", function() {
            $('#schools').listnav({
                showCounts: true
            });
        });
		 $( "#dc_list" ).load( "wgn_dc.html", function() {

	                showCounts: false
	            });
	     });
        $( "#church_list" ).load( "wgn_church.html", function() {
            $('#church').listnav({
                showCounts: false
            });
        });
        $( "#other_list" ).load( "wgn_other.html", function() {
            $('#other').listnav({
                showCounts: false
            });
        });
        $('#horizontalTab').responsiveTabs({
            rotate: false,
            startCollapsed: 'accordion',
            collapsible: 'accordion',
            setHash: true,
            activate: function(e, tab) {
                $("html, body").animate({ scrollTop: 0 }, "slow");
            }
        });
        $("#nano").html(getnow());
        setInterval(function() {
            refresh();
        }, 60000);

    });

    function refresh() {
        $( "#school_list" ).load( "wgn_schools.html", function() {
            $("#schools-nav").html("");
            $('#schools').listnav({
                showCounts: false
            });
        });
		$( "#dc_list" ).load( "wgn_dc.html", function() {
	            $("#dc-nav").html("");
				$('#dc').listnav({
	                showCounts: false
	            });
	     });
        $( "#church_list" ).load( "wgn_church.html", function() {
            $("#church-nav").html("");
            $('#church').listnav({
                showCounts: false
            });
        });
        $( "#other_list" ).load( "wgn_other.html", function() {
            $("#other-nav").html("");
            $('#other').listnav({
                showCounts: false
            });
        });
        $("#nano").html(getnow());

    }

    function getnow() {

        var nano = "";

        var currentTime = new Date()
        var hours = currentTime.getHours()
        var hours2 = hours
        if(hours > 12){
            hours2 = hours - 12;
        }
        var minutes = currentTime.getMinutes()
        if (minutes < 10){
            minutes = "0" + minutes
        }
        var month = currentTime.getMonth() + 1
        var day = currentTime.getDate()
        var year = currentTime.getFullYear()
        nano = month + "/" + day + "/" + year + " at ";
        nano += hours2 + ":" + minutes + " ";
        if(hours > 11){
            nano += "PM";
        } else {
            nano += "AM";
        }

        return nano;

    }



</script>
