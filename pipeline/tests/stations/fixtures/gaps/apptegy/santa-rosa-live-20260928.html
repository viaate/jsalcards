p>Transportation Needs - Submit a Transportation 411 request \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://app.smartsheet.com/b/form/82bba21b14ad45c6a295242ba6cf7793\">HERE\u003C/a>.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Rooms Resources  for Families - Click \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.santarosaschools.org/page/communication2526\">HERE\u003C/a>\u003C/p>\u003C/li>\u003Cli>\u003Cp>Rooms Needs - Submit a Rooms Communication Request \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://forms.office.com/r/qdX03MYHq1\">HERE\u003C/a>.\u003C/p>\u003Cp style=\"text-align: center\">\u003C/p>\u003C/li>\u003C/ul>",{"url":79,"alt_text":79},"banner","all_pages",{"id":2790,"secondary_organization_id":22,"secondary_organization_ids":2791,"content":2792,"image":2793,"status":6,"style":2794,"display_location":2788,"featured":12},24547,[22],"\u003Cp>\u003Cstrong>Welcome to our NEW website!\u003C/strong>\u003C/p>\u003Cp>\u003C/p>\u003Cp>We're excited to share our fresh new look with our families and community. As we continue to make updates and improvements, you may notice a few areas still under construction. Thank you for your patience as we work to enhance your experience! School site pages are maintained by school webmasters. The district page is maintained by the Public Information Office. If you have questions or a need, please email \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"mailto:PIO@santarosa.k12.fl.us\">PIO@santarosa.k12.fl.us\u003C/a>.\u003C/p>",{"url":79,"alt_text":79},"light_box",{"id":2796,"secondary_organization_id":22,"secondary_organization_ids":2797,"content":2798,"image":2799,"status":6,"style":2794,"display_location":1638,"featured":12},25025,[22,110,140,182,188,200,206,218,242,284,296],"\u003Ch2 style=\"text-align: center\">Class of 2025 Graduation \u003C/h2>\u003Cp style=\"text-align: center\">\u003Cem>Can't attend in person? \u003C/em>You can easily view our live stream of the ceremony!\u003C/p>\u003Cp style=\"text-align: center\"> \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.santarosaschools.org/page/graduation-2025\">Click HERE for Graduation 2025 Live Stream\u003C/a>\u003C/p>",{"url":79,"alt_text":79},{"id":2801,"secondary_organization_id":22,"secondary_organization_ids":2802,"content":2803,"image":2804,"status":6,"style":2794,"display_location":2788,"featured":12},26984,[22],"\u003Cp>\u003Cspan>‼️IMPORTANT NOTICE ‼️\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Due to an Internet outage, school sites and district offices will be closed to guests/visitors or families registering on Friday, July 18. \u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>If your child is in a summer program at the school, this will still occur unless the administrator at the school provides notice that an event is cancelled. \u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>PLEASE NOTE - Schools may experience limited access to phones during this time. \u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>We sincerely apologize for this inconvenience. We anticipate schools to reopen and resume normal operations on Monday, July 21. Thank you!\u003C/span>\u003C/p>",{"url":2805,"alt_text":2806,"asset_id":2807},"https://cmsv2-assets.apptegy.net/uploads/26160/file/4911473/d85d6854-9ffb-40f1-9402-b733977134ae.jpeg","Important",4911473,{"id":2809,"secondary_organization_id":22,"secondary_organization_ids":2810,"content":2811,"image":2812,"status":6,"style":2794,"display_location":1638,"featured":12},28764,[22],"\u003Cp>Santa Rosa County District Schools (SRCDS) and Santa Rosa Professional Educators (SRPE) will conduct Negotiations on Wednesday, September 17 at 4:30pm at the Douglas A. Dillon Administrative Complex in Room 704.\u003C/p>\u003Cp>\u003C/p>\u003Cp>Santa Rosa County District Schools (SRCDS) and Santa Rosa Education Association (SREA) will conduct Negotiations on Tuesday, September 23 at 4:00pm at the Douglas A. Dillon Administrative Complex in Room 707.\u003C/p>",{"url":79,"alt_text":79},{"id":2814,"secondary_organization_id":22,"secondary_organization_ids":2815,"content":2816,"image":2817,"status":6,"style":2787,"display_location":1638,"featured":12},29165,[22],"\u003Cblockquote style=\"padding-left: 24px; border-left: 1px solid rgba(0, 0, 0, 0.1); font-style: italic;\" class=\"blockquote\">\u003Cp style=\"text-align: center\">\u003Cstrong>SAFETY STARTS WITH US! \u003C/strong>October is National Internet Safety Month. \u003C/p>\u003Cp style=\"text-align: center\">Click \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.santarosaschools.org/o/srcds/page/safety-starts-with-us\">HERE\u003C/a> to learn more as we share information with our schools, families, and community on how to keep our students safe.\u003C/p>\u003C/blockquote>",{"url":79,"alt_text":79},{"id":2819,"secondary_organization_id":22,"secondary_organization_ids":2820,"content":2821,"image":2822,"status":6,"style":2787,"display_location":1638,"featured":12},29862,[22],"\u003Ch2 style=\"text-align: center\">⚠️Important \u003Cstrong>Reminder \u003C/strong>⚠️\u003C/h2>\u003Cp style=\"text-align: center\">Federal Impact Aid Survey Forms are due back to your child’s school no later than Wednesday, November 12.&nbsp;\u003C/p>\u003Cp style=\"text-align: center\">\u003Cstrong>Note: \u003C/strong>Please complete all sections&nbsp;of the form, including your child’s name, address, date of birth, and grade. This information helps us identify federally connected students so our district can qualify for federal funding. All information is kept confidential, and these funds are critical to supporting our students. \u003C/p>\u003Cp style=\"text-align: center\">\u003Cem>Thank you for your prompt attention and for supporting Santa Rosa County District Schools.\u003C/em>\u003C/p>",{"url":79,"alt_text":79},{"id":2824,"secondary_organization_id":22,"secondary_organization_ids":2825,"content":2826,"image":2827,"status":6,"style":2787,"display_location":1638,"featured":12},31816,[22],"\u003Ch2 style=\"text-align: center\">\u003Cstrong>\u003Cem>Notice:\u003C/em>\u003C/strong>\u003C/h2>\u003Cp style=\"text-align: center\">Negotiations between Santa Rosa County District Schools (SRCDS) and Santa Rosa Professional Educators (SRPE) will be held on Thursday, December 11, 2025 at 4:30pm.\u003C/p>\u003Cp style=\"text-align: center\">This will be held in Room 704 at the Dillon Administrative Complex located at 6032 Highway 90 Milton, Florida 32570.\u003C/p>",{"url":79,"alt_text":79},{"id":2829,"secondary_organization_id":22,"secondary_organization_ids":2830,"content":2832,"image":2833,"status":6,"style":2787,"display_location":1638,"featured":12},32334,[22,140,2831,206],28105,"\u003Cp>\u003Cstrong>Soundside High School Proposed Zones: NOW AVAILABLE!\u003C/strong>\u003Cbr>\u003Cbr>The proposed zones were shared at the December 11, 2025 school board meeting. You can find the public hearing notice, zoning scenario information, and the three proposed zones on our website created specifically for SHS zoning at the link below. \u003Cbr>\u003Cbr>You can view our SHS Proposed Zones website here: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.santarosaschools.org/o/shs/page/proposed-zoning-information\">https://www.santarosaschools.org/o/shs/page/proposed-zoning-information\u003C/a>\u003Cbr>\u003Cbr>You can view the December 11, 2025 board meeting here: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://santarosacosdfl.portal.civicclerk.com/event/55/media\">https://santarosacosdfl.portal.civicclerk.com/event/55/media\u003C/a>\u003Cbr>\u003Cbr>Public Notice: A public hearing will be held on January 15th at 5:30 p.m. at the Santa Rosa County School Board Room, 5086 Canal Street in Milton to formally adopt the new attendance zones. The following schools will be affected: Navarre High School and Gulf Breeze High School. Copies of specific maps of the zones that would be implemented, if the proposed boundary revisions are approved, will be made available for study and examination at the Office of the Superintendent of Schools, Dr. Karen Barber, at 6032 Highway 90, Milton, Florida 32570, Monday through Friday, December 12, 2025 through January 15, 2026 from 8:00 a.m. to 3:30 p.m. In addition, during this same time frame, the proposed boundary revisions will be made available for review on the District’s website.\u003C/p>\u003Cp>\u003Cstrong>SRPE Recertification Election Notice - \u003C/strong>Click \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://aptg.co/YKXgFS\" relative-link=\"\">HERE\u003C/a> to view.\u003C/p>",{"url":79,"alt_text":79},{"id":2835,"secondary_organization_id":22,"secondary_organization_ids":2836,"content":2837,"image":2838,"status":6,"style":2787,"display_location":1638,"featured":12},35773,[22],"\u003Cp>\u003Cspan>Negotiations between SRCDS and SRPE will take place Friday, January 30, 2026, from 1:00- 3:00 p.m., at the Douglas A. Dillon Center located at 6032 Hwy. 90, Milton, Florida 32570.\u003C/span>\u003C/p>",{"url":79,"alt_text":79},{"id":2840,"secondary_organization_id":22,"secondary_organization_ids":2841,"content":2842,"image":2843,"status":6,"style":2787,"display_location":1638,"featured":12},37588,[22],"\u003Cp>Santa Rosa Professional Educators (SRPE) and Santa Rosa County District Schools (SRCDS) will hold the next session of negotiations on Thursday, February 12 at 4:15pm at the Douglas A. Dillon Administrative Complex (6032 Hwy 90 Milton, Florida).\u003C/p>",{"url":79,"alt_text":79},{"id":2845,"secondary_organization_id":22,"secondary_organization_ids":2846,"content":2847,"image":2848,"status":6,"style":2787,"display_location":1638,"featured":12},40860,[22],"\u003Cp>We apologize for the technical difficulties experienced during tonight’s Impasse Hearing. While we work to resolve the issue and upload the video to our website, please view the full recording here: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://youtu.be/_320wtOZKgw\">https://youtu.be/_320wtOZKgw\u003C/a>\u003C/p>\u003Cp>Thank you for your patience and understanding.\u003C/p>",{"url":79,"alt_text":79},{"id":2850,"secondary_organization_id":22,"secondary_organization_ids":2851,"content":2852,"image":2853,"status":6,"style":2787,"display_location":1638,"featured":12},39644,[22],"\u003Cp style=\"text-align: center\">Notice: Negotiations between Santa Rosa County District Schools (SRCDS) and Santa Rosa Professional Educators (SRPE) will be held on Thursday, March 12,  2026 at 4:15 pm.\u003C/p>\u003Cp style=\"text-align: center\">This will be held in Room 704 at the Dillon Administrative Complex located at 6032 Highway 90 Milton, Florida 32570.\u003C/p>",{"url":79,"alt_text":79},{"id":2855,"secondary_organization_id":22,"secondary_organization_ids":2856,"content":2857,"image":2858,"status":6,"style":2787,"display_location":1638,"featured":12},40045,[22],"\u003Cp style=\"text-align: center\">Notice: Santa Rosa Education Association negotiations on March 25th, 4 p.m., at the Dillon Center HR Conference Room.\u003C/p>",{"url":79,"alt_text":79},{"id":2860,"secondary_organization_id":22,"secondary_organization_ids":2861,"content":2862,"image":2863,"status":6,"style":2787,"display_location":1638,"featured":12},41958,[22],"\u003Cp>We apologize for the technical difficulties experienced during the Impasse Hearing on April 22nd. The full video recording can now be found on our website, under School Board - Agendas, Minutes, and Live Feed. Thank you again for your patience and understanding.\u003C/p>\u003Cp>ITS Team\u003C/p>",{"url":79,"alt_text":79},{"id":2865,"secondary_organization_id":22,"secondary_organization_ids":2866,"content":2867,"image":2868,"status":6,"style":2787,"display_location":1638,"featured":12},43595,[22],"\u003Cp>Currently, Civic Plus is having technical difficulties with showing the Live Feed of the School Board Workshop and Meeting. Please click on the link to see the School Board Workshop and Meeting: \u003C/p>\u003Cp>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.youtube.com/live/pao9q_k8zTk\">https://www.youtube.com/live/pao9q_k8zTk\u003C/a>\u003C/p>\u003Cp>Thank you for your understanding!\u003C/p>",{"url":79,"alt_text":79},{"id":2870,"secondary_organization_id":22,"secondary_organization_ids":2871,"content":2872,"image":2873,"status":6,"style":2787,"display_location":1638,"featured":12},44274,[22],"\u003Ch2 style=\"text-align: center\">\u003Cstrong>\u003Cem>Notice:\u003C/em>\u003C/strong>\u003C/h2>\u003Cp style=\"text-align: center\">Negotiations between Santa Rosa County District Schools (SRCDS) and Santa Rosa Professional Educators (SRPE) will be held on Thursday, July 2, 2026 at 10:00 a.m.\u003C/p>\u003Cp style=\"text-align: center\">This will be held in Room 703 at the Dillon Administrative Complex located at 6032 Highway 90 Milton, Florida 32570.\u003C/p>",{"url":79,"alt_text":79},{"id":2875,"secondary_organization_id":22,"secondary_organization_ids":2876,"content":2877,"image":2878,"status":6,"style":2787,"display_location":2788,"featured":12},45149,[22],"\u003Ch2 style=\"text-align: center\">The first day of school is Monday, August 10, 2026. Visit our \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.santarosaschools.org/page/26-27-back-to-school-page\">2026-27 Back-to-School Page\u003C/a> for school start times, supply lists, meet-and-greet schedules, meal information, and much more.\u003C/h2>\u003Ch2 style=\"text-align: center\">Verify your child’s bus route, stop location, and scheduled pick-up/drop-off times by visiting our \u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://www.santarosaschools.org/page/transportation\">Transportation Webpage\u003C/a>.\u003C/h2>",{"url":79,"alt_text":79},{"id":2880,"secondary_organization_id":22,"secondar
