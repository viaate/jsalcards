338,344,350,356,362],"\u003Cp style=\"text-align: center\">Today is Election Day! Make sure to cast your ballot.\u003C/p>\u003Cp style=\"text-align: center\">With several CCISD schools serving as polling locations, voting is easier than ever. Visit the Nueces County website to learn about other voting centers.\u003C/p>\u003Cp style=\"text-align: center\">\u003Cbr>\u003C/p>",{"url":3035,"alt_text":3036,"asset_id":3037},"https://cmsv2-assets.apptegy.net/uploads/17364/file/3933801/1b0530cb-27c8-41fc-8cf7-b0befd75e20d.png","Bond 2024",3933801,{"id":3039,"secondary_organization_id":22,"secondary_organization_ids":3040,"content":3041,"image":3042,"status":3028,"style":3043,"display_location":1745,"featured":12},16314,[22],"\u003Cp>Test \u003C/p>",{"url":79,"alt_text":79},"banner",{"id":3045,"secondary_organization_id":22,"secondary_organization_ids":3046,"content":79,"image":3047,"status":6,"style":3029,"display_location":1745,"featured":12},16611,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],{"url":3048,"alt_text":3049,"asset_id":3050},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4085068/f534da7e-b6ef-4b0d-81ca-c09a50b7568f.jpeg","Winter Break & Student Holiday",4085068,{"id":170,"secondary_organization_id":22,"secondary_organization_ids":3052,"content":3053,"image":3054,"status":6,"style":3029,"display_location":1745,"featured":12},[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Cspan>In observance of the federal holiday, all schools and district offices will be closed. Tuesday, January, 21st classes will resume.\u003C/span>\u003C/p>",{"url":3055,"alt_text":3056,"asset_id":3057},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4159025/3d981875-bc9e-4628-aad7-6c110d7a935d.jpeg","Martin Luther King Jr. Day",4159025,{"id":3059,"secondary_organization_id":22,"secondary_organization_ids":3060,"content":3061,"image":3062,"status":6,"style":3043,"display_location":1745,"featured":12},21342,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Cp>\u003Cspan>Friday, Feb. 14 is a professional development/teacher prep day. There is no school for students.\u003C/span>\u003C/p>",{"url":79,"alt_text":79},{"id":3064,"secondary_organization_id":22,"secondary_organization_ids":3065,"content":3066,"image":3067,"status":6,"style":3029,"display_location":1745,"featured":12},22767,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Cspan>Spring Break is March 10-14. \u003C/span>\u003C/p>\u003Cp style=\"text-align: center\">\u003Cspan>Schools and district offices will reopen Monday, March 17.\u003C/span>\u003C/p>",{"url":3068,"alt_text":3069,"asset_id":3070},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4354712/ef950b30-b83d-4c2d-8229-5e83a56896c6.jpeg","Spring break graphic with flowers and butterfly's. Closed March 10th-14th. Schools and district offices will reopen on Monday, March 17. ",4354712,{"id":3072,"secondary_organization_id":22,"secondary_organization_ids":3073,"content":3074,"image":3075,"status":6,"style":3029,"display_location":1745,"featured":12},23424,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://ccisd.qualtrics.com/jfe/form/SV_3ygyneomZJObPlI\">\u003Cstrong>Annual Climate Survey March 19- April 6\u003C/strong>\u003C/a>\u003C/p>\u003Cp style=\"text-align: center\">This is our annual opportunity to get comprehensive feedback from staff, students (grades 4-12), parents, and the community so we may continue to improve the Corpus Christi ISD experience.\u003C/p>\u003Cp>\u003C/p>",{"url":3076,"alt_text":3077,"asset_id":3078},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4464676/2d181e4d-3ac1-494b-a3d8-14e143b138b7.png","Annual survey climate update",4464676,{"id":3080,"secondary_organization_id":22,"secondary_organization_ids":3081,"content":3082,"image":3083,"status":6,"style":3043,"display_location":1745,"featured":12},23465,[22],"\u003Cp>🚨We are closely monitoring the weather with our community, and currently, there are no changes to our school schedules. If there are any updates, club sponsors, athletic coaches, and official channels, such as automated messages, our website, social media, and local media will provide the information, with safety as our top priority.🚨\u003C/p>",{"url":79,"alt_text":79},{"id":3085,"secondary_organization_id":22,"secondary_organization_ids":3086,"content":3087,"image":3088,"status":6,"style":3029,"display_location":1745,"featured":12},24167,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Cspan>CCISD schools and district offices will be closed from Good Friday through Easter Monday, returning Tuesday, April 22. Wishing everyone a safe and fun break! Enjoy your time off!\u003C/span>\u003C/p>",{"url":3089,"alt_text":3090,"asset_id":3091},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4515135/a9263aed-e891-4254-93d6-27ca895c2fff.jpeg","Good Friday April 18 and Easter Monday April 21 Schools and District offices will be closed",4515135,{"id":3093,"sec 3C/strong>\u003C/span>\u003C/p>",{"url":3110,"alt_text":3111,"asset_id":3112},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4760915/10976a60-10fd-4b69-a9ae-ecd24db9b305.jpeg","CCISD Summer Hours",4760915,{"id":3114,"secondary_organization_id":22,"secondary_organization_ids":3115,"content":3116,"image":3117,"status":6,"style":3029,"display_location":1745,"featured":12},27458,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Cstrong>Convocation 2025: Unleash Your Potential\u003C/strong>\u003C/p>\u003Cp style=\"text-align: center\">\u003Cstrong>August 5, 2025 \u003C/strong>\u003C/p>",{"url":3118,"alt_text":3119,"asset_id":3120},"https://cmsv2-assets.apptegy.net/uploads/17364/file/4978604/63df5b61-b338-4be2-be97-98d411ede9f9.png","Convocation 2025 Unleash your potential",4978604,{"id":3122,"secondary_organization_id":22,"secondary_organization_ids":3123,"content":3124,"image":3125,"status":6,"style":3029,"display_location":1745,"featured":12},28112,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">In observance of Labor Day, all schools and district offices will be closed on Monday, Sept. 1.\u003C/p>",{"url":3126,"alt_text":3127,"asset_id":3128},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5076880/043220fa-de4b-478b-b099-db95bda7fbc7.jpeg","Labor Day 2025",5076880,{"id":3130,"secondary_organization_id":22,"secondary_organization_ids":3131,"content":3132,"image":3133,"status":6,"style":3029,"display_location":1745,"featured":12},29354,[22],"\u003Cp style=\"text-align: center\">\u003Cstrong>18th Annual State of the District\u003C/strong>\u003C/p>\u003Cp style=\"text-align: center\">Watch live: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.kristv.com/live\">\u003Cspan>https://www.kristv.com/live\u003C/span>\u003C/a>\u003C/p>",{"url":3134,"alt_text":3135,"asset_id":3136},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5281679/d1063779-65a9-405d-b4f2-d3d952679e4e.jpeg","State of the district information",5281679,{"id":3138,"secondary_organization_id":22,"secondary_organization_ids":3139,"content":3140,"image":3141,"status":6,"style":3029,"display_location":1745,"featured":12},29411,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Ch2 style=\"text-align: center\">Student Holiday &amp; Intersession\u003C/h2>\u003Cp style=\"text-align: center\">Student Holiday: Oct. 10 (No school)\u003C/p>\u003Cp style=\"text-align: center\">Intersession Week: Oct. 13–17\u003C/p>\u003Cp>CCISD’s Administration Building will remain open Monday–Thursday from 8 a.m. to 4:30 p.m. during intersession.\u003C/p>",{"url":3142,"alt_text":3143,"asset_id":3144},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5290403/a7382315-7ecd-4619-9f0f-675bff5fc488.jpeg","Intersession 2025 information",5290403,{"id":3146,"secondary_organization_id":22,"secondary_organization_ids":3147,"content":3148,"image":3149,"status":6,"style":3029,"display_location":1745,"featured":12},30538,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Cspan>\u003Cstrong>All campuses and district offices will be closed Nov. 24-28 for Thanksgiving break.\u003C/strong>\u003C/span>\u003C/p>",{"url":3150,"alt_text":1038,"asset_id":3151},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5426946/71b16aae-98f6-4223-a062-e8de44744474.jpeg",5426946,{"id":3153,"secondary_organization_id":22,"secondary_organization_ids":3154,"content":3155,"image":3156,"status":6,"style":3029,"display_location":1745,"featured":12},32112,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368],"\u003Cp style=\"text-align: center\">All CCISD campuses and district offices will be \u003Cstrong>closed beginning December 22\u003C/strong> for Winter Break.\u003C/p>\u003Cp style=\"text-align: center\">\u003Cstrong>District offices will reopen on January 5\u003C/strong>, and \u003Cstrong>students return to campus on January 7\u003C/strong>.\u003C/p>\u003Cp style=\"text-align: center\">We wish our students, families, and community a safe and joyful holiday season! ❄️✨\u003C/p>\u003Cp style=\"text-align: center\">\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://youtu.be/Ph2yRG6sA0E\" relative-link=\"\">\u003Cstrong>Holiday Message 2025\u003C/strong>\u003C/a>\u003C/p>",{"url":3157,"alt_text":3158,"asset_id":3159},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5542155/12419161-b0e8-47cf-b249-8bce08dedb4c.jpeg","Happy Holidays December 22 - January 2 ",5542155,{"id":3161,"secondary_organization_id":22,"secondary_organization_ids":3162,"content":3163,"image":3164,"status":6,"style":3029,"display_location":1745,"featured":12},33252,[22],"\u003Cp style=\"text-align: center\">\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://corpuschristiisdtx.new.swagit.com/events/43903\" relative-link=\"\">Virtual School Consolidation Meeting\u003C/a>\u003C/p>\u003Cp style=\"text-align: center\">6:00 p.m.\u003C/p>",{"url":79,"alt_text":79},{"id":3166,"secondary_organization_id":22,"secondary_organization_ids":3167,"content":3168,"image":3169,"status":6,"style":3029,"display_location":1745,"featured":12},34919,[22],"\u003Cp>SCHEDULE UPDATE:\u003C/p>\u003Cp>On Monday, Jan. 26, all Corpus Christi ISD schools and offices will have a two-hour delay. \u003C/p>\u003Cp>Elementary schools will begin at 9:50 a.m. Middle and high schools will begin at 10:50 a.m. Bus schedules will also run on a two-hour delay.\u003C/p>\u003Cp>Unless otherwise notified by their supervisor, CCISD employees are expected to report to work on Monday two hours later than their usual start time.\u003C/p>\u003Cp>Athletics and school activity coaches and sponsors will update their groups directly regarding any schedule changes.\u003C/p>\u003Cp>When evaluating changes to schedules, we place safety first, as well as consider the many families whose work obligations will continue unchanged and students with insufficient access to heat and/or meals. Thank you for your patience as we monitored the weather and for sharing our concern for student and staff safety.\u003C/p>\u003Cp>If the weather necessitates additional changes to our schedule, we will send an updated mass notification as well as post to official district social media and share with local media outlets. Thank you.\u003C/p>",{"url":3170,"alt_text":3171,"asset_id":3172},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5641621/2c8d1bd9-55e8-4da7-8acc-8a692d73029e.jpeg","Weather Alert",5641621,{"id":3174,"secondary_organization_id":22,"secondary_organization_ids":3175,"content":3176,"image":3177,"status":6,"style":3029,"display_location":1745,"featured":12},38002,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Cp>Enjoy the student holiday Friday, Feb 13!\u003C/p>\u003Cp>Classes resume Monday, Feb. 16. We look forward to welcoming students back refreshed and ready to learn.\u003C/p>",{"url":3178,"alt_text":3179,"asset_id":3180},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5712641/839a4aa7-6fe9-4027-9b57-b7d5aff770a2.png","Reminder Friday, Feb. 13 Student Holiday; Monday Feb. 16, Regular Schedule ",5712641,{"id":3182,"secondary_organization_id":22,"secondary_organization_ids":3183,"content":3184,"image":3185,"status":6,"style":3043,"display_location":1745,"featured":12},38003,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Cp>Classes resume today, Feb. 16. We look forward to welcoming students back refreshed and ready to learn.\u003C/p>",{"url":79,"alt_text":79},{"id":3187,"secondary_organization_id":22,"secondary_organization_ids":3188,"content":3189,"image":3190,"status":6,"style":3029,"display_location":1745,"featured":12},39819,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Ch1 style=\"text-align: left\">\u003Cstrong>Enjoy your Spring Break!\u003C/strong>\u003C/h1>\u003Cp>All campuses and district offices will be closed March 9 through 13.\u003C/p>",{"url":3191,"alt_text":3192,"asset_id":3193},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5798227/3be9b952-745a-4b37-ac35-c37b0c0858ae.jpeg","All campuses and district offices will be closed March 9 through 13.",5798227,{"id":3195,"secondary_organization_id":22,"secondary_organization_ids":3196,"content":3197,"image":3198,"status":6,"style":3029,"display_location":1745,"featured":12},40566,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Cp>Our annual climate survey runs through 4:30 p.m., Monday, March 30. This is our annual opportunity to get feedback from staff, families and the community so we may continue to improve the Corpus Christi ISD experience. \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://ccisd.qualtrics.com/jfe/form/SV_eJwRarTWpKjzLWC\">Here is the link to the survey\u003C/a>. Thank you for taking the time to share your thoughts!\u003C/p>",{"url":3199,"alt_text":3200,"asset_id":3201},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5830250/42b40851-5dca-402b-b498-f4ff6357fafc.png","Our annual climate survey runs through 4:30 p.m., Monday, March 30.",5830250,{"id":3203,"secondary_organization_id":22,"secondary_organization_ids":3204,"content":3205,"image":3206,"status":6,"style":3029,"display_location":1745,"featured":12},42003,[22],"\u003Cp style=\"text-align: center\">Calling all future CCISD teachers! \u003C/p>\u003Cp style=\"text-align: center\">Join us at our Teacher Job Fair and take the next step in your education career! We are hiring teachers and coaches for all subjects and grade levels. Bring multiple copies of your resume and get ready to meet campus administrators!\u003C/p>\u003Cp style=\"text-align: center\">9 a.m. – 12 p.m.,  April 25\u003C/p>\u003Cp style=\"text-align: center\">Mary Carroll High School, 3202 Saratoga Blvd.\u003C/p>\u003Cp style=\"text-align: center\"> Starting salary: $54,500\u003C/p>\u003Cp style=\"text-align: center\"> Apply &amp; learn more: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://Jobs.ccisd.us\">\u003Cspan>\u003Cstrong>Jobs.ccisd.us\u003C/strong>\u003C/span>\u003C/a>\u003C/p>",{"url":3207,"alt_text":3208,"asset_id":3209},"https://cmsv2-assets.apptegy.net/uploads/17364/file/5958202/2cdf041e-91a5-4314-92ce-7cc50a485fac.jpeg","Draft 2026 Teacher Job Fair",5958202,{"id":3211,"secondary_organization_id":22,"secondary_organization_ids":3212,"content":3213,"image":3214,"status":6,"style":3029,"display_location":1745,"featured":12},42491,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,338,344,350,356,362],"\u003Ch1 style=\"text-align: center\">Cyber Alert Affecting Canvas\u003C/h1>\u003Cp style=\"text-align: center\">5/12 Update: CCISD has been advised that Canvas&nbsp;access&nbsp;has been restored.&nbsp; &nbsp;Faculty&nbsp;and students may resume use&nbsp;of the application.&nbsp;\u003C/p>\u003Cp style=\"text-align: center\">Technology Services will continue to monitor the situation and will report any further problems&nbsp;or new developments.&nbsp; If you continue to have issues,&nbsp;please contact&nbsp;the Help&nbsp;Desk at 361-878-3911, option 2.\u003C/p>",{"url":79,"alt_text":79},{"id":3216,"secondary_organization_id":22,"secondary_organization_ids":3217,"content":3218,"image":3219,"status":6,"style":3029,"display_location":1745,"featured":12},43110,[22],"\u003Cp style=\"text-align: center\">\u003Cspan>All campuses and district offices will be closed on May 25 in observance of Memorial Day.\u003C/span>\u003C/p>",{"url":3220,"alt_text":3221,"asset_id":3222},"https://cmsv2-assets.apptegy.net/uploads/17364/file/6063571/38ef4590-dde9-4126-9d25-fa720a36f045.jpeg","Memorial Day May 25th",6063571,{"id":3224,"secondary_organization_id":22,"secondary_organization_ids":3225,"content":3226,"image":3227,"status":6,"style":3029,"display_location":1745,"featured":12},43313,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">\u003Cspan>Today is the last day of school! Thank you to our students and staff for all your hard work and dedication this year. We hope everyone has a fun, safe, and relaxing summer break! \u003C/span>\u003Cbr>\u003Cspan>Elementary campuses dismiss at 3:10 p.m., and middle and high schools dismiss at 4:10 p.m. See you next school year!\u003C/span>\u003C/p>",{"url":79,"alt_text":79},{"id":3229,"secondary_organization_id":22,"secondary_organization_ids":3230,"content":3231,"image":3232,"status":6,"style":3029,"display_location":1745,"featured":12},44136,[22],"\u003Cp style=\"text-align: center\">\u003Cspan>CCISD properties will be closed on Fridays from June 1- July 30. We are glad to help you Monday through Thursday 8 a.m. - 4:30 p.m. \u003C/span>\u003Cbr>\u003Cspan>Monday-Friday schedule resumes Monday, Aug. 3. \u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>All district offices will be closed for summer break from June 23 - July 3. Offices will reopen Monday, July 6.\u003C/span>\u003C/p>",{"url":3233,"alt_text":3234,"asset_id":3235},"https://cmsv2-assets.apptegy.net/uploads/17364/file/6170159/5adb3ee0-1055-4f7a-8292-f875b29b0562.jpeg","Bright graphic with summer hours and break information. Dates for closed properties and offices.",6170159,{"id":3237,"secondary_organization_id":22,"secondary_organization_ids":3238,"content":3239,"image":3240,"status":6,"style":3029,"display_location":1745,"featured":12},45888,[22],"\u003Cp style=\"text-align: center\">\u003Cstrong>Convocation 2026\u003C/strong>\u003C/p>",{"url":3241,"alt_text":3242,"asset_id":3243},"https://cmsv2-assets.apptegy.net/uploads/17364/file/6316816/5b31fcca-e99b-4743-80ff-326464bf8658.png","A poster with a palm tree and wave design. Two surfers are riding a wave. It reads: \"CCISD is the place to be.\"",6316816,{"id":3245,"secondary_organization_id":22,"secondary_organization_ids":3246,"content":3247,"image":3248,"status":6,"style":3029,"display_location":1745,"featured":12},46003,[22,86,92,98,104,110,3022,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362],"\u003Cp style=\"text-align: center\">Watch Superintendent Dr. Roland Hernandez's special welcome message as we get ready for an exciting new school year.\u003C/p>\u003Cp style=\"text-align: center\">The first day of school is Tuesday, August 11. We can't wait to welcome our students!\u003C/p>\u003Cp style=\"text-align: center\">\u003Ca target=\"_blank\" r
