__header\">\n                            \u003Cdiv class=\"lf-item__avatar\"> {{avatar}} \u003C/div>\n                            \u003Cdiv class=\"lf-item__author\"> {{author}} \u003C/div>\n                            \u003Cdiv class=\"lf-item__timeAgo\"> {{time_ago}} \u003C/div>\n                        \u003C/div>\n                        \u003Cdiv class=\"lf-item__content\">\n                            \u003Cdiv class=\"lf-item__text\"> \n                                {{status}}                       \n                            \u003C/div>\n                            \u003Ca href=\"{{entry_url}}\" class=\"lf-item__read-more\">\u003Cspan>Read More\u003C/span>\u003C/a>\n                        \u003C/div>\n                        \n                    \u003C/div>\n                \u003C/div> \n            \u003C/cms-media>\n          \u003C/div> \n        \u003C/div>        \n    \u003C/div>  \n      \u003Cdiv class=\"custom-swiper-navigation\">\n          \u003Cdiv class=\"custom-swiper-prev custom-swiper-prev-lf\">\u003C/div>\n          \u003Cdiv class=\"custom-swiper-pagination-lf custom-swiper-pagination\"> \u003C/div>\n          \u003Cdiv class=\"custom-swiper-next custom-swiper-next-lf\">\u003C/div>\n      \u003C/div> \n     \u003Cdiv class=\"see-all-container see-all-bottom\">\n        \u003Ca href=\"{{section_page_url}}\" class=\"see-all-button button outline\">See All Posts\u003C/a>      \n    \u003C/div>     \n\u003C/div>","media-custom-html-a7bde7a1-cb1c-44c4-9d88-9b392e4b42c2",{"type":1818,"color":1834},{"hex":1604},{"id":1836,"type":1808,"components":1837,"decorativeBackground":1849},"9c92fe20-e65d-494c-9ca2-dd88fff39c3c",[1838],{"name":1824,"options":1839},{"js_code":1840,"section":1841,"css_code":1845,"html_code":1846,"scss_code":1847,"container_id":1848},"\n// Add event calendar type\nclass EventsCalendarTypeManager {\n    constructor() {\n        this.eventsContainer = document.querySelector('#eventsList');\n        this.eventsApiData = null;\n        this.titleToCalendarTypeMap = new Map();\n\n        if (this.eventsContainer) {\n            this.init();\n        }\n    }\n\n    async init() {\n        try {\n            await this.fetchEventsData();\n            this.createTitleMapping();\n            this.enhanceEventElements();\n        } catch (error) {\n             \n        }\n    }\n\n    async fetchEventsData() {\n        const getInfo = new GetInfo();\n        const currentLanguage = getInfo.orgTranslation;\n        const eventsApiUrl = `${getInfo.linkEvents}?locale=${currentLanguage}&page_size=10`;\n\n        const dataFetcher = new DataFetcher(eventsApiUrl);\n        this.eventsApiData = await dataFetcher.fetchData();\n    }\n\n    createTitleMapping() {\n        if (!this.eventsApiData?.events) return;\n\n        this.eventsApiData.events.forEach(event => {\n            if (event.title && event.custom_section_name) {\n                this.titleToCalendarTypeMap.set(\n                    event.title.trim().toLowerCase(),\n                    {\n                        name: event.custom_section_name,\n                        slug: this.createSlug(event.custom_section_name),\n                        id: event.custom_section_id\n                    }\n                );\n            }\n        });\n    }\n\n    createSlug(text) {\n        return text\n            .toLowerCase()\n            .replace(/[^a-z0-9\\s-]/g, '')\n            .replace(/\\s+/g, '-')\n            .replace(/-+/g, '-')\n            .trim();\n    }\n\n    enhanceEventElements() {\n        const eventItems = this.eventsContainer.querySelectorAll('.event-item');\n\n        eventItems.forEach(eventItem => {\n            const titleElement = eventItem.querySelector('.event-item__title h3 a');\n            if (!titleElement) return;\n\n            const eventTitle = titleElement.textContent.trim().toLowerCase();\n            const calendarTypeData = this.titleToCalendarTypeMap.get(eventTitle);\n\n            if (calendarTypeData) {\n                this.addCalendarTypeToEvent(eventItem, calendarTypeData);\n            }\n        });\n    }\n\n    addCalendarTypeToEvent(eventItem, calendarTypeData) {\n        // Add calendar type as data attribute\n        eventItem.setAttribute('data-calendar-type', calendarTypeData.slug);\n        eventItem.setAttribute('data-calendar-id', calendarTypeData.id);\n\n        // Add CSS class for styling\n        eventItem.classList.add(`calendar-${calendarTypeData.slug}`);\n\n        // Create and insert calendar type element\n        const calendarTypeElement = UtilityHelpers.createEl(\n            'div',\n            ['event-item__calendar-type', `calendar-type--${calendarTypeData.slug}`]\n        );\n        calendarTypeElement.textContent = calendarTypeData.name;\n\n        // Insert after the time element within event-details\n        const timeElement = eventItem.querySelector('.event-item__time');\n        if (timeElement) {\n            timeElement.insertAdjacentElement('afterend', calendarTypeElement);\n        } else {\n            // Fallback: insert at the end of event-details\n            const eventDetails = eventItem.querySelector('.event-details');\n            if (eventDetails) {\n                eventDetails.appendChild(calendarTypeElement);\n            } else {\n                // Final fallback: insert at the end of event item\n                eventItem.appendChild(calendarTypeElement);\n            }\n        }\n    }\n}\n\n// Initialize the function\nnew EventsCalendarTypeManager();",{"api":1842,"name":1843,"type":1844},"events","All Events (6)","all_events","#media-custom-html-6228f16e-fa45-4b98-88a1-f966004fc2cf .custom-section {\n  display: block !important;\n}\n","\u003Cdiv class=\"events-section custom-section style-light\" id=\"section-events\">\n  \u003Cdiv class=\"see-all-container see-all-top\">\n        \u003Cdiv id=\"events-title\" class=\"header-slot-container\">\n            \u003Ch2>District Events\u003C/h2>\n        \u cellence across the district. \n\nThe district’s A grade follows a year of significant student achievement, including the highest graduation rate in district history and an increase in the college and career acceleration rate.",{"image":2311,"input":2315,"textarea":2321},{"flip-card-image":2312},{"url":2313,"alt_text":2314,"ai_generated_alt_text":7},"https://cmsv2-assets.apptegy.net/uploads/28712/file/6348473/6f3be035-4322-414c-8013-b990350802c3.jpeg","students showing off their artwork",{"flip-card-title":2316,"flip-card-number":2318,"flip-card-subtitle":2320},{"text":2317},"Create; Express; Inspire",{"text":2319},"\"A\" for Arts",{"text":91},{"flip-card-text":2322},{"text":2323},"HCPS takes pride in supporting comprehensive Art Education for all students from kindergarten through grade 12. Through a well-rounded curriculum and strong community support, HCPS prioritizes innovation, creativity, and showcasing students’ artistic talents in music, theatre, art, writing, and dance. At its core, HCPS Art Education is about creativity, connection, and using art to inspire positive change in the community.",{"image":2325,"input":2329,"textarea":2335},{"flip-card-image":2326},{"url":2327,"alt_text":2328,"ai_generated_alt_text":7},"https://cmsv2-assets.apptegy.net/uploads/28712/file/6348480/ec59e459-a044-4586-8122-265856a2dec5.jpeg","students watching workers work on electricity poles",{"flip-card-title":2330,"flip-card-number":2332,"flip-card-subtitle":2334},{"text":2331},"Learn by Doing. Prepare for Tomorrow",{"text":2333},"\"A\" for Apprenticeships",{"text":91},{"flip-card-text":2336},{"text":2337},"HCPS is preparing students for life after graduation through apprenticeships. HCPS apprenticeship programs serve more than 4,500 apprentices across Florida. These students are earning a wage while gaining hands-on experience and learning valuable, in-demand trades. HCPS leads the state of Florida in apprenticeships.",{"image":2339,"input":2343,"textarea":2349},{"flip-card-image":2340},{"url":2341,"alt_text":2342,"ai_generated_alt_text":7},"https://cmsv2-assets.apptegy.net/uploads/28712/file/6348494/abcac786-455d-4908-8ca1-c58e78ecbb06.jpeg","Students lining up for NHS picture at Strawberry Crest High School",{"flip-card-title":2344,"flip-card-number":2346,"flip-card-subtitle":2348},{"text":2345},"More Challenge. More Opportunities",{"text":2347},"\"A\" for Accelerated Opportunities",{"text":91},{"flip-card-text":2350},{"text":2351},"HCPS continues to expand access to advanced coursework through our AP, IB, AICE, and Dual Enrollment Programs. HCPS students took more than 30,000 AP exams last year; 90% of our IB students earned their IB Diploma; students took more than 17,000 Dual Enrollment courses; and our student completed more than29,000 AICE exams while also being named the Cambridge Large District of the Year.",{"image":2353,"input":2357,"textarea":2365},{"flip-card-image":2354},{"url":2355,"alt_text":2356,"ai_generated_alt_text":7},"https://cmsv2-assets.apptegy.net/uploads/28712/file/6348536/9d5d9c53-60da-4d92-9ad3-0c3b6362149c.jpeg","Lennard High flag football player catching a pass",{"flip-card-link":2358,"flip-card-title":2360,"flip-card-number":2362,"flip-card-subtitle":2364},{"text":2359},"https://www.hillsboroughschools.org/page/athletics",{"text":2361},"Strength, Character, and Teamwork",{"text":2363},"\"A\" for Athletics",{"text":91},{"flip-card-text":2366},{"text":2367},"HCPS student-athletes continue to raise the bar, excelling on the field, on the court, and in the classroom while representing their schools and the district with pride. HCPS is proud to support the successes on and off the field for these extraordinary student-athletes.",{},{"flip-card-section-title":2370},{"text":2371},"An \"A\" Graded School District",{},{},{"icon":2375,"loop":2376,"image":2377,"input":2378,"textarea":2383,"rich_textarea":2386},{},{},{},{"top-custom-footer-link":2379,"top-custom-footer-title":2381},{"href":2175,"text":2380,"target":2108
