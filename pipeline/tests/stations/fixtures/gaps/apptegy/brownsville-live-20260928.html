style=\"text-align: left\">BISD does not discriminate on the basis of race, color, national origin, gender, religion, age, disability or genetic information in employment or provision of services, programs or activities\u003C/p>\u003Cp style=\"text-align: left\">BISD no discrimina de acuerdo a raza, color, origen nacional, género, religión, edad, información genética, o incapacidad en el empleo o la disposición de servicios, programas o actividades.\u003C/p>\u003Cp style=\"text-align: left\">Policy DC (Local) Brownville ISD is an equal employment opportunity employer, however, when applicants are equally qualified for a position, veterans retiring and/or exiting from military service who are honorably discharged shall be extended a hiring preference.\u003C/p>\u003Cp style=\"text-align: left\">In accordance with State and Federal law, as well as Legal and Local District Policy, the Brownsville Independent School District does not support or endorse any elected public official, political candidate, political campaign, political movement, or agenda.\u003C/p>\u003Cp style=\"text-align: left\">To the extent District events are open to the public, any photograph of an elected official or candidate used on the District website is incidental. The inclusion of photographs of elected officials or candidates are not intended to support or oppose anyone running for public office.\u003C/p>\u003Cp style=\"text-align: left\">BISD’s Title IX Coordinator: Maricela Zarate Puente, Executive Director Human Resources. The district’s non-discrimination policy; DIA (Local) and FFH (Local) Training materials used to train the district’s Title IX personnel. Brownsville ISD’s Title IX administrators have attended Eichelbaum Wardell Hansen Powell &amp; Muñoz P.C.’s “New Title IX Rules and Regulations” series. Materials from this series in compliance with Section 106.45(b)(10)(i)(D) of the regulations can be found here: New Title IX Rules and Regulations Materials\u003C/p>\u003Cp style=\"text-  students within BISD boundaries. Please provide:\u003C/p>\u003Col>\u003Cli>\u003Cp>Valid ID of parent/guardian\u003C/p>\u003C/li>\u003Cli>\u003Cp>Proof of residence, anything with parent/guardian name and address received in the mail.\u003C/p>\u003C/li>\u003Cli>\u003Cp>If student is coming in from a charter/private school parent/guardian must provide most recent report card, attendance report and behavioral report. The application will automatically be sent for review with Pupil Services. Once completed you will receive an email with the completed application, Thank you.\u003C/p>\u003C/li>\u003C/ol>\u003Cp>Por favor, proporcione:\u003C/p>\u003Col>\u003Cli>\u003Cp>Identificación válida del padre/tutor\u003C/p>\u003C/li>\u003Cli>\u003Cp>Comprobante de residencia, cualquier cosa con el nombre del padre/tutor y la dirección recibida por correo.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Si el estudiante viene de una escuela chárter/privada, el padre/tutor debe proporcionar la boleta de calificaciones más reciente, el informe de asistencia y el informe de comportamiento. La solicitud se enviará automáticamente para su revisión con Servicios Estudiantiles. Una vez completada recibirás un correo electrónico con la solicitud completada, Gracias.\u003C/p>\u003C/li>\u003C/ol>",{"url":4650,"alt_text":4651,"asset_id":4652},{"id":4660,"secondary_organization_id":22,"secondary_organization_ids":4661,"content":4662,"image":4663,"status":4667,"style":4653,"display_location":1435,"featured":12},26364,[22],"\u003Cp>\u003Cspan>Elementary/ Middle School online Inter-District transfers(Outside of BISD boundaries) are now available for the 2026-2027 school year. Come be a part of the Best Choice and enroll today.....\u003C/span>\u003Cbr>\u003Cbr>\u003Cbr>\u003Cbr>\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://apps.docusign.com/webforms/us/4a8225e8ff9fb0c7a7372fb1f316344f\">Inter-District (Outside District) Transfer&nbsp;\u003C/a>\u003C/p>",{"url":4664,"alt_text":4665,"asset_id":4666},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5972849/041f47db-1da0-4817-a81b-e4de97d20b0d.jpeg","interdistrict tranfers",5972849,"draft",{"id":4669,"secondary_organization_id":22,"secondary_organization_ids":4670,"content":4671,"image":4672,"status":6,"style":4653,"display_location":1435,"featured":12},26490,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp style=\"text-align: center\">\u003Cstrong>BISD will be closed from June 30 to July 4 for summer break. We will reopen and be ready to serve our community on Monday, July 7th.\u003C/strong>\u003C/p>",{"url":4673,"alt_text":4674,"asset_id":4675},"https://cmsv2-assets.apptegy.net/uploads/28658/file/4836869/b500f838-81d3-4b7c-af9d-a4499f854483.jpeg","BISD is closed this week for summer break. We will be back and ready to serve our community on July 7th.",4836869,{"id":4677,"secondary_organization_id":22,"secondary_organization_ids":4678,"content":4679,"image":4680,"status":6,"style":4653,"display_location":4681,"featured":12},26789,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>📢 \u003Cstrong>ATTENTION BISD Staff\u003C/strong>\u003Cbr>\u003Cbr>eSchools will be \u003Cstrong>down from Monday, July 14, through Tuesday, July 16,\u003C/strong> for the annual system rollover. Service will resume on \u003Cstrong>Wednesday, July 17\u003C/strong>.\u003C/p>\u003Cp>Thank you for your patience and understanding as our Computer Services team completes this important update.\u003C/p>",{"url":79,"alt_text":79},"all_pages",{"id":4683,"secondary_organization_id":22,"secondary_organization_ids":4684,"content":4685,"image":4686,"status":6,"style":4653,"display_location":468 ,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>📢 Voting results for the 2025 Brownsville ISD Bond Election will be available after polls close at 7 p.m. tonight on our district homepage ➡️ \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.bisd.us\">https://www.bisd.us\u003C/a> and all BISD social media channels.\u003C/p>\u003Cp>Results will be updated throughout the evening as reported by the Cameron County Elections Department. You can also view results directly at \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://cameroncountytx.gov/elections/results/\">https://cameroncountytx.gov/elections/results/\u003C/a>\u003C/p>\u003Cp>\u003Cspan>UNOFFICIAL ELECTION RESULTS Updated: 7:27 P.M., 11/4/2025\u003C/span>\u003C/p>",{"url":4793,"alt_text":4778,"asset_id":4794},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5395145/46be9a0f-40fe-4359-9e5f-e3ff797db739.jpeg",5395145,{"id":4796,"secondary_organization_id":22,"secondary_organization_ids":4797,"content":4798,"image":4799,"status":6,"style":4653,"display_location":1435,"featured":12},30233,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>Thank you to everyone who participated in the 2025 Bond Propositions A &amp; B Election.\u003C/p>\u003Cp>While the measures did not pass, Brownsville ISD deeply appreciates our community’s involvement.\u003C/p>\u003Cp>We remain committed to providing safe, innovative, and supportive learning environments, and we will continue working together to assess district needs and plan for the future.\u003Cbr>\u003C/p>\u003Cp>\u003Cbr>\u003C/p>",{"url":4800,"alt_text":4778,"asset_id":4801},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5395741/436dea8f-aa75-45a7-b001-5f107e9b67f6.jpeg",5395741,{"id":4803,"secondary_organization_id":22,"secondary_organization_ids":4804,"content":4805,"image":4806,"status":6,"style":4653,"display_location":1435,"featured":12},30278,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>\u003Cspan>In observance of \u003C/span>\u003Cstrong>Veterans Day\u003C/strong>\u003Cspan>, BISD offices and campuses will be \u003C/span>\u003Cstrong>closed on Tuesday, November 11, 2025\u003C/strong>\u003Cspan>.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Regular district operations will \u003C/span>\u003Cstrong>resume on Wednesday, November 12, 2025.\u003C/strong>\u003C/p>",{"url":4807,"alt_text":4808,"asset_id":4809},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5400377/5f880db9-f9cb-49df-a91f-c1acaa36583b.jpeg","Veterans Day",5400377,{"id":4811,"secondary_organization_id":22,"secondary_organization_ids":4812,"content":4813,"image":4814,"status":4667,"style":4653,"display_location":1435,"featured":12},30353,[22,86,92,98,104,110,116,122,128,134],"\u003Cp>\u003Cspan>It is that time of the year again when we have our AMC competition at every high school campus.\u003C/span>\u003Cbr>\u003Cspan>Good Luck to all competitors. \u003C/span>\u003C/p>\u003Cp>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"Https://maa.edvistas.com/datamate/studentlogin.aspx\">\u003Cspan>Https://maa.edvistas.com/datamate/studentlogin.aspx\u003C/span>\u003C/a>\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003C/p>",{"url":4815,"alt_text":4816,"asset_id":4817},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5410234/eff260a4-50bf-4615-85cd-cd41dff2434e.png","AMC",5410234,{"id":4819,"secondary_organization_id":22,"secondary_organization_ids":4820,"content":4821,"image":4822,"status":6,"style":4653,"display_location":1435,"featured":12},30423,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>In observance of \u003Cstrong>Veterans Day\u003C/strong>, BISD offices and campuses will be \u003Cstrong>closed on Tuesday, November 11, 2025\u003C/strong>.\u003Cbr>\u003Cbr>Regular district operations will \u003Cstrong>resume on Wednesday, November 12, 2025.\u003C/strong>\u003C/p>",{"url":4823,"alt_text":4808,"asset_id":4824},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5415255/cf43f3a9-b636-46d7-b26e-c0062c49dce1.jpeg",5415255,{"id":4826,"secondary_organization_id":22,"secondary_organization_ids":4827,"content":4828,"image":4829,"status":6,"style":4653,"display_location":1435,"featured":12},30483,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp> Save the Date! BISD Open House!\u003C/p>\u003Cp>Join us for our BISD Open House and connect with our amazing teachers, administrators, and staff. Take a campus tour and explore the wide range of educational opportunities available to our students.\u003C/p>\u003Cp>We can’t wait to welcome you!\u003C/p>\u003Cp>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"x1i10hfl xjbqb8w x1ejq31n x18oe1m7 x1sy0etr xstzfhl x972fbf x10w94by x1qhh985 x14e42zd x9f619 x1ypdohk xt0psk2 x3ct3a4 xdj266r x14z9mp xat24cr x1lziwak xexx8yu xyri2b x18d9i69 x1c1uobl x16tdsg8 x1hl2dhg xggy1nq x1a2a7pz xkrqix3 x1sur9pj x1fey0fg x1s688f\" href=\"https://www.facebook.com/hashtag/oneteamonedream?__eep__=6&amp;__cft__[0]=AZVltBOr1MdVeBtMF1rnbeZgQgO6BNY2wzKJEnbYZTQStQSKYA1fnXsM_-mk3rrsH88LaKeFz6QAYzKcKTfcL3IwQ08OBVqxU8TWbErozaVTU2SwdeNph1rRpBX9NymPfearXHto3YwVVlbusjR5wAe4&amp;__tn__=*NK-R\">\u003Cspan>\u003Cstrong>#OneTeamOneDream\u003C/strong>\u003C/span>\u003C/a>\u003C/p>",{"url":4830,"alt_text":4831,"asset_id":4832},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5421665/b091574e-62ea-4865-a8d5-4ac09bff3388.jpeg","Open House",5421665,{"id":4834,"secondary_organization_id":22,"secondary_organization_ids":4835,"content":4836,"image":4837,"status":6,"style":4653,"display_location":1435,"featured":12},31859,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>Our hearts go out to the students and families impacted by the fire at Palacio Real Apartments. \u003C/p>\u003Cp>Brownsville ISD is committed to standing with you during this difficult time. If you need support, please don’t hesitate to reach out to our Homeless Youth Connection Department at (956) 544-6612. \u003C/p>\u003Cp>We are here to help, listen, and provide assistance. In times like this, community is more important than ever. Your community is here to support you.\u003C/p>",{"url":4838,"alt_text":4839,"asset_id":4840},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5510426/27a0125e-21e5-4743-b7e3-f577611c11f3.png","Fire",5510426,{"id":4842,"secondary_organization_id":22,"secondary_organization_ids":4843,"content":4844,"image":4845,"status":6,"style":4653,"display_location":1435,"featured":12},32090,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>\u003Cspan>Holiday Break\u003C/span>\u003C/p>\u003Cp>\u003Cspan>Superintendent Dr. Jesus H. Chavez and the Board of Trustees wish you and your family a peaceful holiday season and a wonderful New Year!\u003C/span>\u003C/p>\u003Cp>\u003Cspan>All campuses and offices will be CLOSED during these periods.\u003C/span>\u003C/p>\u003Cp>\u003Cbr>\u003C/p>",{"url":4846,"alt_text":4847,"asset_id":4848},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5516244/8daa62c0-d71a-4c2b-a72f-0dd2810e6b62.jpeg","Holiday Break",5516244,{"id":4850,"secondary_organization_id":22,"secondary_organization_ids":4851,"content":4852,"image":4853,"status":6,"style":4653,"display_location":1435,"featured":12},33690,[22,86,92,98,104,110,116,122,128,134],"\u003Cp>\u003Cspan>🚨 PARENTS & STUDENTS: ACTION REQUIRED 🚨  \u003C/span>\u003C/p>\u003Cp>\u003Cspan>Please log in to the Home Access Center (HAC) to review your high school transcript, including all Dual Enrollment (DE) courses.  \u003C/span>\u003C/p>\u003Cp>\u003Cspan> \u003C/span>\u003C/p>\u003Cp>\u003Cspan>✔️ Accurate transcripts are crucial for college applications, GPA calculations, and class ranking  \u003C/span>\u003C/p>\u003Cp>\u003Cspan>✔️ Confirming now ensures all credits earned are properly recorded  \u003C/span>\u003C/p>\u003Cp>\u003Cspan> \u003C/span>\u003C/p>\u003Cp>\u003Cspan>⚠️ Important Reminder:  \u003C/span>\u003C/p>\u003Cp>\u003Cspan>Missing credits due to excessive absences can affect your GPA and overall credits earned.  \u003C/span>\u003C/p>\u003Cp>\u003Cspan> \u003C/span>\u003C/p>\u003Cp>\u003Cspan>📅 Deadline for verification: Monday, January 19, 2026  \u003C/span>\u003C/p>\u003Cp>\u003Cspan>👉 Access transcripts in HAC with the login information provided by your campus.  \u003C/span>\u003C/p>\u003Cp>\u003Cspan> \u003C/span>\u003C/p>\u003Cp>\u003Cspan>📌 Note: The GPA and class rank in HAC are unofficial.  \u003C/span>\u003C/p>\u003Cp>\u003Cspan> \u003C/span>\u003C/p>\u003Cp>\u003Cspan>If you find any discrepancies or have questions, contact your school counselor promptly.\u003C/span>\u003C/p>",{"url":4854,"alt_text":4855,"asset_id":4856},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5594854/f51ca461-07c5-40a3-9099-1510030c3b67.png","HAC",5594854,{"id":4858,"secondary_organization_id":22,"secondary_organization_ids":4859,"content":4860,"image":4861,"status":6,"style":4653,"display_location":1435,"featured":12},34246,[22,140,146,152,158,164,170,176,182,188,194],"\u003Cp>It is that time of the year again when we have our AMC competition at every middle school campus.\u003Cbr>Good Luck to all competitors.\u003Cbr>\u003Cbr>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://maa.edvistas.com/datamate/studentlogin.aspx\">EVI Data Mate - Student Login\u003C/a>\u003C/p>",{"url":4862,"alt_text":4863,"asset_id":4864},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5626458/4c105b2d-9aa4-42e5-be18-758e7a63e7b2.png","maaamc",5626458,{"id":4866,"secondary_organization_id":22,"secondary_organization_ids":4867,"content":4868,"image":4869,"status":6,"style":4653,"display_location":1435,"featured":12},34771,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>The district will implement a delayed start on Monday, January 26th, due to forecasted freezing temperatures that morning. Parents, please plan accordingly. As of this time, all after-school activities scheduled for Monday will proceed as planned.\u003C/p>\u003Cp>El distrito escolar implementará un horario de inicio de clases retrasado el lunes 26 de enero debido a las bajas temperaturas pronosticadas para esa mañana. Se les pide a los padres que tomen las medidas necesarias. Por el momento, todas las actividades extraescolares programadas para el lunes se llevarán a cabo según lo previsto.\u003C/p>",{"url":4870,"alt_text":4871,"asset_id":4872},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5637980/034d3808-32de-44f4-a87b-2782e0bdcab2.jpeg","The district will implement a delayed start on Monday, January 26th",5637980,{"id":4874,"secondary_organization_id":22,"secondary_organization_ids":4875,"content":4876,"image":4877,"status":6,"style":4653,"display_location":1435,"featured":12},35845,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>\u003Cstrong>Weather Update | Regular Schedule\u003C/strong>\u003C/p>\u003Cp>All Brownsville ISD campuses will resume their \u003Cstrong>regular class schedules\u003C/strong> on \u003Cstrong>Tuesday, January 27, 2026\u003C/strong>. Bus routes will operate as scheduled, and students and staff should report at their normal times.\u003C/p>\u003Cp>District administration will continue to closely monitor weather conditions and will provide updates should any changes be necessary to ensure the safety of students and staff.\u003C/p>\u003Cp>\u003C/p>\u003Cp>\u003Cstrong>Actualización del clima | Horario regular\u003C/strong>\u003C/p>\u003Cp>Todas las escuelas de Brownsville ISD reanudarán sus \u003Cstrong>horarios regulares\u003C/strong> el \u003Cstrong>martes, 27 de enero de 2026\u003C/strong>. Las rutas de autobús operarán con normalidad, y los estudiantes y el personal deberán presentarse en sus horarios habituales.\u003C/p>\u003Cp>La administración del Distrito continuará monitoreando de cerca las condiciones del clima y brindará actualizaciones si se requieren cambios para garantizar la seguridad de los estudiantes y el personal.\u003C/p>\u003Cp>\u003C/p>",{"url":4878,"alt_text":4879,"asset_id":4880},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5645102/fe767a87-0fe9-46e3-ac7b-239cce2dca46.jpeg","botg",5645102,{"id":4882,"secondary_organization_id":22,"secondary_organization_ids":4883,"content":4884,"image":4885,"status":6,"style":4653,"display_location":1435,"featured":12},38100,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>Attention BISD Community: There is school on Presidents' Day! Join us for a fun day of learning. \u003C/p>\u003Cp>Atención comunidad de BISD: ¡Hay clases el Día de los Presidentes! Únete a nosotros para un día divertido de aprendizaje.\u003C/p>",{"url":4886,"alt_text":4887,"asset_id":4888},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5722110/ca0caab0-19cf-4328-944d-d1ccc6ab2d55.png","Reminder",5722110,{"id":4890,"secondary_organization_id":22,"secondary_organization_ids":4891,"content":4892,"image":4893,"status":6,"style":4653,"display_location":1435,"featured":12},38182,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>🎉 \u003Cstrong>Charro Days 2026 – Early Dismissal Reminder!\u003C/strong> 🎉\u003C/p>\u003Cp>In celebration of Charro Days and the Children’s Parade, Brownsville ISD will follow an \u003Cstrong>early dismissal schedule on Thursday, February 26\u003C/strong>:\u003Cbr>🕚 Middle Schools – 11:45 a.m.\u003Cbr>🕛 Elementary Schools – 12:15 p.m.\u003Cbr>🕐 Early College High Schools – 1:00 p.m.\u003C/p>\u003Cp>The Children’s Parade begins at \u003Cstrong>2:30 p.m.\u003C/strong> featuring folkloric dances, colorful costumes, floats, and bands. The parade will be streamed LIVE on BISD’s Facebook page and KBSD’s Vimeo page.\u003C/p>\u003Cp>All district offices and campuses will be \u003Cstrong>closed Friday, February 27\u003C/strong>, with regular operations resuming Monday, March 2.\u003C/p>\u003Cp>Join us as we celebrate tradition, culture, and community! 🎊\u003C/p>\u003Cp>#CharroDays #BISDproud #ChildrensParade #CommunityCelebration #BrownsvilleISD\u003C/p>",{"url":4894,"alt_text":4895,"asset_id":4896},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5729632/9c35e1c5-3e62-4a3d-ab9c-13e31e202287.png","Charro Days",5729632,{"id":4898,"secondary_organization_id":22,"secondary_organization_ids":4899,"content":4900,"image":4901,"status":6,"style":4653,"display_location":1435,"featured":12},40997,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>🐰🌸 Easter Break Reminder! 🌸🐰\u003C/p>\u003Cp>Brownsville ISD campuses and offices will be closed on Friday, April 3, and Monday, April 6, 2026 in observance of Easter Break.\u003C/p>\u003Cp>We hope our BISD families enjoy a safe, restful, and joyful holiday weekend! 💐\u003C/p>\u003Cp>Classes and regular operations will resume on Tuesday, April 7.\u003C/p>\u003Cp>#BISD #BISDStrong #OneTeamOneDream\u003C/p>",{"url":4902,"alt_text":4903,"asset_id":4904},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5870365/e6cb5682-ab1e-4871-942e-43675317991a.png","Easter 2026",5870365,{"id":4906,"secondary_organization_id":22,"secondary_organization_ids":4907,"content":4908,"image":4909,"status":6,"style":4653,"display_location":1435,"featured":12},38801,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>🎉💃 Join Us for the 6th Annual Mini Fiesta! 💃🎉\u003C/p>\u003Cp>Celebrate Charro Days with us on Wednesday, February 25th at the BISD Administration Building Parking Lot! Enjoy vibrant performances by our talented BISD Fiesta Folklorica dancers representing El Jardin, Burns, Ortiz, Pullam, Benavides, Skinner, and Champion Elementary.\u003C/p>\u003Cp>Performances begin at 9:30 a.m. — come out and experience the music, culture, and tradition that make this celebration so special!\u003C/p>\u003Cp>#MiniFiesta #CharroDays2026 #BISDproud #CommunityCelebration #Folklorico\u003C/p>",{"url":4910,"alt_text":4911,"asset_id":4912},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5746583/2f323ca3-3a04-4334-bcb2-577530779547.png","Mini Fiesta English",5746583,{"id":4914,"secondary_organization_id":22,"secondary_organization_ids":4915,"content":4916,"image":4917,"status":6,"style":4653,"display_location":1435,"featured":12},38802,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>🎉💃 Fiesta Folklórica 2026 – Free Community Event! 💃🎉\u003C/p>\u003Cp>Brownsville ISD\u003C/p>\u003Cp>February 17, 2026\u003C/p>\u003Cp>Join us on Monday, February 23 at 6:30 p.m. at Sams Memorial Stadium for an evening filled with vibrant culture, music, and dance! Admission is FREE.\u003C/p>\u003Cp>Enjoy pre-show entertainment at 6:00 p.m. featuring Estudiantina groups from Lopez and Veterans Memorial ECHS, followed by spectacular folklórico performances by students from El Jardin, Burns, Ortiz, Pullam, Benavides, Skinner, and Champion Elementary.\u003C/p>\u003Cp>Come celebrate tradition and community with Brownsville ISD! In case of inclement weather, the event will be held Tuesday, February 24 at 6:00 p.m.\u003C/p>\u003Cp>#FiestaFolklorica #CharroDays2026 #BISDproud #CommunityCelebration #BrownsvilleISD\u003C/p>",{"url":4918,"alt_text":4919,"asset_id":4920},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5746589/de8053fb-a0ca-4173-98f3-40a5d8f41fdf.png","Fiesta Folklorica ",5746589,{"id":4922,"secondary_organization_id":22,"secondary_organization_ids":4923,"content":4924,"image":4925,"status":6,"style":4653,"display_location":1435,"featured":12},39652,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>Join Us for Open House at Brownsville ISD\u003Cbr>\u003Cbr>Hello BISD Families! Next week, all BISD campuses will host Open House events next week. It’s a perfect time to meet your child’s teacher and discover all the exciting things happening across our schools.\u003Cbr>\u003Cbr>We look forward to seeing you there!\u003Cbr>\u003Cbr>Acompáñenos a nuestro Open House del Distrito Escolar Independiente de Brownsville \u003Cbr>\u003Cbr>¡Hola, familias del BISD! La próxima semana, todas las escuelas del BISD tendrán sus puertas abiertas. Es el momento perfecto para conocer al maestro de su hijo/a y descubrir todas las actividades emocionantes que se llevan a cabo en nuestras escuelas.\u003Cbr>\u003Cbr>¡Esperamos verlos allí!\u003C/p>",{"url":4926,"alt_text":4831,"asset_id":4927},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5787781/3bcad3bb-3dc7-4a58-8070-36887712e392.png",5787781,{"id":4929,"secondary_organization_id":22,"secondary_organization_ids":4930,"content":4931,"image":4932,"status":6,"style":4653,"display_location":1435,"featured":12},39661,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>🌴 \u003Cstrong>Spring Break Reminder!\u003C/strong> ☀️\u003C/p>\u003Cp>All Brownsville ISD campuses and offices will be \u003Cstrong>closed March 16–20, 2026\u003C/strong> for Spring Break.\u003C/p>\u003Cp>Classes and regular district operations will \u003Cstrong>resume Monday, March 23, 2026.\u003C/strong>\u003C/p>\u003Cp>We wish all our BISD students, staff, and families a safe and enjoyable Spring Break! 🌊😎\u003C/p>\u003Cp>#BISDproud #SpringBreak #BrownsvilleISD\u003C/p>",{"url":4933,"alt_text":4934,"asset_id":4935},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5788078/61396949-a234-4018-88de-8245a78e823c.png","Spring Break",5788078,{"id":4937,"secondary_organization_id":22,"secondary_organization_ids":4938,"content":4939,"image":4940,"status":6,"style":4653,"display_location":1435,"featured":12},40883,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>☀️📚 \u003Cstrong>Summer School 2026 Applications Now Open!\u003C/strong>\u003C/p>\u003Cp>Brownsville ISD is now accepting applications for Summer School 2026! Don’t miss this opportunity to support student success and keep learning going all summer long.\u003C/p>\u003Cp>🗓️ \u003Cstrong>Apply March 25 – April 10, 2026\u003C/strong>\u003Cbr>💻 \u003Cstrong>Apply online:\u003C/strong> \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://brownsvilleisd.schoolspring.com/\">https://brownsvilleisd.schoolspring.com/\u003C/a>\u003C/p>\u003Cp>For more information, visit the Human Resources website.\u003C/p>\u003Cp>Start your summer strong with BISD! 🌴✏️\u003Cbr>#BISD #BISDproud #SummerSchool #OneTeamOneDream\u003C/p>",{"url":4941,"alt_text":4942,"asset_id":4943},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5856857/279772ce-6a9a-4865-b236-7b40889e7f55.jpeg","Summer School applications",5856857,{"id":4945,"secondary_organization_id":22,"secondary_organization_ids":4946,"content":4947,"image":4948,"status":6,"style":4653,"display_location":1435,"featured":12},41359,[22,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386],"\u003Cp>\u003C/p>\u003Cp>Brownsville ISD students in grades 3–8 and End of Course (EOC) will be taking the STAAR exams this April. Attendance is critical—please ensure students arrive on time, well-rested, and ready to do their best!\u003C/p>\u003Cp> Important Reminders:\u003C/p>\u003Cp>• No cell phones or electronic devices are allowed in testing areas\u003C/p>\u003Cp>• Students needing to retest will be notified by their campus\u003C/p>\u003Cp>Let’s support our students as they show what they’ve learned! \u003C/p>\u003Cp> For additional questions, please contact your student’s campus.\u003C/p>",{"url":4949,"alt_text":4950,"asset_id":4951},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5898490/20d4ca8f-a7f0-4578-a4a8-72ba043ce212.jpeg","STAAR 2026",5898490,{"id":4953,"secondary_organization_id":22,"secondary_organization_ids":4954,"content":4955,"image":4956,"status":6,"style":4653,"display_location":1435,"featured":12},41504,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp> You're invited!\u003C/p>\u003Cp>Join us for a Community Town Hall to share your insights and feedback regarding the characteristics and principles you seek in the next superintendent for Brownsville ISD.  \u003C/p>\u003Cp>This is your chance to have your voice heard and help shape the future of our schools!  \u003C/p>\u003Cp>Date: Monday, April 13th\u003Cbr>Time: 5:30 p.m.\u003Cbr>Location: BISD Boardroom \u003Cbr>\u003Cbr>We hope to see you there — your input matters! \u003C/p>\u003Cp> ¡Estás invitado!\u003Cbr>Acompáñanos en una asamblea comunitaria para compartir tus opiniones y aportar comentarios sobre las cualidades y principios que consideras importantes en el próximo superintendente de Brownsville ISD.\u003C/p>\u003Cp>¡Esta es tu oportunidad para hacer oír tu voz y ayudar a dar forma al futuro de nuestras escuelas!\u003C/p>\u003Cp>Fecha: Lunes, 13 de abril\u003Cbr>Hora: 5:30 p.m.\u003Cbr>Lugar: Sala de juntas del edificio administrativo de BISD \u003C/p>\u003Cp>¡Esperamos verte allí! Tu opinión es importante.\u003C/p>",{"url":4957,"alt_text":986,"asset_id":4958},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5913500/50dfaef5-159b-4c3c-b3f9-783cf2780361.jpeg",5913500,{"id":4960,"secondary_organization_id":22,"secondary_organization_ids":4961,"content":4962,"image":4963,"status":6,"style":4653,"display_location":1435,"featured":12},41552,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>📣 \u003Cstrong>Join Us!\u003C/strong>\u003C/p>\u003Cp>You’re invited to a special Meet &amp; Greet with our Interim Superintendent, Dr. Alda T. Benavides! Come meet her, share your ideas, and learn more about the future of our district.\u003C/p>\u003Cp>🎶 Enjoy student entertainment and light refreshments.\u003C/p>\u003Cp>🗓️ Friday, April 17, 2026\u003Cbr>🕘 \u003Cstrong>Time: 10:00 a.m. (Updated)\u003C/strong>\u003Cbr>📍 Buchanan Performing Arts Center at Hanna ECHS\u003C/p>\u003Cp>We look forward to seeing our families, staff, and community members there. Your voice matters!\u003C/p>\u003Cp>#BISD #OneTeamOneDream\u003C/p>\u003Chr>\u003Cp>📣\u003Cstrong> ¡Acompáñenos!\u003C/strong>\u003C/p>\u003Cp>¡Lo invitamos a un encuentro y bienvenida especial con nuestra Superintendente Interina, la Dra. Alda T. Benavides! Venga a conocerla, compartir sus ideas y conocer más sobre el futuro de nuestro distrito.\u003C/p>\u003Cp>🎶 Disfrute de entretenimiento estudiantil y refrigerios ligeros.\u003C/p>\u003Cp>🗓️ Viernes, 17 de abril de 2026\u003Cbr>🕘 \u003Cstrong>Hora: 10:00 a.m. (Actualizada)\u003C/strong>\u003Cbr>📍 Centro de Artes Escénicas Buchanan en Hanna ECHS\u003C/p>\u003Cp>Esperamos contar con la presencia de nuestras familias, personal y comunidad. ¡Su voz es importante!\u003C/p>\u003Cp>#BISD #OneTeamOneDream\u003C/p>",{"url":4964,"alt_text":4965,"asset_id":4966},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5919843/28ecfb97-0d36-4ab3-9ea8-091e2b6c99a5.jpeg","Meet and Greet",5919843,{"id":4968,"secondary_organization_id":22,"secondary_organization_ids":4969,"content":4970,"image":4971,"status":6,"style":4653,"display_location":1435,"featured":12},41622,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>\u003Cspan>Acompáñanos en una asamblea comunitaria para compartir tus opiniones y aportar comentarios sobre las cualidades y principios que consideras importantes en el próximo superintendente de Brownsville ISD.\u003C/span>\u003C/p>\u003Cp>\u003Cspan>¡Esta es tu oportunidad para hacer oír tu voz y ayudar a dar forma al futuro de nuestras escuelas!\u003C/span>\u003C/p>\u003Cp>\u003Cspan>Fecha: Miércoles, 15 de abril\u003C/span>\u003Cbr>\u003Cspan>Hora: 5:30 p.m.\u003C/span>\u003Cbr>\u003Cspan>Lugar: Sala de juntas del edificio administrativo de BISD&nbsp;\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>¡Esperamos verte allí! Tu opinión es importante.\u003C/span>\u003C/p>",{"url":4972,"alt_text":4973,"asset_id":4974},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5921514/488a4c40-463a-40db-b939-e905497f3912.jpeg","Spanish Town Hall",5921514,{"id":4976,"secondary_organization_id":22,"secondary_organization_ids":4977,"content":4978,"image":4979,"status":6,"style":4653,"display_location":1435,"featured":12},41801,[22],"\u003Cp>\u003Cspan>Last Chance to Make Your Voice Heard!&nbsp;\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Please join us for the final Community Townhall to share your insights and feedback on the qualities and principles you want in the next superintendent for Brownsville ISD.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Don’t miss this opportunity to help shape the future of our schools!\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>🗓️ Date: Monday, April 20, 2026\u003C/span>\u003Cbr>\u003Cspan>🕠Time: 5:30 p.m.\u003C/span>\u003Cbr>\u003Cspan>📍 Location: BISD Boardroom\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>We hope to see you there — your input truly matters!\u003C/span>\u003C/p>\u003Cp>\u003Cspan>&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan>&nbsp;\u003C/span>\u003C/p>",{"url":4980,"alt_text":4981,"asset_id":4982},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5937483/615b437c-5a68-4e70-94bc-6521d8c3fb38.jpeg","Town Hall 04-20-2026",5937483,{"id":4984,"secondary_organization_id":22,"secondary_organization_ids":4985,"content":4986,"image":4987,"status":6,"style":4653,"display_location":1435,"featured":12},41876,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>Update: 10:42 am\u003Cbr>\u003Cbr>Suspect apprehended. Investigation ongoing. Students are being released to parents on site. Please stay calm and follow instructions.\u003Cbr>\u003Cbr>Sospechoso detenido. La investigación sigue en curso. Estudiantes serán entregados a padres en el plantel. Manténganse atentos y seguros.\u003Cbr>\u003Cbr>------------\u003Cbr>\u003Cbr>Update: 9:57am\u003C/p>\u003Cp>The lockdown is still active. Please stay away from the area. Students and staff are safe. Thank you for your cooperation.\u003C/p>\u003Cp>El confinamiento sigue en curso. Por favor, manténganse alejados del área. Los estudiantes y el personal están seguros. Gracias por su cooperación.\u003C/p>\u003Cp>------------\u003C/p>\u003Cp>Rivera Early College HS is on lockdown. Law enforcement is on site. Students and staff are safe. More updates to follow.\u003C/p>\u003Cp>Rivera Early College HS está en cierre preventivo. Autoridades están en el lugar. Estudiantes y personal están seguros. Más información pronto.\u003C/p>",{"url":4988,"alt_text":4989,"asset_id":4990},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5945668/4626666b-b068-4ad9-8b4a-c39a4f2f0d2e.png","rivera",5945668,{"id":4992,"secondary_organization_id":22,"secondary_organization_ids":4993,"content":4994,"image":4995,"status":6,"style":4653,"display_location":1435,"featured":12},41890,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>\u003Cspan>⚠️ BISD Statement | A safety incident at Rivera ECHS this morning prompted a quick response from BISD Police and local law enforcement. The suspect is in custody. Students and staff are safe.\u003C/span>\u003C/p>",{"url":4996,"alt_text":4989,"asset_id":4997},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5946368/e965e0bb-6359-4855-a6ba-5d0451005bab.png",5946368,{"id":4999,"secondary_organization_id":22,"secondary_organization_ids":5000,"content":5001,"image":5002,"status":6,"style":4653,"display_location":1435,"featured":12},41893,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>⚠️ BISD Statement | A safety incident at Rivera ECHS this morning prompted a quick response from BISD Police and local law enforcement. The suspect is in custody. Students and staff are safe.\u003Cbr>\u003C/p>",{"url":5003,"alt_text":5004,"asset_id":5005},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5946479/66a8bd6f-5925-4c2e-9dee-2bef50584325.jpeg","Statement",5946479,{"id":5007,"secondary_organization_id":22,"secondary_organization_ids":5008,"content":5009,"image":5010,"status":6,"style":4653,"display_location":1435,"featured":12},41897,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>\u003Cspan>BISD Statement | A safety incident at Rivera ECHS this morning prompted a quick response from BISD Police and local law enforcement. The suspect is in custody. Students and staff are safe.\u003C/span>\u003C/p>",{"url":5011,"alt_text":5012,"asset_id":5013},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5946761/6f63bd2c-ae92-4030-bf2e-5e37093a9b66.jpeg","ENGL-span",5946761,{"id":5015,"secondary_organization_id":22,"secondary_organization_ids":5016,"content":5017,"image":5018,"status":6,"style":4653,"display_location":1435,"featured":12},41909,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>⚠️ Updated Statement\u003Cbr>\u003Cbr>Today, Brownsville ISD responded promptly to reports of a weapon on campus. It was later confirmed that the report was false. We appreciate the quick response of law enforcement and the vigilance of our community. Ensuring the safety of our students and staff remains our highest priority. Please remember to report only genuine safety concerns.\u003Cbr>\u003Cbr>Thank you, parents, for your patience and cooperation today. Please remember to follow our official district social media channels and website for accurate information.\u003Cbr>\u003Cbr>------\u003Cbr>\u003Cbr>⚠️ Declaración actualizada\u003Cbr>\u003Cbr>Hoy, el Distrito Escolar Independiente de Brownsville respondió rápidamente a informes de un arma en el campus. Más tarde se confirmó que el informe era falso. Agradecemos la pronta respuesta de las fuerzas del orden y la vigilancia de nuestra comunidad. Garantizar la seguridad de nuestros estudiantes y personal sigue siendo nuestra máxima prioridad. Por favor, recuerden denunciar solo preocupaciones de seguridad genuinas.\u003Cbr>\u003Cbr>Gracias, padres, por su paciencia y cooperación hoy. Por favor, recuerden seguir nuestras páginas oficiales en redes sociales y nuestro sitio web para obtener información precisa.\u003C/p>",{"url":5019,"alt_text":5020,"asset_id":5021},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5948735/075c0322-bb71-4250-a06b-5bc9caf041b6.jpeg","Update ENGL - SPAN",5948735,{"id":5023,"secondary_organization_id":22,"secondary_organization_ids":5024,"content":5025,"image":5026,"status":6,"style":4653,"display_location":1435,"featured":12},41955,[22],"\u003Cp>The Employee Transfer Period will be open Wednesday, April 22 through Friday, May 1. Please see the 2026–2027 Employee Transfer Guidelines for more information.\u003Cbr>\u003Cbr>Employees interested&nbsp;may click on the link below and click on the Internal Jobs tab and sign in.\u003Cbr>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://nam11.safelinks.protection.outlook.com/?url=https%3A%2F%2Fbrownsvilleisd.schoolspring.com%2F&amp;data=05%7C02%7Cjdclaudio%40bisd.us%7Cfe9b4b0cde5d4790123808dea0bab934%7C057e699a55b94c46aab90300abe8c7d1%7C1%7C0%7C639124921082261983%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=%2BLiaqW81cvCyRItLti9JayAsBESe5z4V%2B5iRRM8%2FBU0%3D&amp;reserved=0\">\u003Cstrong>\u003Cem>BISD Application\u003C/em>\u003C/strong>\u003C/a>\u003Cbr>\u003Cbr>Or visit the BISD website, select the “Join Our Team” tab, click “Apply with BISD,” then “Begin a New Application,” sign in to Internal Jobs, and select the 2026–2027 Transfer Application for Certified/Classified Employees.\u003C/p>\u003Cp>If you need additional information, please call our office for assistance.\u003C/p>\u003Cp>Thank you,\u003Cbr>Human Resources Department\u003Cbr>\u003Cbr>\u003Cstrong>2026-2027 Employee Transfers Flyer\u003C/strong>\u003Cbr>\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://aptg.co/tj1jNf\">English \u003C/a>| \u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://aptg.co/1C57Tk\">Spanish\u003C/a>\u003Cbr>\u003Cbr>\u003Cstrong>2026-2027 Employee Transfers Guidelines\u003C/strong>\u003Cbr>\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://aptg.co/r81VH6\">English \u003C/a>| \u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://aptg.co/Cr8zCm\">Spanish\u003C/a>\u003Cbr>\u003C/p>",{"url":5027,"alt_text":5028,"asset_id":5029},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5952903/09804c1e-8550-4e3b-a710-2b738dc94d15.jpeg","2026-2027 Employee Transfers ",5952903,{"id":5031,"secondary_organization_id":22,"secondary_organization_ids":5032,"content":5033,"image":5034,"status":4667,"style":4653,"display_location":1435,"featured":12},42128,[22],"\u003Cp>\u003Cspan>Elementary/Middle School online Inter-District transfers (Outside of BISD boundaries) are now available for the 2026-2027 school year. Be a part of the Best Choice and enroll today.....\u003C/span>\u003Cbr>\u003Cbr>\u003Cbr>\u003Cbr>\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://apps.docusign.com/webforms/us/4a8225e8ff9fb0c7a7372fb1f316344f\">Inter-District (Outside District) Transfer&nbsp;\u003C/a>\u003C/p>\u003Cp>\u003C/p>",{"url":5035,"alt_text":5036,"asset_id":5037},"https://cmsv2-assets.apptegy.net/uploads/28658/file/5969924/95abc2ba-328a-4aa4-a33a-a168b67a4fbe.jpeg","inter",5969924,{"id":5039,"secondary_organization_id":22,"secondary_organization_ids":5040,"content":5041,"image":5042,"status":6,"style":4653,"display_location":1435,"featured":12},42241,[22],"\u003Cp>\u003Cspan>🚨 Reminder! The Last Day for Intra-District Transfers is Almost Here! 🚨\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Monday, August 3, 2026, is the final day to submit your Intra-District Transfer request for the 2026–2027 school year.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Families interested in transferring to another Brownsville ISD campus should submit their request before the deadline. Inter-District Transfers are currently available.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>For more information or to begin the transfer process, visit the Brownsville ISD website or contact your child's campus.\u003C/span>\u003Cbr>\u003C/p>\u003Cp>\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://www.bisd.us/page/intra-district-interdistrict-transfers\">Or visit bisd.us/Pupil Services.\u003C/a>\u003C/p>\u003Cp>\u003C/p>\u003Cp>#BISD #TheBestChoice #20262027SchoolYear.\u003C/p>\u003Cp>\u003C/p>",{"url":5043,"alt_text":4665,"asset_id":5044},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6294850/c8e188b1-be11-4e52-abec-51052c6a5172.jpeg",6294850,{"id":5046,"secondary_organization_id":22,"secondary_organization_ids":5047,"content":5048,"image":5049,"status":6,"style":4653,"display_location":4681,"featured":12},42535,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp> Join us for Evening Registration!\u003C/p>\u003Cp>Brownsville ISD invites families to enroll for the 2026–2027 school year for students in Pre-K 3 through 5th grade. Come visit one of our elementary campuses during Evening Registration and learn more about the opportunities available for your child.\u003C/p>\u003Cp>Our team is ready to welcome you and help you every step of the way — we look forward to meeting you!\u003C/p>\u003Cp> Check the schedule on the flyer for campus dates and times\u003C/p>\u003Cp> Don’t forget to bring required documents\u003C/p>\u003Cp>Discover why BISD is The Best Choice!\u003C/p>\u003Cp> ¡Acompáñenos a la Inscripción por la Tarde!\u003Cbr>\u003Cbr>---------------------\u003C/p>\u003Cp>Brownsville ISD invita a las familias a inscribir a sus estudiantes para el año escolar 2026–2027, desde Pre-K 3 hasta 5.º grado. Visite una de nuestras escuelas primarias durante la inscripción por la tarde y conozca las oportunidades disponibles para su hijo(a).\u003C/p>\u003Cp>Nuestro equipo está listo para darle la bienvenida y apoyarle en cada paso — ¡esperamos conocerle!\u003C/p>\u003Cp> Consulte el volante para fechas y horarios por escuela\u003C/p>\u003Cp> No olvide traer los documentos requeridos\u003C/p>\u003Cp>Descubra por qué BISD es la mejor opción.\u003C/p>",{"url":5050,"alt_text":5051,"asset_id":5052},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6014899/09104b70-5e3f-4d52-8525-25e0c14b8794.jpeg","reg",6014899,{"id":5054,"secondary_organization_id":22,"secondary_organization_ids":5055,"content":5056,"image":5057,"status":6,"style":4653,"display_location":1435,"featured":12},43050,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp> In observance of Memorial Day, all Brownsville ISD campuses and offices will be closed on Monday, May 25, 2026.\u003C/p>\u003Cp>As we enjoy the holiday weekend, we honor and remember the brave men and women who made the ultimate sacrifice while serving our country.\u003C/p>\u003Cp>District operations will resume on Tuesday, May 26, 2026.\u003C/p>",{"url":5058,"alt_text":5059,"asset_id":5060},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6056312/8a1356ee-fa7d-4f86-bdf6-2d0a5bee21d8.png","memorial",6056312,{"id":5062,"secondary_organization_id":22,"secondary_organization_ids":5063,"content":5064,"image":5065,"status":6,"style":4653,"display_location":1435,"featured":12},43476,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp> Brownsville Independent School District Announces Sponsorship of the Seamless Summer Option Program \u003C/p>\u003Cp>Brownsville ISD is proud to sponsor the Seamless Summer Option (SSO) meal program for Summer 2026!\u003C/p>\u003Cp> FREE meals will be available to:\u003C/p>\u003Cul>\u003Cli>\u003Cp>All children 18 years of age and younger\u003C/p>\u003Cp>\u003C/p>\u003C/li>\u003Cli>\u003Cp>Enrolled students with disabilities up to 21 years of age\u003C/p>\u003C/li>\u003C/ul>\u003Cp> Important Notes:\u003Cbr>Children must be present to receive a meal\u003Cbr>All meals must be consumed onsite\u003C/p>\u003Cp>No registration or ID is required. Join us in making this summer healthy, safe, and hunger-free for all children in our community!\u003C/p>\u003Cp>Meal service kicks off soon! Check back for the latest details on locations and serving times.\u003C/p>",{"url":5066,"alt_text":5067,"asset_id":5068},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6215758/e28fc2b0-ee28-4bfc-928c-0a19124fc33c.jpeg","food",6215758,{"id":5070,"secondary_organization_id":22,"secondary_organization_ids":5071,"content":5072,"image":5073,"status":6,"style":4653,"display_location":4681,"featured":12},44026,[22],"\u003Cp> Summer School Weather Update\u003C/p>\u003Cp>Due to anticipated weather conditions, all Brownsville ISD summer school classes for Tuesday, June 16, 2026, have been canceled for students and staff.\u003C/p>\u003Cp>Summer school classes will resume on Wednesday, June 17, 2026, with a delayed start schedule. Additional information regarding start times will be shared with families and staff as it becomes available.\u003C/p>\u003Cp>Please continue to monitor official Brownsville ISD communication channels for updates.\u003C/p>\u003Cp>Stay safe and take all necessary precautions during inclement weather.\u003C/p>\u003Cp>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"x1i10hfl xjbqb8w x1ejq31n x18oe1m7 x1sy0etr xstzfhl x972fbf x10w94by x1qhh985 x14e42zd x9f619 x1ypdohk xt0psk2 x3ct3a4 xdj266r x14z9mp xat24cr x1lziwak xexx8yu xyri2b x18d9i69 x1c1uobl x16tdsg8 x1hl2dhg xggy1nq x1a2a7pz xkrqix3 x1sur9pj x1fey0fg x1s688f\" href=\"https://www.facebook.com/hashtag/bisd?__cft__[0]=AZaeQsVbb0bgtkC4DW9_EX4gxtJ8JBPvZZPl7Ndt2RsMGDxxDJ9vkNP7qqSSiSEce1Ai0-49dKVdC3NohHCHbMhWbwyHbe39pHK1SIgatk-2tT_6UcSkqMRqn30oIJGH07fXD7bjbmIDZaF50MsNVb_KjDiXXuvo0DbPxQcvpj8tIYHQ_RJ4Da4iaq8TiKNuklE&amp;__tn__=*NK-R\">\u003Cspan>\u003Cstrong>#BISD\u003C/strong>\u003C/span>\u003C/a> \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"x1i10hfl xjbqb8w x1ejq31n x18oe1m7 x1sy0etr xstzfhl x972fbf x10w94by x1qhh985 x14e42zd x9f619 x1ypdohk xt0psk2 x3ct3a4 xdj266r x14z9mp xat24cr x1lziwak xexx8yu xyri2b x18d9i69 x1c1uobl x16tdsg8 x1hl2dhg xggy1nq x1a2a7pz xkrqix3 x1sur9pj x1fey0fg x1s688f\" href=\"https://www.facebook.com/hashtag/weatherupdate?__cft__[0]=AZaeQsVbb0bgtkC4DW9_EX4gxtJ8JBPvZZPl7Ndt2RsMGDxxDJ9vkNP7qqSSiSEce1Ai0-49dKVdC3NohHCHbMhWbwyHbe39pHK1SIgatk-2tT_6UcSkqMRqn30oIJGH07fXD7bjbmIDZaF50MsNVb_KjDiXXuvo0DbPxQcvpj8tIYHQ_RJ4Da4iaq8TiKNuklE&amp;__tn__=*NK-R\">\u003Cspan>\u003Cstrong>#WeatherUpdate\u003C/strong>\u003C/span>\u003C/a> \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"x1i10hfl xjbqb8w x1ejq31n x18oe1m7 x1sy0etr xstzfhl x972fbf x10w94by x1qhh985 x14e42zd x9f619 x1ypdohk xt0psk2 x3ct3a4 xdj266r x14z9mp xat24cr x1lziwak xexx8yu xyri2b x18d9i69 x1c1uobl x16tdsg8 x1hl2dhg xggy1nq x1a2a7pz xkrqix3 x1sur9pj x1fey0fg x1s688f\" href=\"https://www.facebook.com/hashtag/summerschool?__cft__[0]=AZaeQsVbb0bgtkC4DW9_EX4gxtJ8JBPvZZPl7Ndt2RsMGDxxDJ9vkNP7qqSSiSEce1Ai0-49dKVdC3NohHCHbMhWbwyHbe39pHK1SIgatk-2tT_6UcSkqMRqn30oIJGH07fXD7bjbmIDZaF50MsNVb_KjDiXXuvo0DbPxQcvpj8tIYHQ_RJ4Da4iaq8TiKNuklE&amp;__tn__=*NK-R\">\u003Cspan>\u003Cstrong>#SummerSchool\u003C/strong>\u003C/span>\u003C/a> \u003C/p>",{"url":5074,"alt_text":5075,"asset_id":5076},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6162974/063f622b-7bc1-4795-989d-9b4c32bbee89.jpeg","canceled",6162974,{"id":5078,"secondary_organization_id":22,"secondary_organization_ids":5079,"content":5080,"image":5081,"status":6,"style":4653,"display_location":1435,"featured":12},44056,[22],"\u003Cp> Summer School Start Times Delayed – June 17, 2026 \u003Cbr>\u003Cbr>Due to weather conditions, Summer School will begin later than normal on Wednesday, June 17.\u003C/p>\u003Cp> Drop-Off at Home Campus\u003Cbr>• Elementary: 9:15 AM\u003Cbr>• Secondary: 9:45 AM\u003C/p>\u003Cp> Summer School Start Times\u003Cbr>• Elementary: 10:00 AM\u003Cbr>• Secondary: 10:30 AM\u003C/p>\u003Cp>Thank you for your patience as we prioritize the safety of our students and staff.  \u003C/p>",{"url":5082,"alt_text":5083,"asset_id":5084},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6162879/54f48e3a-f83c-4cfe-98b9-ba0221f6a08b.jpeg","summer school delayed times",6162879,{"id":5086,"secondary_organization_id":22,"secondary_organization_ids":5087,"content":5088,"image":5089,"status":6,"style":4653,"display_location":4681,"featured":12},44057,[22],"\u003Cp> Rescheduled Regular Board Meeting\u003C/p>\u003Cp>The Brownsville ISD Regular Board Meeting originally scheduled for Tuesday, June 16, 2026, has been rescheduled.\u003C/p>\u003Cp>Wednesday, June 24, 2026\u003Cbr>5:30 PM\u003C/p>\u003Cp>Community members can watch the meeting live on the Brownsville ISD Facebook page and the KBSD-ITV Vimeo channel.\u003C/p>\u003Cp>Thank you for your continued support and engagement in Brownsville ISD. \u003C/p>",{"url":5090,"alt_text":5091,"asset_id":5092},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6162951/17886a3c-fe4a-4716-8fd2-adf3d219468d.jpeg","board meeting",6162951,{"id":5094,"secondary_organization_id":22,"secondary_organization_ids":5095,"content":5096,"image":5097,"status":6,"style":4653,"display_location":1435,"featured":12},44421,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>📢 Holiday Work Schedule Notice\u003C/p>\u003Cp>Brownsville ISD will observe the following work schedule in recognition of the Independence Day holiday:\u003C/p>\u003Cp>🗓️ \u003Cstrong>Monday, June 29 – Thursday, July 2\u003C/strong>\u003Cbr>⏰ \u003Cstrong>8:00 a.m. – 5:00 p.m.\u003C/strong>\u003C/p>\u003Cp>🚫 \u003Cstrong>All district offices will be closed on Friday, July 3.\u003C/strong>\u003C/p>\u003Cp>The summer work schedule will resume \u003Cstrong>Monday, July 6, through Friday, July 24, 2026.\u003C/strong>\u003C/p>\u003Cp>We wish everyone a safe and happy Independence Day!\u003C/p>\u003Cp>#BISD #HolidaySchedule #IndependenceDay\u003C/p>",{"url":5098,"alt_text":5099,"asset_id":5100},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6196127/d2b7b160-6b07-4a1f-8065-425b3343df57.png","4th of July",6196127,{"id":5102,"secondary_organization_id":22,"secondary_organization_ids":5103,"content":5104,"image":5105,"status":6,"style":4653,"display_location":1435,"featured":12},45030,[22],"\u003Cp>\u003Cspan>🚔 Community Notice: Please note: This training exercise is not open to the public.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>On Tuesday, July 14, from 7:00 a.m. to 12:00 p.m., the Brownsville ISD Police &amp; Security Services Department will conduct a full-scale training exercise at Hanna Early College High School.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Community members may notice increased police activity in the area. Please do not be alarmed—this is only a training exercise. There is no emergency or threat to the community.\u003C/span>\u003Cbr>\u003Cbr>\u003Cbr>\u003Cbr>\u003Cspan>🚔 Aviso a la Comunidad: Importante: Este ejercicio de entrenamiento no está abierto al público.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>El martes 14 de julio, de 7:00 a.m. a 12:00 p.m., el Departamento de Policía y Servicios de Seguridad de Brownsville ISD llevará a cabo un ejercicio de entrenamiento a gran escala en Hanna Early College High School.\u003C/span>\u003Cbr>\u003Cbr>\u003Cspan>Habrá una mayor presencia policial en el área. No se alarme; se trata únicamente de un ejercicio de entrenamiento. No existe ninguna emergencia ni amenaza para la comunidad.\u003C/span>\u003Cbr>\u003Cbr>\u003Cbr>\u003Cbr>\u003Cspan>#BISD #SafetyFirst\u003C/span>\u003C/p>",{"url":5106,"alt_text":5107,"asset_id":5108},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6244422/26bde41c-b2d6-48e3-8cd0-a9efbc2a7b0d.jpeg","alert",6244422,{"id":5110,"secondary_organization_id":22,"secondary_organization_ids":5111,"content":5112,"image":5113,"status":6,"style":4653,"display_location":1435,"featured":12},45340,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>📚 \u003Cstrong>Meet the Teacher is Almost Here!\u003C/strong>\u003C/p>\u003Cp>Get ready to kick off the 2026–2027 school year by meeting your teachers before the first day of classes on \u003Cstrong>August 10\u003C/strong>!\u003C/p>\u003Cp>\u003Cstrong>Meet the Teacher Schedule:\u003C/strong>\u003Cbr>📍 \u003Cstrong>Early College High Schools:\u003C/strong> Wednesday, August 5 | 5:30–7:00 p.m.\u003Cbr>📍 \u003Cstrong>Elementary Schools:\u003C/strong> Thursday, August 6 | 5:30–7:00 p.m.\u003Cbr>📍 \u003Cstrong>Middle Schools:\u003C/strong> Friday, August 7 | 5:30–7:00 p.m.\u003C/p>\u003Cp>We can't wait to welcome our students and families back for another exciting year of learning. See you there!\u003C/p>\u003Cp>#BISD #BackToSchool #MeetTheTeacher\u003C/p>",{"url":5114,"alt_text":5115,"asset_id":5116},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6266393/5d8cbdb0-1285-4aca-886f-2990a46f0151.jpeg","Meet the Teacher",6266393,{"id":5118,"secondary_organization_id":22,"secondary_organization_ids":5119,"content":5120,"image":5121,"status":6,"style":4653,"display_location":1435,"featured":12},45414,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>Join Brownsville ISD for our \u003Cstrong>Back to School Fair\u003C/strong> on \u003Cstrong>Saturday, August 8\u003C/strong>, from \u003Cstrong>8:00–11:00 a.m.\u003C/strong> at the \u003Cstrong>Central Administrative Building (708 Palm Blvd.)\u003C/strong>.\u003C/p>\u003Cp>BISD students can receive \u003Cstrong>FREE\u003C/strong> backpacks (while supplies last), school supplies, haircuts, immunizations, dental screenings, and connect with local community organizations—all at no cost.\u003C/p>\u003Cp>\u003Cstrong>This event is for BISD students only.\u003C/strong>\u003C/p>\u003Cp>#IAmBISD #BackToSchool #BISD\u003C/p>",{"url":5122,"alt_text":5123,"asset_id":5124},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6271212/d63fe6aa-e73a-4c8b-9cda-dc6d8fff5664.jpeg","back to school fair",6271212,{"id":5126,"secondary_organization_id":22,"secondary_organization_ids":5127,"content":5128,"image":5129,"status":1538,"style":4653,"display_location":1435,"featured":12},45453,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>We're Hiring Librarians!\u003C/p>\u003Cp>Join the Brownsville ISD team and inspire a lifelong love of reading while making a difference in the lives of students every day.\u003C/p>\u003Cp>Applicants should have:\u003C/p>\u003Cp>• Resume\u003Cbr>• Master's degree or higher\u003Cbr>• Valid Texas Teacher Certification\u003Cbr>• Minimum of two years of teaching experience\u003Cbr>• School Librarian Certification\u003C/p>\u003Cp>Scan the QR code on the flyer to apply today and become part of The Best Choice.\u003C/p>\u003Cp>\u003Cbr>\u003C/p>",{"url":5130,"alt_text":5131,"asset_id":5132},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6276215/43e06778-4389-45a8-8f93-ada7c672421f.jpeg","librarians",6276215,{"id":5134,"secondary_organization_id":22,"secondary_organization_ids":5135,"content":5136,"image":5137,"status":6,"style":4653,"display_location":1435,"featured":12},45643,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>🚨 Reminder! The Last Day for Intra-District Transfers is Almost Here! 🚨\u003Cbr>\u003Cbr>Monday, August 3, 2026, is the final day to submit your Intra-District Transfer request for the 2026–2027 school year.\u003Cbr>\u003Cbr>Families interested in transferring to another Brownsville ISD campus should submit their request before the deadline. Inter-District Transfers are currently available.\u003Cbr>\u003Cbr>For more information or to begin the transfer process, visit the Brownsville ISD website or contact your child's campus.\u003C/p>\u003Cp>\u003Ca target=\"_self\" rel=\"noopener noreferrer nofollow\" href=\"https://www.bisd.us/page/intra-district-interdistrict-transfers\">Or visit bisd.us/Pupil Services.\u003C/a>\u003C/p>\u003Cp>\u003C/p>\u003Cp>#BISD #TheBestChoice #20262027SchoolYear.\u003C/p>\u003Cp>\u003C/p>",{"url":5138,"alt_text":4665,"asset_id":5139},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6294875/a141f05a-f06d-4c55-8a06-8349efacaed6.jpeg",6294875,{"id":5141,"secondary_organization_id":22,"secondary_organization_ids":5142,"content":5143,"image":5144,"status":6,"style":4653,"display_location":1435,"featured":12},46293,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,236,242,248,254,260,266,272,278,284,290,296,302,308,314,320,326,332,338,344,350,356,362,368,374,380,386,392],"\u003Cp>📢 \u003Cstrong>We’re Hiring!\u003C/strong>\u003C/p>\u003Cp>Brownsville ISD’s Advanced Academics Department is seeking a \u003Cstrong>Lead Teacher\u003C/strong>! If you’re passionate about supporting gifted and talented students, we encourage you to apply.\u003C/p>\u003Cp>Scan the QR code for more information.\u003C/p>\u003Cp>#BISD #NowHiring #TheBestChoice\u003C/p>",{"url":5145,"alt_text":5146,"asset_id":5147},"https://cmsv2-assets.apptegy.net/uploads/28658/file/6360118/2e7b96da-9c33-428d-8d31-00b4b548cc0b.jpeg","image",6360118,{"id":5149,"secondary_organization_id":22,"secondary_organization_ids":5150,"content":5151,"image":5152,"status":6,"style":4653,"dis
