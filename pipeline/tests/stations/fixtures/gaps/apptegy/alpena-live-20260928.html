48,11.5,11,11,0,0,0,44.5,3.4Z' transform='translate(0 -0.03)'/>\u003Cpath d='M24.9,37.3,19,43.2a10.34,10.34,0,0,1-14.1,0A9.55,9.55,0,0,1,2,36.4a9.22,9.22,0,0,1,2.9-6.8L13.8,21a10.14,10.14,0,0,1,14.1,0,16.8,16.8,0,0,1,2.3,2.7,1,1,0,1,0,1.6-1.2,19.39,19.39,0,0,0-2.5-2.9,12.17,12.17,0,0,0-16.9,0L3.5,28.2A10.88,10.88,0,0,0,0,36.4a12,12,0,0,0,3.5,8.3A12.22,12.22,0,0,0,11.9,48a12.46,12.46,0,0,0,8.5-3.3l5.9-5.9a1,1,0,0,0-1.4-1.5Z' transform='translate(0 -0.03)'/>\u003C/svg>","Link","Survey Link",305,{"href":795,"icon":784,"name":785,"title":796,"target":747,"icon_id":787,"top_title":79},"https://youtu.be/kGiiXlpL5Ak","Community presentation  11/2025",{"href":798,"icon":778,"name":779,"title":799,"target":747,"icon_id":781,"top_title":79},"https://drive.google.com/file/d/11RpRdC7Bc9prDaKFAPsP18FYgwIh9kNa/view","Shaping the Future of APS",{"href":801,"icon":784,"name":785,"title":802,"target":747,"icon_id":787,"top_title":79},"https://youtu.be/bDBpR06aqNI","Community Engagement 3/26","\u003Cp>Alpena Public Schools partnership with Kingscott Associates began in May of 2025. Since then, we have hosted community forums to launch our \"Reimagine Our Future: Together\" initiative—a proactive effort to address 50-year enrollment trends, aging infrastructure, and the operational challenges of our 604-square-mile district.\u003Cbr>APS and Kingscott Associates held initial sessions on November 17th and 19th to present draft scenarios regarding grade configurations and building usage. We continued this vital work at a second forum on March 24th, where we reviewed community feedback from the first sessions, adjusted our scenario planning in response, and held interactive discussions on how to approach potential difficult decisions in the years ahead.\u003Cbr>The community is reminded that these scenarios are conceptual conversation starters, not final plans. Your voice remains the most critical part of this process. If you were unable to attend, please watch the recording of the forum(s) linked to the right and use the QR code to complete our feedback survey. Your insights are essential as we take the time to build a sustainable future for our schools together.\u003C/p>","Reimagine our Future Together",{"6cc1ecac-03f9-48a8-9e0c-136be1d36269_0":806},{"content":807,"snippet":12,"bg_image":808,"headline":12,"alignment":810,"show_links":12,"stats_header":765,"component_header":813,"show_description":12,"show_icons_or_images":12,"component_description":79},[],{"url":809,"alt_text":765},"https://cmsv2-assets.apptegy.net/uploads/27056/file/5087010/13561c70-c079-4a55-a7ca-342f07e5402b.png",{"name":811,"value":812},"Left","left","Any day now, the state of Michigan will release assessment results for the MSTEP and SAT. News headlines will highlight the percentage of students who are “proficient” in each grade and subject. While these numbers often draw quick judgments about schools and districts, it is important to remember that they reflect only a fraction of a much bigger story.  State assessments are valuable tools that show how well students have mastered specific content at a point in time. But a single test score does not capture everything we know about student learning or school quality. Many factors play a role, some outside the district’s control, like whether a student was rested or engaged on test day, and others within our control, like the quality of daily instruction and how we respond to ongoing classroom assessments. True student growth and achievement are best measured through a combination of evidence over time, not just one test session.  Ultimately, the purpose of K–12 education is to prepare students for success after graduation, whether in college, career, military, or the trades. One test score does not define a student’s potential, nor does it fully reflect the strength of our schools.  APS will be sharing a more in-depth look at student achievement data at our September Board of Education workshop. We invite all who want a deeper understanding of what these results mean to join us.  Thank you for supporting our students and schools as we continue to focus on what matters most—their growth, their learning, and their future success.",{"f4d47477-d11f-4c1a-a3fb-6f0c08c4883e_0":815},{"videos":816,"headline":819,"show_headline":7},[817],{"url":79,"uuid":818,"title":79,"alt_text":79,"position":310,"thumbnail":79,"description":79},"f4d47477-d11f-4c1a-a3fb-6f0c08c4883e_0","APS Bond Work Video Fall 2025",{"meta":821,"events":838,"sectionIds":1118,"display_tags":7,"customSections":1120,"background_image":1123,"a54d9126-6673-4052-ad75-353fd09a0bda_0":1124},{"links":822,"filters":826,"sections":833,"last_static_update":837},{"last":823,"next":823,"first":824,"total_entries":825},"https://thrillshare.com/api/v4/o/27056/cms/events?locale=en&page_no=2","https://thrillshare.com/api/v4/o/27056/cms/events?locale=en&page_no=1",28,[827],{"id":828,"name":829,"color":8,"position":830,"created_at":831,"updated_at":831,"custom_section_id":832,"custom_section_name":297,"parent_organization_id":25,"secondary_organization_id":22},547991,"Board of Education",2,"2025-02-12T11:45:07.757-05:00",457116,[834],{"id":832,"url":835,"name":297,"slug":836},"https://thrillshare.com/api/v4/o/27056/cms/events?slug=events-aps-alpenapublicschoolsmi","events-aps-alpenapublicschoolsmi","2026-07-09T14:33:03Z",[839,858,872,886,900,914,927,942,957,970,984,999,1012,1025,1037,1052,1064,1078,1092,1106],{"id":840,"day":841,"end":842,"zip":79,"time":843,"year":844,"month":845,"start":846,"state":79,"title":847,"venue":125,"end_at":848,"address":125,"all_day":7,"latitude":849,"start_at":850,"longitude":851,"recurrent":7,"city_state":79,"recurrency":8,"description":79,"filter_name":852,"filter_color":853,"formatted_end":854,"formatted_date":855,"formatted_start":856,"custom_section_id":832,"cms_formatted_date":857,"custom_section_name":297},59248016,"13","Jul 13 at  7:30 PM"," 5:30 PM","2026","JUL","Jul 13 at  5:30 PM","BOE Workshop Meeting","202
