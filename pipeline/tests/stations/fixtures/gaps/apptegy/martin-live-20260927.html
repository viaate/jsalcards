d":2455,"searchUUID":2456,"sessionId":2457},["Ref",2453],["Reactive",2454],{"ai_chat_enabled":7,"ai_search_enabled":7,"tasks_enabled":7,"display_ai_chat":7},["Ref",2434],["EmptyRef",20],["EmptyRef",20],{"alertBannerConfig":2459,"alertBannerSeparate":2463,"isAlertModalOpen":2509},["Ref",2460],["Reactive",2461],{"content":2462,"enabled":7,"light_box":12,"display_on_all_pages":7},"\u003Cp style=\"text-align: center\">\u003C/p>\u003Cp>\u003Cstrong>Access free breakfasts and lunches for children aged 0- 18\u003C/strong>: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.martinschools.org/page/summer-food-service-program\">https://www.martinschools.org/page/summer-food-service-program\u003C/a>.\u003C/p>",["Ref",2464],["Reactive",2465],[2466,2474,2479,2485,2493,2498,2504],{"id":2467,"secondary_organization_id":22,"secondary_organization_ids":2468,"content":2469,"image":2470,"status":2471,"style":2472,"display_location":2473,"featured":12},12492,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230],"\u003Cp style=\"text-align: center\">\u003C/p>\u003Cp>\u003Cstrong>🌀HURRICANE MILTON UPDATE:\u003C/strong>\u003C/p>\u003Cul>\u003Cli>\u003Cp>\u003Cstrong>All MCSD-operated schools and offices will be closed Wednesday, October 9 - Friday, October 11. \u003C/strong>\u003Cbr>\u003C/p>\u003C/li>\u003Cli>\u003Cp>\u003Cstrong> Classes will resume Monday, October 14\u003C/strong>. \u003C/p>\u003C/li>\u003C/ul>",{},"draft","banner","homepage",{"id":2475,"secondary_organization_id":22,"secondary_organization_ids":2476,"content":2477,"image":2478,"status":6,"style":2472,"display_location":2473,"featured":12},18987,[22,86,92,98,116,128,140,146,170,176,182,194,224,104,122,134,152,158,164,188,200,206,218,230],"\u003Cp>🍎 IMPORTANT DATES🍎\u003C/p>\u003Cp>\u003Cstrong>✅All families - regardless of which county they live in - wishing to enroll their child in the Martin County School District\u003C/strong> for the 2025-2026 school year can apply now! Full details on our enrollment process are available here: \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.martinschools.org/article/2051617\">https://www.martinschools.org/article/2051617\u003C/a>.\u003C/p>",{"url":79,"alt_text":79},{"id":2480,"secondary_organization_id":22,"secondary_organization_ids":2481,"content":2482,"image":2483,"status":6,"style":2484,"display_location":2473,"featured":12},26029,[22,86,92,98,104,116,122,128,134,140,146,152,158,164,170,176,182,194,200,218,224],"\u003Cp>🎒🍎📖✏️\u003Cstrong> Attention Martin County Partners in Education: \u003C/strong>\u003Cbr>\u003Cbr>\u003Cstrong>MCSD has been rated an \"🅰️\" district by the Florida Department of Education for the 2024-2025 school year! \u003C/strong>\u003Cbr>\u003Cbr>\u003Cstrong>Read more:  \u003C/strong>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.martinschools.org/article/2298959\">\u003Cstrong>https://www.martinschools.org/article/2298959\u003C/strong>\u003C/a>\u003Cstrong> \u003C/strong>\u003C/p>",{"url":79,"alt_text":79},"light_box",{"id":2486,"secondary_organization_id":22,"secondary_organization_ids":2487,"content":2488,"image":2489,"status":6,"style":2484,"display_location":2473,"featured":12},26045,[22,86,92,98,116,128,140,146,170,176,182,194,224],"\u003Cp>Families: Summer is an ideal time to develop water safety skills. Please \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://core-docs.s3.us-east-1.amazonaws.com/documents/asset/uploaded_file/2252/MCSD/2723720/Every_Child_s_a_swimmer__2_.pdf\">click here\u003C/a> for a list of community resources available.\u003C/p>",{"url":2490,"alt_text":2491,"asset_id":2492},"https://cmsv2-assets.apptegy.net/uploads/7434/file/4758784/14afe671-1694-4e3e-881a-070666357969.png","Swim Resources",4758784,{"id":2494,"secondary_organization_id":22,"secondary_organization_ids":2495,"content":2496,"image":2497,"status":6,"style":2484,"display_location":2473,"featured":12},41896,[22],"\u003Cp>In Regard to the Incident at Jensen Beach High School\u003C/p>\u003Cp>UPDATE: 4/21 1:03 pm\u003C/p>\u003Cp>\u003Cspan>Families: Update to our on-campus activity: All students are reporting to fifth period while law enforcement completes the next phase of its response. This includes accounting for every student on campus and assisting any students who may have gone to nearby shopping centers during the initial law enforcement response with returning to campus. Once all students have been accounted for, instruction will resume and the lockout will be lifted, meaning normal access to and from campus will be restored. Parents who choose to pick up their student may do so once this process is complete; however, there is no requirement to do so, as instruction will continue as planned. Parents, thank you for being attentive to these updates and for your continued partnership in safety. We are grateful to our students and staff for following our safety protocols as trained, and to our law enforcement partners for their swift, thorough, and protective response.\u003C/span>\u003C/p>\u003Cp>\u003C/p>\u003Cp>4/21 12:35 pm\u003C/p>\u003Cp>Families and staff: This message is to inform you that an anonymous tip was reported to the Stuart Police Department today regarding weapons and our campus. Law enforcement responded and immediately and thoroughly searched our campus. Based on that thorough investigation, the tip has been determined to be not credible. Please know that our students and staff remain safe. Law enforcement presence continues on our campus- for that reason, no one is permitted to come onto or leave our property at this time. We thank you for your concern and continued support of our school. We will share additional information as it becomes available.\u003C/p>",{"url":79,"alt_text":79},{"id":2499,"secondary_organization_id":22,"secondary_organization_ids":2500,"content":2502,"image":2503,"status":6,"style":2472,"display_location":2473,"featured":12},45080,[22,86,92,98,104,110,116,122,128,134,140,146,152,158,164,170,176,182,188,194,200,206,212,218,224,230,2501],21836,"\u003Cp>🚌 Back-to-School Information is Here! 🚌\u003C/p>\u003Cp>\u003Cspan>The A-rated Martin County School District is excited to welcome students and families to the 2026–2027 school year! Whether you’re preparing for the first day of kindergarten or the final year of high school, our \u003C/span>\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.martinschools.org/o/mcsd/page/reopening-2026-2027\">Back-to-School page\u003C/a>\u003Cspan> has everything you need in one convenient place.\u003C/span>\u003C/p>\u003Cp>\u003Cspan>🍎We'll see you  on August 10!\u003C/span>\u003C/p>",{"url":79,"alt_text":79},{"id":2505,"secondary_organization_id":22,"secondary_organization_ids":2506,"content":2507,"image":2508,"status":6,"style":2472,"display_location":2473,"featured":12},46311,[22,86,92,98,104,116,122,128,134,140,146,152,158,164,170,176,182,194,200,206,218,224,230],"\u003Cp>Callers attempting to reach a District school or department may occasionally be routed to a different location.\u003C/p>\u003Cp>Calls are being received; however, if you reach a site other than the one you intended to contact, please \u003Cstrong>press 0\u003C/strong> to reach the front office and request a transfer to the correct school or department.\u003C/p>\u003Cp>Thank you for your patience and understanding as we work to restore normal service. We apologize for any inconvenience.\u003C/p>",{"url":79,"alt_text":79},["EmptyRef",1966],{"hasSections":2511,"pageFilters":2512,"allEvents":2515,"fetchingEvents":2518,"sections":2520,"filters":2523,"selectedCalendars":2526,"selectedFilters":2529,"selectedFilter":2532,"currentView":2535,"listViewType":2537,"currentDate":2539,"calendarViewType":2541,"queryParams":2543,"searchText":2546,"lastFocusedElem":2547,"lastView":2548,"searchTagText":2549,"selectedYear
