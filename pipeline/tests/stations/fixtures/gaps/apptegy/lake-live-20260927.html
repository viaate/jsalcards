d5af7a9b6fe_0":1635,"55d5d77f-dec5-442c-bfcd-f25b6dbf4d92_0":1744,"66bdff5f-1bc5-449e-bf6f-10f77b3471f7_0":1750,"8c84ca9d-bec7-4817-bf6e-1a7daef6c310_0":1761,"aa76c52f-f4ad-4770-a99b-4f1f5f04803e_0":1906,"bb26fd8a-3617-42f6-81e0-b07cbec72c5a_0":1986,"d70a36a6-686a-4f28-b8ef-3e86a9feb7a4_0":2022},{"loop":1613,"image":1614,"input":1615,"textarea":1616,"rich_textarea":1617},{},{},{},{},{},{"icon":1619,"loop":1620,"image":1621,"input":1625,"textarea":1631,"rich_textarea":1632},{},{},{"enroll-image":1622},{"url":1623,"alt_text":1624,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330301/94b3097e-4621-42d7-ab21-e79f99052c4c.png","A group of people in green and black shirts posing for a photo in front of a yellow school bus.",{"enroll-btn":1626,"enroll-title":1630},{"href":1627,"text":1628,"target":1629},"https://www.lake.k12.fl.us/o/lcs/page/lcs-enrollment","Enroll Today","_blank",{"text":1628},{},{"enroll-text":1633},{"text":1634},"\u003Cp>\u003Cspan>From early learning and academic excellence to career preparation, athletics, arts, and hands-on experiences, Lake County Schools offers every student a pathway to success. Join the thousands of families who have chosen a public education that is innovative, transparent, and focused on helping every child reach their full potential. We look forward to welcoming your family to Lake County Schools.\u003C/span>\u003C/p>",{"icon":1636,"loop":1637,"image":1735,"input":1736,"textarea":1741,"rich_textarea":1743},{},{"programs-wrapper-v10":1638},[1639,1653,1665,1678,1691,1702,1713,1724],{"image":1640,"input":1644,"textarea":1650},{"program-image-v10":1641},{"url":1642,"alt_text":1643,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330841/a55ee26a-5761-4bfc-a7e6-b0007527e51e.jpeg","A red and white building with a gray roof. Cars are parked on the street.",{"program-link-v10":1645,"program-title-v10":1648},{"href":1646,"text":1647,"target":973},"https://www.lake.k12.fl.us/page/college-and-career-readiness","Learn More",{"text":1649},"Dual Enrollment",{"program-text-v10":1651},{"text":1652},"Through Dual Enrollment, students can earn college credit while completing their high school education—all at no cost to families. These courses provide a challenging academic experience, help students explore future career and education pathways, and allow them to graduate with college credits already completed, saving both time and money.",{"image":1654,"input":1658,"textarea":1662},{"program-image-v10":1655},{"url":1656,"alt_text":1657,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330236/eeacd1c5-3b19-406d-a780-62c707ed74ac.png","Three women stand next to each other; one wears a cap and gown, another a green hoodie, and the third a white shirt.",{"program-link-v10":1659,"program-title-v10":1660},{"href":1646,"text":1647,"target":973},{"text":1661},"AVID",{"program-text-v10":1663},{"text":1664},"AVID (Advancement Via Individual Determination) equips students with the skills, habits, and support they need to succeed in rigorous coursework and beyond. Through academic coaching, organization strategies, goal setting, and college and career exploration, AVID helps students build confidence, strengthen leadership skills, and prepare for future opportunities.",{"image":1666,"input":1670,"textarea":1675},{"program-image-v10":1667},{"url":1668,"alt_text":1669,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330241/b12e1a1f-684b-42cd-a16d-9754470891c7.png","Two young girls with glasses, one with pink bows, stand next to each other and smile.",{"program-link-v10":1671,"program-title-v10":1673},{"href":1672,"text":1647,"target":1629},"https://www.lake.k12.fl.us/o/lcs/page/voluntary-pre-kindergarten-vpk",{"text":1674},"VPK",{"program-text-v10":1676},{"text":1677},"Voluntary Prekindergarten (VPK) helps young learners develop the skills they need for success in kindergarten and beyond. Through engaging, age-appropriate instruction, children build early literacy, math, communication, and social skills in a nurturing learning environment. VPK is offered in all elementary schools and our district’s full-day VPK academy, Rimes Early Learning & Literacy Center",{"image":1679,"input":1683,"textarea":1688},{"program-image-v10":1680},{"url":1681,"alt_text":1682,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330245/e3df152e-5a40-4f0e-8205-d2f057c8b7ca.png","Football players wearing helmets and jerseys run onto the field. Two large flags are held in front of them.",{"program-link-v10":1684,"program-title-v10":1686},{"href":1685,"text":1647,"target":973},"https://www.lake.k12.fl.us/page/district-athletics",{"text":1687},"Competitive Athletics",{"program-text-v10":1689},{"text":1690},"Competitive athletics provide students with opportunities to develop teamwork, leadership, discipline, and perseverance while representing their schools and communities. Through a wide range of athletic programs, Lake County Schools student-athletes build healthy habits, strengthen character, and learn valuable life lessons that extend far beyond the playing field",{"image":1692,"input":1696,"textarea":1699},{"program-image-v10":1693},{"url":1694,"alt_text":1695,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330250/ecda665d-d32e-436a-8892-24084ae00656.png","Four kids in black shirts, wearing watches, work on a project at a table. One child holds a tool.",{"program-title-v10":1697},{"text":1698},"STEAM Bowl",{"program-text-v10":1700},{"text":1701},"The annual STEAM Bowl challenges students to apply their science, technology, engineering, arts, and mathematics skills through exciting, hands-on competition. Elementary and middle school teams work together to solve math and science problems while tackling an engineering design challenge that encourages creativity, critical thinking, and collaboration.",{"image":1703,"input":1707,"textarea":1710},{"program-image-v10":1704},{"url":1705,"alt_text":1706,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330253/e8eec495-3698-4b2e-8aef-9b2a09ee2442.png","A woman stands by a cardboard display board, pointing at it while holding a folder. Children sit in chairs behind her.",{"program-title-v10":1708},{"text":1709},"Science Fair",{"program-text-v10":1711},{"text":1712},"The annual science fair encourages students to investigate real-world questions through hands-on research and experimentation. By applying the scientific method, students develop critical thinking, problem-solving, and communication skills while exploring topics that spark their curiosity. ",{"image":1714,"input":1718,"textarea":1721},{"program-image-v10":1715},{"url":1716,"alt_text":1717,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330260/6adbcf29-320e-4043-b30f-8a14085848ed.png","Two military personnel in uniform, one holding a blue drone and the other a black device, with a wooden box behind them.",{"program-title-v10":1719},{"text":1720},"JROTC",{"program-text-v10":1722},{"text":1723},"JROTC helps students develop leadership, responsibility, citizenship, and teamwork through hands-on learning experiences both in and out of the classroom. Through community service, leadership training, academic achievement, and character development, students build confidence and valuable life skills that prepare them for success after graduation. ",{"image":1725,"input":1729,"textarea":1732},{"program-image-v10":1726},{"url":1727,"alt_text":1728,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330265/1881558a-3afd-41b8-8e26-8fd3fe971d78.png","A robotics team in green uniforms poses with a robot and banners. One banner reads \"FIRST Robotics Competition\" and \"WINNER 2016\".",{"program-title-v10":1730},{"text":1731},"Robotics",{"program-text-v10":1733},{"text":1734},"Robotics competitions combine engineering, technology, coding, and teamwork as students design, build, and program robots to complete a variety of challenges. Participants develop problem-solving, collaboration, and technical skills that form the foundation for future high-demand STEAM careers.",{},{"header-top-v10":1737,"header-bottom-v10":1738,"see-all-button-custom-v10":1740},{"text":79},{"text":1739},"Explore Programs",{"text":79},{"intro-v10":1742},{"text":79},{},{"loop":1745,"image":1746,"input":1747,"textarea":1748,"rich_textarea":1749},{},{},{},{},{},{"icon":1751,"loop":1752,"image":1753,"input":1754,"textarea":1757,"rich_textarea":1758},{},{},{},{"content-title-1":1755},{"text":1756},"Choose Lake County Schools... where creativity comes to life.",{},{"content-description":1759},{"text":1760},"\u003Cp>\u003Cspan>The arts play a vital role in a well-rounded education, helping students develop creativity, confidence, discipline, and collaboration skills that benefit them in the classroom and beyond. Through band, choir, dance, theater, visual arts, and other enriching programs, Lake County Schools students have opportunities to explore their talents, express themselves, and build lasting connections with their peers and community. Whether performing on stage, creating original artwork, or mastering a musical instrument, students gain experiences that inspire lifelong learning and personal growth.\u003C/span>\u003C/p>",{"icon":1762,"loop":1763,"image":1895,"input":1899,"textarea":1902,"rich_textarea":1905},{},{"video-stories-slides":1764},[1765,1778,1791,1804,1817,1830,1843,1856,1869,1882],{"image":1766,"input":1770,"textarea":1775},{"video-image":1767},{"url":1768,"alt_text":1769,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330370/3c0ba248-a4f6-4849-9d64-8fefd576f1df.jpeg","Woman with long hair wearing a black shirt, smiling at the camera, with a white wall and signs behind her.",{"video-link":1771,"video-title":1773},{"href":1772,"text":1772,"target":1629},"https://youtu.be/BDzR0qc2p3c",{"text":1774},"Elizabeth Kelly",{"video-textarea":1776},{"text":1777},"Dual enrollment helped make Lake County Schools the right choice for this 2025 graduate.",{"image":1779,"input":1783,"textarea":1788},{"video-image":1780},{"url":1781,"alt_text":1782,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330389/c153a671-de8b-42b6-a16a-6653b51e85ae.jpeg","Person in a blue hoodie stands in a room with bunk beds and a mirror.",{"video-link":1784,"video-title":1786},{"href":1785,"text":1785,"target":1629},"https://youtu.be/8dgMtcuxeFI",{"text":1787},"Abigail Mayuski",{"video-textarea":1789},{"text":1790},"Advanced Placement courses at Lake County Schools gave this 2025 graduate the preparation she needed to succeed in college.",{"image":1792,"input":1796,"textarea":1801},{"video-image":1793},{"url":1794,"alt_text":1795,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330774/6b1aeaab-cd5a-44c6-9c51-e8ca1a0f8e7e.jpeg","Two women stand close, facing camera. One wears a white shirt; the other wears a blue shirt. A picture frame and a ceiling fan are in the background.",{"video-link":1797,"video-title":1799},{"href":1798,"text":1798,"target":1629},"https://youtu.be/EK4Fhtm1QuE",{"text":1800},"Laura Stubits and Samantha",{"video-textarea":1802},{"text":1803},"Phenomenal teachers and principals made all the difference for this mother and daughter. ",{"image":1805,"input":1809,"textarea":1814},{"video-image":1806},{"url":1807,"alt_text":1808,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330423/ff6d1040-79f7-48ab-b189-52fd46c5a008.jpeg","Man in a plaid shirt stands in front of a lake with trees and blue sky.",{"video-link":1810,"video-title":1812},{"href":1811,"text":1811,"target":1629},"https://youtu.be/xsjX4QAd0zU",{"text":1813},"Justin Coffman",{"video-textarea":1815},{"text":1816},"This 2026 graduate found Lake County Schools’ virtual courses to be the right fit for him.",{"image":1818,"input":1822,"textarea":1827},{"video-image":1819},{"url":1820,"alt_text":1821,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6376164/c59661da-9fed-4516-8145-f4481d2f3510.jpeg","A person with long hair stands before a glass wall featuring a paw print. The person looks directly at the camera.",{"video-link":1823,"video-title":1825},{"href":1824,"text":1824,"target":973},"https://youtu.be/ZZijnTBkWAU",{"text":1826},"Amanda Ragunandan",{"video-textarea":1828},{"text":1829},"An opportunity to learn with a wide variety of students was a deciding factor for this mom. ",{"image":1831,"input":1835,"textarea":1840},{"video-image":1832},{"url":1833,"alt_text":1834,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6376247/48d649fb-20ed-4f3c-98e1-7aa66566e2af.jpeg","A woman with long blonde hair and glasses on her head smiles in an indoor setting.",{"video-link":1836,"video-title":1838},{"href":1837,"text":1837,"target":973},"https://youtu.be/hslLZmMT64w",{"text":1839},"Amanda Olivieri",{"video-textarea":1841},{"text":1842},"This mom found that a traditional public school held the academic challenges and arts focus she wanted for her child.  ",{"image":1844,"input":1848,"textarea":1853},{"video-image":1845},{"url":1846,"alt_text":1847,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6376769/e4c9ca60-3287-48bd-a6ac-dbe4717324c3.png","Man in blue jacket with white undershirt, light blue background. He has a beard and a slight smile.",{"video-link":1849,"video-title":1851},{"href":1850,"text":1850,"target":973},"https://youtu.be/n6FM422dF1E",{"text":1852},"The Taylors",{"video-textarea":1854},{"text":1855},"Open communication is a key reason why public school is this couple's choice for their middle school child.",{"image":1857,"input":1861,"textarea":1866},{"video-image":1858},{"url":1859,"alt_text":1860,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6376321/52d805de-9197-469b-be2c-db022accb4a6.jpeg","A woman with curly brown hair in a black blouse stands next to a door with a room number sign.",{"video-link":1862,"video-title":1864},{"href":1863,"text":1863,"target":1629},"https://youtu.be/XajzMFXUhOY",{"text":1865},"Savannah McMennamy",{"video-textarea":1867},{"text":1868},"For this mom, public schools offer \"a true representation of the world [her children] are going to be living in.\" ",{"image":1870,"input":1874,"textarea":1879},{"video-image":1871},{"url":1872,"alt_text":1873,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6376418/b3cf7d61-ff7c-4cac-8bae-221815e8169c.jpeg","A woman with curly hair wearing glasses stands against a brick wall, holding a black object. She wears a pink floral-print top.",{"video-link":1875,"video-title":1877},{"href":1876,"text":1876,"target":973},"https://youtu.be/dVbX2GwkC0I",{"text":1878},"Isabella",{"video-textarea":1880},{"text":1881},"The freedom of expression allowed in public schools is important to high school students like Isabella.",{"image":1883,"input":1887,"textarea":1892},{"video-image":1884},{"url":1885,"alt_text":1886,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6376476/f6c4df5e-0ae3-4e79-a8d1-0c0ffdcbb4e6.jpeg","A person with blond hair and a blue shirt stands in front of a brick wall.",{"video-link":1888,"video-title":1890},{"href":1889,"text":1889,"target":1629},"https://youtu.be/lSfYCjOHUHY",{"text":1891},"Wyatt",{"video-textarea":1893},{"text":1894},"More people to socialize with + more opportunities = a winning combination at public schools for high school students like Wyatt.",{"videos-intro-image":1896},{"url":1897,"alt_text":1898,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6328653/c71eb28e-4cee-457f-9ca9-66730b88b9fb.png","A group of children run in a hallway with metal railings and buildings in the background.",{"video-stories-title-bottom":1900},{"text":1901},"Real Voice. Real Choice.",{"intro-textarea":1903},{"text":1904},"When it comes to choosing a school, no one tells the story better than the families and students who have lived it. In these short videos, parents and graduates share their personal experiences with Lake County Schools and the lasting impact our teachers, programs, and opportunities have had on their lives.",{},{"icon":1907,"loop":1908,"image":1982,"input":1983,"textarea":1984,"rich_textarea":1985},{},{"cta-list":1909},[1910,1922,1938,1952,1968],{"image":1911,"input":1915,"rich_textarea":1919},{"cta-item-image":1912},{"url":1913,"alt_text":1914,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6332985/b874ea2b-dfc2-4af2-acad-6ceae0f00ba4.png","Four women in matching blue jerseys stand together in front of a brick building, sharing a laugh.",{"cta-item-title":1916,"cta-item-button":1918},{"text":1917},"Why Lake County Schools?",{"text":79},{"cta-item-text":1920},{"text":1921},"\u003Cp>\u003Cspan>It’s a competitive world, and students need a competitive edge to succeed. At Lake County Schools, we combine rigorous academics with real-world learning experiences that prepare students for college, careers, and life. Our classrooms are led by certified professional educators, our schools are guided by award-winning leaders, and as a public school district, we are committed to transparency and accountability in everything we do. We offer excellence without limits, practicality with purpose, a warm and nurturing learning environment, and a clear view of how our schools are helping students achieve their full potential.\u003C/span>\u003C/p>",{"image":1923,"input":1927,"rich_textarea":1935},{"cta-item-image":1924},{"url":1925,"alt_text":1926,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330139/93c2b65e-8987-4680-90f9-c81d01993c32.png","A child wearing an apron and gloves tends to a garden with plants in front of a fence.",{"cta-item-title":1928,"cta-item-image-title":1930,"cta-item-image-button":1932},{"text":1929},"Choose the School You Want",{"text":1931},"Explore School Choice",{"href":1933,"text":1934,"target":1629},"https://www.lake.k12.fl.us/page/school-choice-alternative-education","Find the best fit",{"cta-item-text":1936},{"text":1937},"\u003Cp>We believe that parents should have the right to choose the school they believe is the best fit for their child. We also believe that the best school for the vast majority of students in our communities can be found right here in our school district. We offer a wide range of tuition-free school choice programs designed to meet the diverse needs and interests of our students.\u003C/p>",{"image":1939,"input":1943,"rich_textarea":1949},{"cta-item-image":1940},{"url":1941,"alt_text":1942,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330165/25736feb-8658-4121-8bfe-5351297d2b16.png","A classroom with students seated at desks. Four people are using laptops. A whiteboard is visible in the background.",{"cta-item-title":1944,"cta-item-image-title":1946,"cta-item-image-button":1948},{"text":1945},"College Readiness. Future Success.",{"text":1947},"Cambridge Advanced International Certification of Education (AICE)",{"href":1646,"text":1647,"target":1629},{"cta-item-text":1950},{"text":1951},"\u003Cp>\u003Cspan>We offer the Cambridge Advanced International Certificate of Education (AICE) program as an accelerated learning option that helps prepare students for college and future success. Through rigorous coursework and AICE exams, students can earn college credits tuition-free before graduating high school. For eligible students in Florida, earning the Cambridge AICE Diploma can also lead to a full Bright Futures scholarship covering 100 percent of tuition at a state college or university.\u003C/span>\u003C/p>",{"image":1953,"input":1957,"rich_textarea":1965},{"cta-item-image":1954},{"url":1955,"alt_text":1956,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6330198/825b5f7d-8aec-4e0c-97c5-6491d0d97b70.png","Students sit at desks, writing in notebooks. One student drinks coffee. Desks are arranged in rows.",{"cta-item-title":1958,"cta-item-button":1960,"cta-item-image-title":1961,"cta-item-image-button":1963},{"text":1959},"Globally Recognized. Locally Delivered.",{"text":79},{"text":1962},"International Baccalaureate (IB)",{"href":1964,"text":1647,"target":1629},"https://ths.lake.k12.fl.us/o/ths/page/ib-international-baccalaureate-program",{"cta-item-text":1966},{"text":1967},"\u003Cp>\u003Cspan>Through the International Baccalaureate program, students receive an international education experience that prepares them for college and beyond. This globally recognized educational framework is designed to develop inquiring, knowledgeable, and caring students. It provides a comprehensive, pre-university curriculum that emphasizes critical thinking, research skills, and global citizenship. Students can earn college course credits and/or the IB Diploma with the possibility of a Bright Futures scholarship to attend a Florida public university.&nbsp;\u003C/span>\u003C/p>",{"image":1969,"input":1973,"rich_textarea":1979},{"cta-item-image":1970},{"url":1971,"alt_text":1972,"ai_generated_alt_text":12},"https://cmsv2-assets.apptegy.net/uploads/19157/file/6332930/6f45e251-2f12-40c4-a380-bd1a4600316f.png","Person in protective gear driving a blue tractor with a front loader through a barn.",{"cta-item-title":1974,"cta-item-image-title":1976,"cta-item-image-button":1978},{"text":1975},"Workforce Ready",{"text":1977},"Industry Certifications",{"href":1646,"text":1647,"target":1629},{"cta-item-text":1980},{"text":1981},"\u003Cp>\u003Cspan>At Lake County Schools, Career and Technical Education (CTE) transforms learning into opportunity. Students explore career interests, develop in-demand skills, earn industry certifications, and gain real-world experience while still in high school. Our CTE programs prepare graduates to enter the workforce with confidence, pursue advanced training, or continue their education at a college or university. By connecting students to high-growth industries and meaningful career pathways, we're helping them build the skills, credentials, and experience needed to succeed from day one. Last school year, our students earned 2,450 industry certifications through CTE.\u003C/span>\u003C/p>",{},{},{},{},{"icon":1987,"loop":1988,"image":2016,"input":2017,"textarea":2020,"rich_textarea":2021},{},{"custom_buttons":1989},[1990,1998,2007],{"icon":1991,"input":1995},{"custom-button-icon":1992},{"icon":1993,"icon_id":1994},"\u003Csvg id='Layer_1' data-name='Layer 1' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 39.8 42.1'>\u003Cpath d='M30.7,33.6V27.8h0a6.87,6.87,0,0,0-5-6.6,4.3,4.3,0,1,0-3.8,0,6.87,6.87,0,0,0-5,6.6h0v5.8a.94.94,0,0,0,1,1h1.7l1.2,9.6a1.06,1.06,0,0,0,1,.9h3.9a1.06,1.06,0,0,0,1-.9l1.2-9.6h1.7A1,1,0,0,0,30.7,33.6ZM23.9,15a2.3,2.3,0,1,1-2.3,2.3A2.26,2.26,0,0,1,23.9,15Zm4.8,17.6H26.8c-.1,0-.1.1-.2.1s-.1.1-.2.1l-.1.1a.35.35,0,0,0-.1.2c0,.1,0,.1-.1.2v.1L24.9,43H22.8l-1.2-9.6v-.1c0-.1,0-.1-.1-.2s-.1-.1-.1-.2-.1-.1-.1-.2l-.1-.1c-.1,0-.1-.1-.2-.1H19V27.7h0a4.9,4.9,0,0,1,9.8,0h0v4.9Z' transform='translate(-4 -3)'/>\u003Cpath d='M40.7,9a6,6,0,1,0-12,0,6,6,0,1,0,12,0Zm-6,4a4,4,0,1,1,4-4A4,4,0,0,1,34.7,13Z' transform='translate(-4 -3)'/>\u003Cpath d='M43.7,25.6c0-6.4-3.5-10.6-9-10.6h0a8.61,8.61,0,0,0-5.3,1.7,1.08,1.08,0,0,0-.2,1.4.91.91,0,0,0,.8.4,1.42,1.42,0,0,0,.6-.2A6.29,6.29,0,0,1,34.7,17h0c5.2,0,7,4.4,7,8.6V31H39.4c-.1,0-.1,0-.2.1s-.1.1-.2.1l-.1.1a.35.35,0,0,0-.1.2c0,.1-.1.1-.1.2v.1L36.9,43H32.6l-.9-6.1a1,1,0,0,0-1.9.3l1,7a1.06,1.06,0,0,0,1,.9h6a1.08,1.08,0,0,0,1-.8L40.6,33h2.2a.94.94,0,0,0,1-1V25.7c-.1,0-.1,0-.1-.1Z' transform='translate(-4 -3)'/>\u003Cpath d='M19,9a5.89,5.89,0,0,0-6-6A5.89,5.89,0,0,0,7,9a5.89,5.89,0,0,0,6,6A5.89,5.89,0,0,0,1 ":2887,"status":2891,"style":2892,"display_location":2893,"featured":12},14483,[22,87,93,99,105,111,117,123,129,135,141,147,153,159,165,171,177,183,189,195,201,207,213,219,225,231,237,243,249,255,261,267,273,279,285,291,297,303,309,315,321,327,357,363,369],"\u003Cp>Schools and district offices are open today, Friday, Sept. 27.  Power is out at Tavares Elementary, but restoration is expected between 8:30 a.m. and 9:30 a.m. Grab-and-go breakfasts are available for students and we are ready to receive them. \u003C/p>\u003Cp>We are following our regular schedule at all schools. However, if parents need to bring students late, the students will not be marked tardy. Absences will be excused.\u003C/p>",{"url":2888,"alt_text":2889,"asset_id":2890},"https://cmsv2-assets.apptegy.net/uploads/19157/file/3763411/326f110f-bd7b-4068-b1b4-058892509a62.png","Lake County schools are open today. Absences excused. ",3763411,"draft","light_box","homepage",{"id":2895,"secondary_organization_id":22,"secondary_organization_ids":2896,"content":2897,"image":2898,"status":2891,"style":2892,"display_location":2893,"featured":12},15672,[22,87,93,99,105,111,117,123,129,135,141,147,153,159,165,171,177,183,189,195,201,207,213,219,225,231,237,243,249,255,261,267,273,279,285,291,297,303,309,315,321,327,357,363,369],"\u003Cp>Lake County public schools will reopen on Monday, October 14. \u003C/p>\u003Cp>We have walked all campuses to ensure we are prepared for the safe return of students and staff. We have also assessed bus routes and found the vast majority of roadways to be clear. Where there are exceptions, the Transportation Department will contact parents of bus riders in those areas and, when possible, offer alternate bus stop locations. \u003C/p>\u003Cp>We recognize that the past few days during and after Hurricane Milton have been difficult for many in our community. We appreciate your continued patience and support as we work together to get back to normal. \u003C/p>\u003Cp>We look forward to welcoming everyone back on Monday.\u003C/p>",{"url":2899,"alt_text":2900,"asset_id":2901},"https://cmsv2-assets.apptegy.net/uploads/19157/file/3833364/a339fc10-a901-4c72-a4b3-692f5901bbc7.png","Lake County Schools reopen on Monday, Oct. 14",3833364,{"id":2903,"secondary_organization_id":22,"secondary_organization_ids":2904,"content":2905,"image":2906,"status":2891,"style":2892,"display_location":2907,"featured":12},22558,[22],"\u003Cp style=\"text-align: center\">College and Career Readiness Program Choice is open from March 3-March 31, 2025. Please scroll all they way to the bottom on page once you have clicked the link to find the application.\u003C/p>\u003Cp style=\"text-align: center\">Please visit the \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.lake.k12.fl.us/o/lcs/page/educational-choice-transfer-ect\">Educational Choice Page\u003C/a>\u003C/p>",{"url":79,"alt_text":79},"all_pages",{"id":2909,"secondary_organization_id":22,"secondary_organization_ids":2910,"content":2911,"image":2912,"status":6,"style":2892,"display_location":2893,"featured":12},22812,[22],"\u003Ch2 style=\"text-align: center\">\u003Cstrong>Lincoln Park \u003C/strong>\u003C/h2>\u003Cp style=\"text-align: center\">\u003Cstrong>Now enrolling for the 2025-26 school year\u003C/strong>\u003C/p>\u003Cp style=\"text-align: center\">Morning session, 7:15 a.m. - 12:27 p.m.\u003C/p>\u003Cp style=\"text-align: center\">\u003Cstrong>\u003Cem>40 seats available\u003C/em>\u003C/strong>\u003C/p>\u003Cp style=\"text-align: center\">Afternoon session, 1:48 p.m. - 7:00 p.m.\u003C/p>\u003Cp style=\"text-align: center\">\u003Cstrong>\u003Cem>80 seats available\u003C/em>\u003C/strong>\u003C/p>\u003Cp style=\"text-align: center\">\u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://docs.google.com/forms/d/e/1FAIpQLSdilSBgw-9Kjqj9yTveGJrlwP-0bZjZJA0t4RZyH-IeIYGeCw/viewform\">\u003Cstrong>Register Now\u003C/strong>\u003C/a>\u003C/p>",{"url":79,"alt_text":79},{"id":2914,"secondary_organization_id":22,"secondary_organization_ids":2915,"content":2916,"image":2917,"status":6,"style":2892,"display_location":2893,"featured":12},23232,[22,87,93,99,111,117,123,129,135,141,147,159,165,171,177,183,189,195,201,207,213,219,225],"\u003Ch1 style=\"text-align: center\">VPK Applications are Now Open\u003C/h1>\u003Ch2 style=\"text-align: center\">Applications are being accepted now!\u003C/h2>\u003Ch2 style=\"text-align: center\">Please visit our \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://lakecountyfl.sites.thrillshare.com/o/lcs/page/voluntary-pre-kindergarten-vpk\">VPK webpage\u003C/a> for program details and to apply. \u003C/h2>",{"url":79,"alt_text":79},{"id":2919,"secondary_organization_id":22,"secondary_organization_ids":2920,"content":2921,"image":2922,"status":6,"style":2892,"display_location":2893,"featured":12},37165,[22],"\u003Cp>In an effort to engage our stakeholders in a system of continuous improvement, Lake County Schools invites you to participate in the 2026 Stakeholder Survey.  Surveys should take no more than 10 minutes to complete, are anonymous, and can be accessed using an electronic device with internet access.\u003C/p>\u003Cp>To complete the 2026 Stakeholder Survey please click \u003Ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://eprovesurveys.advanc-ed.org/surveys/#/action/299325/p2577\" relative-link=\"\">HERE\u003C/a>.\u003C/p>\u003Cp>\u003C/p>",{"url":2923,"alt_text":2924,"asset_id":2925},"https://cmsv2-assets.apptegy.net/uploads/19157/file/5669359/ba345e96-ba87-4034-bbb6-ea5db8625042.jpeg","A picture of smiling students with the Lake County Schools logo, and text of \"Your Voice Matters\"",5669359,{"id":2927,"secondary_organization_id":22,"secondary_organization_ids":2928,"content":2929,"image":2930,"status":6,"style":2931,"display_location":2907,"featured":12},45618,[22],"\u003Cp>Test Banner\u003C/p>",{"url":79,"alt_text":79},"banner",{"id":2933
